/* ========================================================================
   TOKENS
   Axis law: every token ending -x responds to vw. Every token ending -y
   responds to svh. Display type is capped on BOTH axes. px appears only on
   --bw and --br. Root font-size stays 16px — no vw-scaled root, no zoom,
   no transform:scale() stage.

   OWNER RULING (supersedes DNA 2 / 1 / 10.1 for this build only):
   radius is 2px on both postures, brand-green fill takes #FAFAFA text, and
   the inset highlight ships on brand-filled primaries. Those three come
   from the shipped Founder Flow. Every other DNA rule stands.
   ======================================================================== */
:root{
  /* brand */
  --brand:#41ED98; --brand-hover:#3BDC8C; --brand-5:rgba(65,237,152,.05); --brand-15:rgba(65,237,152,.15);
  --white:#FAFAFA; --pure:#FFFFFF;
  --forest:#013F17; --night:#012D10; --light:#E9FFE1; --pale:#D2FBC2;
  --muted:#669370; --mid:#95C79D; --grey:#A2AFA8;
  --grey-l:#F1F3F2; --grey-ll:#F7F7F7; --sect-light:#EAF7EE; --stat-green:#5BAA78;
  --blue:#DEFAFC; --yellow:#F7FF9E; --row-blue:#DEF6FF;
  --dark-line:rgba(233,255,225,.35);
  --g-green:#006D27; --g-blue:#10E9FC; --g-yellow:#FFFC56;

  /* border + radius — the only px in the system */
  --bw:2px; --br:2px;

  /* horizontal — vw-driven */
  --page-gutter-x:clamp(1.25rem,4.2vw,4.5rem);
  --group-gap-x:clamp(.75rem,1.6vw,1.5rem);

  /* vertical — svh-driven */
  --chrome-gap-y:clamp(3.5rem,7.5svh,5.25rem);
  --chrome-pad-y:clamp(.75rem,1.6svh,1.25rem);
  --stage-pad-y:clamp(1.25rem,4.5svh,3.5rem);
  --group-gap:clamp(.75rem,1.8svh,1.5rem);
  --section-gap:clamp(2.5rem,7.5svh,6rem);
  --phase-gap:clamp(4rem,12svh,10rem);

  /* frames — widened one step from the contracts' 52/72/92 so compositions actually
     use the page on a large monitor. Reading measure is capped separately by
     --copy-max below, so text never stretches with the frame (DNA 9.1). */
  --frame-narrow:min(62rem,100%); --frame-standard:min(86rem,100%); --frame-wide:min(108rem,100%);
  --copy-max:min(62ch,100%); --copy-max-lede:min(46ch,100%); --copy-max-head:min(20ch,100%);

  /* objects — capped on both axes */
  --hero-num:clamp(3.25rem,min(10.5vw,13svh),8.5rem);
  --dossier-media:clamp(4.5rem,min(9vw,11svh),7.5rem);
  --recap-stage:clamp(12rem,min(46vw,52svh),34rem);
  --upload-surface-h:clamp(9rem,min(22vw,30svh),18rem);

  /* type */
  --h1:clamp(1.9rem,min(4.4vw,5.6svh),3.4rem);
  --h2:clamp(1.5rem,min(3vw,4svh),2.3rem);
  --h3:clamp(1.15rem,min(1.9vw,2.6svh),1.5rem);
  --body:clamp(.95rem,min(1.15vw,1.7svh),1.0625rem);
  --small:clamp(.85rem,min(.98vw,1.4svh),.95rem);
  --micro:clamp(.7rem,min(.82vw,1.2svh),.8rem);
  --tag:clamp(.62rem,min(.74vw,1.05svh),.72rem);
  --tag-ls:.1em;

  /* controls */
  --ctrl-p-h:clamp(3.25rem,min(5.2vw,8svh),5rem);
  --ctrl-p-minw:clamp(14rem,34%,20rem);
  --ctrl-p-pad-x:clamp(1.25rem,2.4vw,2.75rem);
  --ctrl-p-type:clamp(1rem,min(1.35vw,2.1svh),1.35rem);
  --ctrl-s-h:clamp(3rem,min(4vw,6.4svh),4rem);
  --ctrl-t-h:clamp(2.75rem,min(3.4vw,5.4svh),3.5rem);
  --ctrl-n-h:2.75rem;

  --cta-inset:0 3px 12px rgba(255,255,255,.42) inset;
}
@media (max-width:600px){ :root{ --bw:1px; --br:2px; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html,body{margin:0;padding:0;background:var(--white);overscroll-behavior:none}
body{font-family:Satoshi,system-ui,-apple-system,sans-serif;font-weight:500;color:var(--forest);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;border-radius:var(--br)}
::selection{background:var(--brand-15)}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

/* ---- fail-loud strip (DNA 6.6) ---- */
#failstrip{position:sticky;top:var(--chrome-gap-y);z-index:60;display:none;flex-direction:column}
#failstrip p{background:var(--yellow);color:var(--night);font-weight:700;font-size:var(--small);
  padding:.7rem var(--page-gutter-x);margin:0}

/* ---- top band ---- */
.band{position:sticky;top:0;z-index:50;height:var(--chrome-gap-y);background:var(--white);
  display:flex;align-items:center;gap:var(--group-gap-x);padding:0 var(--page-gutter-x)}
.band img.wm{height:clamp(1.5rem,3svh,2.125rem);width:auto;display:block;flex:0 0 auto}
.band .dayline{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:.5ch;
  font-size:var(--small);font-weight:700;letter-spacing:-.01em;color:var(--forest);
  white-space:nowrap;overflow:hidden}
.band .dayline .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.band .dayline .ph{color:var(--brand);flex:0 0 auto}
.band .dayline .sep{color:var(--grey);flex:0 0 auto}
.band .dayline .rest{flex:0 0 auto;color:var(--muted);font-weight:500}
.band .right{flex:0 0 auto;display:flex;align-items:center;gap:.6rem}
.explore-btn{height:var(--ctrl-n-h);min-width:var(--ctrl-n-h);padding:0 1.1rem;border:var(--bw) solid var(--brand);
  border-radius:var(--br);color:var(--brand);font-size:var(--micro);font-weight:900;
  letter-spacing:var(--tag-ls);text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:600px){ .explore-btn{padding:0;width:var(--ctrl-n-h)} .explore-btn span{display:none} }

/* ---- stage ---- */
.stage{padding:var(--stage-pad-y) var(--page-gutter-x) calc(var(--stage-pad-y) * 1.4);
  min-height:calc(100svh - var(--chrome-gap-y));display:flex;flex-direction:column}
.stage.top-work{justify-content:flex-start}
.stage.mid-decision{justify-content:center}
.stage.center-reveal{justify-content:center;align-items:center;text-align:center}
.stage.bottom-consequence{justify-content:flex-end}
.stage.scrollable-work{justify-content:flex-start;min-height:0}
/* The frame is centred in the stage with balanced gutters; content is anchored
   left / right / centre WITHIN it by each screen's composition. DNA 4.18 bans
   accidental centring as a composition strategy — it does not ask for every frame
   to be pinned to the left edge, which just dumps all the slack on the right and
   fails the 4.21 dead-zone test on a wide monitor. */
.frame{width:100%;margin-inline:auto}
.frame.narrow{max-width:var(--frame-narrow)}
.frame.standard{max-width:var(--frame-standard)}
.frame.wide{max-width:var(--frame-wide)}
/* Wide monitors grow breathing room before they grow line length (DNA 9.1). */
@media (min-width:1600px){
  .stage{padding-inline:max(var(--page-gutter-x), calc((100vw - var(--frame-wide)) / 2))}
}
@media (max-width:600px){ .stage{padding-bottom:calc(var(--ctrl-p-h) + var(--stage-pad-y) + env(safe-area-inset-bottom))} }

/* ---- type roles ---- */
.kicker{font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--forest)}
.h1{font-size:var(--h1);font-weight:700;line-height:1.08;letter-spacing:-.035em;color:var(--forest);max-width:var(--copy-max-head);text-wrap:pretty}
.h2{font-size:var(--h2);font-weight:700;line-height:1.15;letter-spacing:-.03em;color:var(--forest)}
.h3{font-size:var(--h3);font-weight:700;line-height:1.25;letter-spacing:-.02em;color:var(--forest)}
.lede{font-size:var(--body);font-weight:500;line-height:1.55;color:var(--muted);max-width:var(--copy-max-lede);text-wrap:pretty}
.copy{font-size:var(--body);font-weight:500;line-height:1.6;color:var(--muted);max-width:var(--copy-max);text-wrap:pretty}
.micro{font-size:var(--micro);font-weight:500;color:var(--grey)}

/* ---- hero numeral ---- */
.hero-num{font-size:var(--hero-num);font-weight:900;line-height:.9;letter-spacing:-.045em;color:var(--forest);font-variant-numeric:tabular-nums lining}
.hero-unit{font-size:var(--h3);font-weight:700;letter-spacing:-.02em;color:var(--forest)}
.delta{font-size:var(--small);font-weight:700;color:var(--muted)}
.delta.up{color:var(--brand)}

/* ---- buttons: three tiers (DNA 7.1) ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;border-radius:var(--br);
  font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1.1}
.btn-p{height:var(--ctrl-p-h);min-width:var(--ctrl-p-minw);padding:0 var(--ctrl-p-pad-x);
  font-size:var(--ctrl-p-type);background:var(--brand);color:var(--white);box-shadow:var(--cta-inset)}
.btn-s{height:var(--ctrl-s-h);padding:0 clamp(1rem,2vw,1.75rem);font-size:var(--body);
  border:var(--bw) solid var(--brand);color:var(--brand);background:transparent}
.btn-t{height:var(--ctrl-t-h);padding:0 clamp(.75rem,1.4vw,1.15rem);font-size:var(--small);
  font-weight:700;color:var(--night);background:transparent}
.btn-t.bordered{border:var(--bw) solid var(--brand);color:var(--brand)}
.btn-n{height:var(--ctrl-n-h);padding:0 .6rem;font-size:var(--micro);font-weight:900;
  letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--forest)}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
/* on dark-green fields */
.on-dark .btn-p{background:var(--white);color:var(--forest);box-shadow:none}
.on-dark .btn-s{border-color:var(--light);color:var(--light)}
.on-dark .btn-t{color:var(--light)}

/* ---- section modes (DNA 1) ---- */
.sect{border-radius:var(--br);padding:clamp(1.25rem,3vw,2.25rem)}
.sect-dark{background:var(--forest);color:var(--light)}
.sect-dark .h1,.sect-dark .h2,.sect-dark .h3{color:var(--white)}
.sect-dark .copy,.sect-dark .lede{color:var(--light)}
.sect-dark .kicker{color:var(--light)}
.sect-dark a{color:var(--pale)}
.sect-light{background:var(--light)}
.sect-light .copy,.sect-light .lede{color:var(--muted)}
.sect-night{background:var(--night);color:var(--light)}
.stat-l{background:var(--sect-light);color:var(--stat-green)}
.stat-d{background:var(--forest);color:var(--white)}
.stat-w{background:var(--pure);border:var(--bw) solid var(--brand);color:var(--brand)}
.stat-w .sub{color:var(--grey)}
.visual-bg{background:var(--grey-ll)}

/* ---- tags (DNA 7.1) ---- */
.tag-live{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .55rem;border-radius:var(--br);
  border:var(--bw) solid var(--brand);background:var(--brand-5);color:var(--brand);
  font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);text-transform:uppercase;width:max-content}
.tag-live i{width:.45rem;height:.45rem;background:var(--brand);display:block;border-radius:var(--br)}
.tag-quiet{display:inline-flex;align-items:center;padding:.35rem .55rem;border-radius:var(--br);
  background:var(--forest);color:var(--light);font-size:var(--tag);font-weight:900;
  letter-spacing:var(--tag-ls);text-transform:uppercase;width:max-content}
.tag-quiet.soft{background:var(--muted)} .tag-quiet.softer{background:var(--mid)}

/* ---- inputs: the ONLY grey-bordered tappable (DNA 7.1) ---- */
.field{width:100%;background:var(--pure);border:var(--bw) solid var(--grey);border-radius:var(--br);
  padding:.85rem 1rem;min-height:var(--ctrl-t-h);outline:0;font-weight:500;color:var(--forest)}
.field::placeholder{color:var(--grey);opacity:1}
.field:focus{border-color:var(--brand)}
textarea.field{min-height:8rem;resize:vertical;line-height:1.55}
.lbl{display:grid;gap:.4rem}
.lbl>span{font-size:var(--micro);font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--forest)}

/* ---- selectable option (DNA 4.16: two independent cues) ---- */
.opt{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem;border-radius:var(--br);
  border:var(--bw) solid var(--grey);background:var(--pure);text-align:left;width:100%}
.opt .box{flex:0 0 auto;width:1.4rem;height:1.4rem;border:var(--bw) solid var(--grey);border-radius:var(--br);
  display:grid;place-items:center}
.opt .box svg{width:100%;height:100%;fill:none;stroke:var(--brand);stroke-width:2.6;
  stroke-dasharray:24;stroke-dashoffset:24}
.opt[aria-pressed="true"],.opt.on{border-color:var(--brand);background:var(--brand-5);font-weight:700}
.opt[aria-pressed="true"] .box,.opt.on .box{border-color:var(--brand)}
.opt[aria-pressed="true"] .box svg,.opt.on .box svg{stroke-dashoffset:0}

/* ---- toggle (DNA 7.1) ---- */
.tgl{width:3.1rem;height:1.7rem;border:var(--bw) solid var(--grey);border-radius:var(--br);
  background:var(--pure);position:relative;flex:0 0 auto}
.tgl i{position:absolute;top:.15rem;left:.15rem;width:1.15rem;height:1.15rem;background:var(--grey);display:block;border-radius:var(--br)}
.tgl[aria-pressed="true"]{background:var(--forest);border-color:var(--forest)}
.tgl[aria-pressed="true"] i{background:var(--light);left:auto;right:.15rem}

/* ---- stepper (DNA 7.1: no outer container) ---- */
.step{display:inline-flex;align-items:center;gap:clamp(.75rem,1.6vw,1.4rem)}
.step button{width:var(--ctrl-t-h);height:var(--ctrl-t-h);background:var(--forest);color:var(--light);
  border-radius:var(--br);font-size:var(--h3);font-weight:700;display:grid;place-items:center}

/* ---- progress rail: the ONLY progress treatment (DNA 1) ---- */
.rail{height:.7rem;border:var(--bw) solid var(--brand);background:var(--brand-5);border-radius:var(--br);
  overflow:hidden;display:flex}
.rail i{display:block;height:100%;background:var(--brand);transform-origin:left;transform:scaleX(0)}

/* ---- nested placeholder primitive (DNA 1) — never takes a text child ---- */
.ph{display:grid;place-items:center;border-radius:var(--br);flex:0 0 auto}
.ph i{display:block;border-radius:var(--br)}

/* ---- containers ---- */
.card{border:var(--bw) solid var(--brand);border-radius:var(--br);background:var(--pure);padding:clamp(1rem,2.2vw,1.6rem)}
.rule{height:1px;background:var(--brand);border:0;margin:0}
.row{display:flex;align-items:center;gap:var(--group-gap-x)}
.col{display:flex;flex-direction:column}
.wrap{display:flex;flex-wrap:wrap;gap:var(--group-gap-x)}
.gap-g{gap:var(--group-gap)} .gap-s{gap:var(--section-gap)}
.grow{flex:1 1 auto;min-width:0}

/* ---- explore drawer ---- */
#scrim{position:fixed;inset:0;background:rgba(1,45,16,.4);z-index:90;display:none}
#drawer{position:fixed;inset:0 0 0 auto;width:min(30rem,92vw);height:100%;background:var(--night);
  color:var(--light);z-index:95;padding:var(--page-gutter-x);overflow-y:auto;display:none;
  flex-direction:column;gap:var(--group-gap);transform:translateX(100%)}
#drawer .dhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding-bottom:var(--group-gap);border-bottom:1px solid var(--dark-line)}
#drawer h2{font-size:var(--h2);font-weight:900;letter-spacing:-.03em;color:var(--light)}
.dcard{display:grid;gap:.4rem;padding:clamp(.9rem,2vw,1.15rem);border:var(--bw) solid #1B4A2C;
  border-radius:var(--br);background:transparent;text-align:left;width:100%}
.dcard.now{border-color:var(--brand);background:rgba(65,237,152,.08)}
.dcard.locked{opacity:.55}
.dcard .dtag{font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--grey)}
.dcard.now .dtag{color:var(--brand)}
.dcard .dt{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--light)}
.dcard .db{font-size:var(--small);font-weight:500;line-height:1.45;color:var(--grey)}
@media (max-width:600px){
  #drawer{inset:auto 0 0 0;width:100%;height:86dvh;transform:translateY(100%);
    padding-bottom:calc(var(--page-gutter-x) + env(safe-area-inset-bottom))}
}

/* ---- phone dock (DNA 8.1) ---- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--white);display:none;
  padding:.6rem var(--page-gutter-x) calc(.6rem + env(safe-area-inset-bottom))}
#dock .btn-p{width:100%;min-width:0}
@media (max-width:600px){ #dock.on{display:block} }

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:120;
  max-width:min(30rem,92vw);padding:.9rem 1.1rem;border-radius:var(--br);background:var(--blue);
  color:var(--night);display:none}
#toast.money{background:var(--yellow)}
#toast .tt{font-size:var(--small);font-weight:900;letter-spacing:-.01em}
#toast .tb{font-size:var(--small);font-weight:500;color:rgba(1,45,16,.5);margin-top:.15rem}
@media (max-width:600px){ #toast{bottom:calc(var(--ctrl-p-h) + 1.5rem + env(safe-area-inset-bottom))} }

/* ---- demo switcher — outside the page frame, ?demo=1 only ---- */
#demo{position:fixed;right:1rem;bottom:1rem;z-index:200;display:none;flex-direction:column;gap:.35rem;
  background:var(--night);color:var(--light);padding:.7rem;border-radius:var(--br);max-width:19rem}
#demo.on{display:flex}
#demo b{font-size:var(--tag);letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--grey)}
#demo select,#demo label{font-size:var(--micro)}
#demo select{background:var(--pure);color:var(--night);border:0;border-radius:var(--br);padding:.35rem}
#demo .flags{display:flex;flex-wrap:wrap;gap:.3rem .6rem}
#demo label{display:inline-flex;align-items:center;gap:.3rem;color:var(--light)}
@media (max-width:600px){ #demo{right:.5rem;bottom:calc(var(--ctrl-p-h) + 1rem)} }

@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }



/* ========================================================================
   STORY LAYER — the campaign is a sequence, not a tab bar.

   Two levels of orientation, both built from the sanctioned .rail primitive
   (DNA 1: one progress treatment, not three). The chapter rail lives in the
   chrome and answers "where am I in the campaign". The scene foot answers
   "where am I in this chapter", and carries the move forward, because the
   move forward is an authored act — not a scroll the founder discovers.
   ======================================================================== */

/* ---- chrome: band + chapter rail ---- */
.chrome{position:sticky;top:0;z-index:50;background:var(--white)}
.band{position:static}
.band .now{flex:0 0 auto;display:none;text-align:center;min-width:0}
@media (min-width:1000px){
  .band .now{display:grid;gap:.1rem;flex:1 1 auto;justify-items:center}
  .band .now .nt{font-size:var(--small);font-weight:900;letter-spacing:-.02em;color:var(--forest);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
  .band .now .nl{font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);
    text-transform:uppercase;color:var(--grey)}
  .band .dayline{flex:0 0 auto}
}
.bell{position:relative;height:var(--ctrl-n-h);width:var(--ctrl-n-h);border:var(--bw) solid var(--brand);
  border-radius:var(--br);color:var(--brand);display:inline-grid;place-items:center}
.bell svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:2}
.bell .badge{position:absolute;top:-.4rem;right:-.4rem;min-width:1.25rem;height:1.25rem;padding:0 .25rem;
  background:var(--forest);color:var(--light);border-radius:var(--br);display:grid;place-items:center;
  font-size:var(--tag);font-weight:900;line-height:1}
.back-now{height:var(--ctrl-n-h);padding:0 .75rem;font-size:var(--micro);font-weight:900;
  letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--forest);border-radius:var(--br)}

/* Chapter marks are labels, not bars. Where you are is said in words; how far
   along you are is not a thing this app measures at you. */
.chapters{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;
  padding:0 var(--page-gutter-x) var(--chrome-pad-y)}
.chapters .ch{display:inline-flex;align-items:center;min-height:var(--ctrl-t-h);
  padding:0 clamp(.6rem,1.4vw,1rem);border-radius:var(--br);background:transparent;
  border:var(--bw) solid transparent}
.chapters .ch label{font-size:var(--micro);font-weight:900;letter-spacing:var(--tag-ls);
  text-transform:uppercase;color:var(--grey);white-space:nowrap;cursor:inherit}
.chapters .ch.done label{color:var(--muted)}
.chapters .ch.current{border-color:var(--brand);background:var(--brand-5)}
.chapters .ch.current label{color:var(--brand)}
.chapters .ch.locked{opacity:.45;cursor:not-allowed}
.chapters .ch[disabled]{cursor:not-allowed}

/* ---- the scene: one screen, one thought ---- */
.stage.scene-stage{padding-bottom:var(--stage-pad-y)}
.scene{display:grid;align-content:center;gap:var(--group-gap);width:100%}
.scene.top{align-content:start}
.scene-head{display:grid;gap:.5rem}
.scene-lead{display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--group-gap-x);flex-wrap:wrap}
.scene-split{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(16rem,.96fr);
  gap:clamp(1.5rem,4.5vw,4.5rem);align-items:center}
.scene-split.top{align-items:start}
.scene-split.rail-left{grid-template-columns:minmax(15rem,20rem) minmax(0,1fr);
  gap:clamp(1.25rem,2.6vw,2.5rem);align-items:start}
.pane{min-width:0}
/* a pane that must never grow the page: it scrolls inside itself instead */
.pane.bound{overflow:auto;max-height:calc(100svh - var(--chrome-gap-y) - var(--foot-h)
  - var(--stage-pad-y) * 2.4);scrollbar-width:thin}

:root{--foot-h:0rem}

/* ---- authored beats: arrival, recap, close ---- */
.beat{display:grid;gap:var(--group-gap);align-content:center}
.beat-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(15rem,.95fr);
  gap:clamp(1.5rem,5vw,5rem);align-items:center}
.beat-proof{display:grid;align-content:center}
.beat-proof .pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--group-gap-x);
  align-items:baseline;padding:clamp(.6rem,1.6svh,1rem) 0;border-top:1px solid var(--brand)}
.beat-proof .pl span{font-size:var(--small);color:var(--muted)}
.beat-proof .pl strong{font-size:var(--h2);font-weight:900;letter-spacing:-.035em;color:var(--forest)}
.sect-dark .beat-proof .pl{border-top-color:var(--dark-line)}
.sect-dark .beat-proof .pl span{color:var(--light)}
.sect-dark .beat-proof .pl strong{color:var(--white)}

/* the arrival stack: three matches, fanned, so the number has a face */
.fan{position:relative;min-height:clamp(14rem,min(30vw,38svh),22rem)}
.fan .fc{position:absolute;width:min(22rem,80%);display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:var(--group-gap-x);align-items:center;padding:clamp(.85rem,2vw,1.15rem);
  border:var(--bw) solid var(--brand);background:var(--pure);border-radius:var(--br)}
.fan .fc:nth-child(1){left:0;top:2%;transform:rotate(-2.2deg)}
.fan .fc:nth-child(2){left:12%;top:34%;transform:rotate(1.6deg)}
.fan .fc:nth-child(3){left:4%;top:66%;transform:rotate(-1deg)}
.fan .fc strong{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fan .fc small{font-size:var(--small);color:var(--muted);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- looking back ---- */
.lookback{display:flex;align-items:center;justify-content:space-between;gap:var(--group-gap-x);
  padding:.7rem 0;border-bottom:1px solid var(--brand);color:var(--muted);font-size:var(--small);
  flex-wrap:wrap}
.lookback strong{color:var(--forest);font-weight:900}

/* ---- note surfaces ---- */
.note{background:var(--yellow);color:var(--night);border:var(--bw) solid var(--night);
  border-radius:var(--br);padding:clamp(.85rem,2vw,1.1rem);font-size:var(--small);line-height:1.45;
  max-width:var(--copy-max)}
.note.blue{background:var(--blue)}
.note strong{font-weight:900}

/* ---- modal ---- */
#mscrim{position:fixed;inset:0;background:rgba(1,45,16,.4);z-index:100;display:grid;
  place-items:center;padding:var(--page-gutter-x)}
.modal{width:min(46rem,100%);max-height:88svh;overflow:auto;background:var(--white);
  color:var(--forest);border:var(--bw) solid var(--brand);border-radius:var(--br);
  padding:clamp(1.15rem,2.6vw,1.9rem);display:grid;gap:var(--group-gap)}
.modal .mhead{display:flex;align-items:flex-start;justify-content:space-between;
  gap:var(--group-gap-x);padding-bottom:var(--group-gap);border-bottom:1px solid var(--brand)}
.modal .mfoot{display:flex;flex-wrap:wrap;gap:var(--group-gap-x);justify-content:flex-end;
  padding-top:var(--group-gap);border-top:1px solid var(--brand)}
.xbtn{width:var(--ctrl-n-h);height:var(--ctrl-n-h);border:var(--bw) solid var(--brand);
  border-radius:var(--br);color:var(--brand);font-size:var(--h3);font-weight:700;
  display:grid;place-items:center;flex:0 0 auto}
#drawer .xbtn{border-color:var(--light);color:var(--light)}
.btn-t.danger{color:var(--night);text-decoration:underline;text-decoration-thickness:2px;
  text-underline-offset:.22em}

  background:var(--white);color:var(--brand);font-weight:900}

@media (max-width:900px){
  .scene-split,.beat-split,.scene-split.rail-left{grid-template-columns:1fr}
  .scene-split{align-items:start}
  .fan{min-height:17rem}
}
@media (max-width:600px){
  :root{--foot-h:4.4rem}
  .scene{align-content:start}
  .chapters{gap:.4rem}
  .chapters .ch label{font-size:.58rem}
  .foot{grid-template-columns:auto minmax(0,1fr) auto;
    padding-bottom:env(safe-area-inset-bottom)}
  .foot .mid .cap{display:none}
  .stage{padding-bottom:var(--stage-pad-y)}
  .pane.bound{max-height:none;overflow:visible}
}

/* ========================================================================
   HUBS, LINKS AND BACK — the navigation the founder can actually see.
   ======================================================================== */

/* Back always sits in the upper left, above the title, at full tap size. */
.backbar{display:flex;margin-bottom:var(--group-gap)}
.backbtn{display:inline-flex;align-items:center;gap:.5rem;height:var(--ctrl-t-h);
  padding:0 .9rem 0 .7rem;border:var(--bw) solid var(--brand);border-radius:var(--br);
  color:var(--brand);font-size:var(--small);font-weight:900;letter-spacing:-.01em;background:transparent}
.backbtn .ar{font-size:var(--h3);line-height:1}

/* A link out is a target, not a hint. */
.lnks{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:var(--group-gap-x)}
.lnk{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;
  align-items:center;gap:.15rem var(--group-gap-x);text-align:left;
  min-height:var(--ctrl-s-h);padding:clamp(.7rem,1.6vw,1rem);
  border:var(--bw) solid var(--brand);border-radius:var(--br);background:var(--pure)}
.lnk .lt{grid-column:1;font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .lm{grid-column:1;font-size:var(--micro);font-weight:500;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .la{grid-column:2;grid-row:1/3;font-size:var(--h3);color:var(--brand);font-weight:700}
.on-dark .lnk{background:transparent;border-color:var(--dark-line)}
.on-dark .lnk .lt{color:var(--light)} .on-dark .lnk .lm{color:var(--grey)}

/* ---- the moment: two numerals at true scale, nothing competing ---- */
.moment{display:grid;gap:var(--group-gap);align-content:center}
.figures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(1.25rem,4vw,4rem);align-items:end}
.fig{display:grid;gap:.1rem;min-width:0}
.fig .n{font-size:var(--hero-num);font-weight:900;line-height:.86;letter-spacing:-.05em;
  color:var(--forest);font-variant-numeric:tabular-nums lining}
.fig .l{font-size:var(--h3);font-weight:900;letter-spacing:-.02em;color:var(--forest)}
.fig .s{font-size:var(--small);font-weight:500;color:var(--muted)}
.fig.quiet .n{font-size:var(--h1);color:var(--muted)}
.sect-dark .fig .n,.sect-dark .fig .l{color:var(--white)}
.sect-dark .fig .s{color:var(--light)}

/* Scannable tiles: a number and at most three words. Prose lives elsewhere. */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:var(--group-gap-x)}
.tile{display:grid;gap:.15rem;padding:clamp(.75rem,1.8vw,1.1rem);border-radius:var(--br);min-width:0}
.tile .tn{font-size:var(--h2);font-weight:900;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums lining}
.tile .tl{font-size:var(--micro);font-weight:700;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.stat-l .tl{color:var(--muted)} .tile.stat-d .tl{color:var(--light)}
.tile.stat-w .tl{color:var(--grey)}

/* ---- leaderboard: the leader is not row one of six equal rows ---- */
.podium{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:var(--group-gap-x);align-items:end}
.pod{display:grid;gap:.3rem;padding:clamp(.8rem,2vw,1.2rem);border-radius:var(--br);
  border:var(--bw) solid var(--brand);background:var(--pure);min-width:0}
.pod .rk{font-size:var(--h1);font-weight:900;line-height:.85;letter-spacing:-.06em;color:var(--brand);
  font-variant-numeric:tabular-nums lining}
.pod .nm{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .hd{font-size:var(--micro);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .vv{font-size:var(--h3);font-weight:900;letter-spacing:-.03em;color:var(--forest);
  font-variant-numeric:tabular-nums lining}
.pod .vs{font-size:var(--micro);color:var(--muted)}
.pod.first{background:var(--forest);border-color:var(--forest)}
.pod.first .rk{font-size:calc(var(--hero-num) * .62);color:var(--brand)}
.pod.first .nm,.pod.first .vv{color:var(--white)}
.pod.first .hd,.pod.first .vs{color:var(--light)}
.ranks{display:grid}
.rank{display:grid;grid-template-columns:2.5rem minmax(0,1fr) auto auto;gap:var(--group-gap-x);
  align-items:center;text-align:left;width:100%;background:transparent;
  padding:clamp(.6rem,1.6svh,.95rem) 0;border-top:1px solid var(--brand)}
.rank .rk{font-size:var(--h3);font-weight:900;color:var(--grey);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums lining}
.rank .nm{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .hd{font-size:var(--micro);color:var(--muted);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .vv{font-size:var(--body);font-weight:900;color:var(--forest);font-variant-numeric:tabular-nums lining}
.rank .vs{font-size:var(--micro);color:var(--muted)}

/* ---- a bound list pane: scrolls inside itself, never grows the page ---- */
.listpane{overflow:auto;max-height:calc(100svh - var(--chrome-gap-y) - var(--stage-pad-y) * 3.2 - 9rem);
  scrollbar-width:thin}

@media (max-width:900px){
  .figures{grid-template-columns:1fr;gap:var(--group-gap)}
  .podium{grid-template-columns:1fr}
  .pod.first .rk{font-size:var(--h1)}
}
@media (max-width:600px){
  .lnks{grid-template-columns:1fr}
  .listpane{max-height:none;overflow:visible}
  .rank{grid-template-columns:2rem minmax(0,1fr) auto}
  .rank .vs{display:none}
}

/* ========================================================================
   OVERLAYS RENDERED ON DEMAND
   pd.css declares #drawer / #scrim as pre-existing furniture that starts
   hidden and slides in. Here they are re-rendered into #overlays only while
   they are open, so the hidden defaults have to be neutralised or the drawer
   would mount already display:none.
   ======================================================================== */
#overlays #scrim{display:block}
#overlays #drawer{display:flex;transform:none}
#overlays .dcard{cursor:pointer}
#overlays .dcard.locked{cursor:default}

/* ---- the wrap-up strip: four beats of a finished campaign ---- */
.story-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--group-gap-x)}
.story-beat{display:grid;align-content:space-between;gap:.4rem;min-height:clamp(8rem,18svh,12rem);
  padding:clamp(.8rem,2vw,1.2rem);border:var(--bw) solid var(--brand);border-radius:var(--br);
  background:var(--pure);min-width:0}
.story-beat>span{font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);
  text-transform:uppercase;color:var(--muted)}
.story-beat>strong{font-size:var(--h3);font-weight:900;letter-spacing:-.03em;color:var(--forest);
  line-height:1.1}
.story-beat>p{font-size:var(--small);color:var(--muted);line-height:1.4}
.story-beat:nth-child(4){background:var(--forest);border-color:var(--forest)}
.story-beat:nth-child(4)>span{color:var(--light)}
.story-beat:nth-child(4)>strong{color:var(--white)}
.story-beat:nth-child(4)>p{color:var(--light)}
@media (max-width:900px){ .story-strip{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .story-strip{grid-template-columns:1fr} .story-beat{min-height:0} }

/* ---- toast ---- */
#toast.on{display:block}


/* ---- overlays ---- */
/* ==================== F — chrome cost, overlays, prototype panel ==================== */

/* The chapter rail is real chrome and costs real height. pd.css sizes the stage
   against the band alone, so the strip is given a declared height and the stage
   is told about it — otherwise every screen in the app scrolls by exactly the
   height of my rail. .stage.scrollable-work keeps winning on specificity. */
:root{ --f-chapters-h:calc(2rem + var(--chrome-pad-y)); }
.chapters{ height:var(--f-chapters-h); align-content:center }
.stage{ min-height:calc(100svh - var(--chrome-gap-y) - var(--f-chapters-h)) }

/* the wordmark is the way home; pd.css already sizes the img inside */
.band .f-wm{ flex:0 0 auto; display:block; padding:0; background:transparent }
/* the drawer control keeps a mark when its label is hidden on a phone */
.explore-btn svg{ width:1.1rem; height:1.1rem; fill:currentColor; stroke:none }

/* ---- drawers: a night field, so the light-field type roles get re-pointed ---- */
.f-don .kicker{ color:var(--grey) }
.f-don .h3{ color:var(--light) }
.f-don .copy,.f-don .lede{ color:var(--light) }
.f-dh{ display:grid; gap:.25rem; min-width:0 }
.f-dintro{ font-size:var(--small); line-height:1.5; color:var(--grey); max-width:var(--copy-max) }
.f-dlist{ display:grid; gap:.5rem }
.f-dsec{ display:grid; gap:.6rem }
.f-feed{ display:grid }
.f-feeditem{ display:grid; gap:.25rem; padding:.9rem 0; border-bottom:1px solid var(--dark-line) }
.f-feeditem strong{ font-size:var(--body); font-weight:900; letter-spacing:-.02em; color:var(--light) }
.f-feedwhen{ font-size:var(--micro); color:var(--grey) }
.f-post{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--group-gap-x);
  align-items:center; padding:.9rem 0; border-top:1px solid var(--dark-line) }
.f-postt{ display:block; font-size:var(--body); font-weight:900; letter-spacing:-.02em; color:var(--light) }
.f-postm{ font-size:var(--small); color:var(--grey); margin-top:.3rem }

/* ---- modal internals ---- */
.f-mh{ display:grid; gap:.35rem; min-width:0 }
.f-mbody{ display:grid; gap:var(--group-gap) }
.f-stack{ display:grid; gap:.6rem }
.f-opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:var(--group-gap-x) }
.f-visual{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--group-gap-x); align-items:center }
.f-visual label.btn{ cursor:pointer }
.f-break{ display:grid }
.f-break>div{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--group-gap-x);
  align-items:baseline; padding:clamp(.6rem,1.6svh,.95rem) 0; border-top:1px solid var(--brand) }
.f-break span{ font-size:var(--small); color:var(--muted) }
.f-break strong{ font-size:var(--body); font-weight:900; color:var(--forest);
  text-align:right; max-width:24rem }


@media (max-width:600px){
  .f-opts{ grid-template-columns:1fr }
  .f-visual{ grid-template-columns:1fr }
  .f-break>div{ grid-template-columns:1fr; gap:.2rem }
  .f-break strong{ text-align:left }
}

/* ---- onboarding ---- */
/* ==== A — onboarding ==== */
.a-solo{display:grid;gap:var(--group-gap);width:min(34rem,100%);margin-inline:auto}
.a-mid{justify-items:center;text-align:center}
.a-pw{display:grid;gap:var(--group-gap)}
.a-pw .field{min-height:var(--ctrl-s-h)}
.a-pw .btn-p{width:100%}
.a-field{display:grid;gap:.4rem}
.a-legal{text-align:center;max-width:var(--copy-max-lede);margin-inline:auto}
.a-stack{display:grid;gap:var(--group-gap)}
.a-example{display:grid;gap:var(--group-gap);align-content:start}
textarea.a-policy{min-height:clamp(9rem,26svh,15rem)}
.a-preview{display:grid;gap:.5rem;align-content:start}
.a-preview .listpane{max-height:clamp(6rem,30svh,17rem)}
.a-choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr) minmax(0,1fr);
  gap:var(--group-gap-x);align-items:stretch}
.opt.a-choice{display:grid;grid-template-rows:auto auto 1fr auto;align-items:start;gap:.55rem;
  padding:clamp(1rem,2.2vw,1.5rem)}
.opt.a-choice .h3,.opt.a-choice .copy{display:block}
.opt.a-pick{padding:clamp(1.15rem,2.6vw,1.9rem)}
.a-top{display:flex;align-items:center;justify-content:space-between;gap:var(--group-gap-x)}
.a-foot{display:flex;align-items:flex-end}
.a-price{font-size:var(--h2);font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--forest)}
.opt.a-pick .a-price{font-size:calc(var(--h1) * .8)}
.a-link{max-width:38rem}
.a-link .field{min-height:var(--ctrl-s-h)}
.a-reveal{display:grid;justify-items:center;gap:var(--group-gap)}
.a-done{width:var(--dossier-media);height:var(--dossier-media);display:grid;place-items:center;
  background:var(--brand);color:var(--white);border-radius:var(--br);
  font-size:var(--h1);font-weight:900;line-height:1}
@media (max-width:900px){ .a-choices{grid-template-columns:1fr} }

/* ---- choose ---- */
/* ==================== B — CHOOSE ==================== */

/* Two control variants the chapter genuinely needs: a night-outlined tertiary
   so "Reject match" reads as a real, full-size button beside "Accept", and a
   secondary-scale bump for it. Nothing here shrinks a control. */
.b-dark{border:var(--bw) solid var(--night);color:var(--night);background:transparent}
.b-wide{height:var(--ctrl-s-h);padding:0 clamp(1rem,2vw,1.75rem);font-size:var(--body)}

/* interview banner */
.b-banner{display:flex;align-items:center;gap:var(--group-gap-x);max-width:100%;
  padding:clamp(.6rem,1.4svh,.9rem) clamp(.85rem,2vw,1.1rem)}
.b-cal{flex:0 0 auto;width:2.9rem;height:2.9rem;display:grid;place-items:center;
  border:var(--bw) solid var(--night);border-radius:var(--br);
  font-size:var(--h3);font-weight:900;letter-spacing:-.03em}
.b-bannertext{flex:1 1 auto;min-width:0;display:grid;gap:.1rem}
.b-bannertext strong{font-size:var(--body);font-weight:900;letter-spacing:-.02em}
.b-bannertext span{opacity:.72}

/* arrival */
.b-introcopy{display:grid;gap:var(--group-gap);align-content:center;min-width:0}
.b-bignum{line-height:.86}
.b-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem var(--group-gap-x);
  padding-top:var(--group-gap);border-top:1px solid var(--brand);
  font-size:var(--small);color:var(--muted)}
.b-meta strong{color:var(--forest);font-weight:900}

/* the chooser */
.b-hub{display:grid;gap:var(--group-gap);min-width:0}
.b-left{display:grid;gap:var(--group-gap);align-content:start;min-width:0}
.b-count{display:grid;gap:.3rem;min-width:0}
.b-countline{display:flex;align-items:baseline;flex-wrap:wrap;gap:.35rem .5ch;min-width:0}
.b-needs{max-width:100%}
.b-phase{margin-left:auto}

/* the rail scrolls inside itself; the page never grows */
.b-rail{display:grid;gap:.45rem;align-content:start;max-height:clamp(9rem,27svh,20rem);padding-right:.3rem}
.b-match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.05rem var(--group-gap-x);
  align-items:center;text-align:left;border-radius:var(--br);background:var(--pure);
  border:var(--bw) solid var(--brand-15);padding:clamp(.5rem,1.2svh,.8rem) clamp(.65rem,1.3vw,1rem)}
.b-match strong{grid-column:1;font-size:var(--body);font-weight:900;letter-spacing:-.02em;
  color:var(--forest);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-match small{grid-column:1;font-size:var(--micro);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-mpct{grid-column:2;grid-row:1;font-size:var(--body);font-weight:900;color:var(--forest);
  font-variant-numeric:tabular-nums lining}
.b-mstat{grid-column:2;grid-row:2;font-size:var(--micro);font-weight:700;color:var(--grey);white-space:nowrap}
.b-match.on{border-color:var(--brand);background:var(--brand-5)}
.b-match.on .b-mstat{color:var(--muted)}

/* the dossier */
.b-dossier{display:grid;gap:var(--group-gap);align-content:start;min-width:0}
.b-id{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--group-gap) var(--group-gap-x);align-items:center}
.b-idmain{display:grid;gap:.25rem;min-width:0}
.b-idtop{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem var(--group-gap-x)}
.b-handle{font-size:var(--small);font-weight:700;color:var(--brand)}
.b-metrics{display:flex;flex-wrap:wrap;gap:.2rem clamp(1.25rem,3vw,2.75rem);margin-top:.2rem}
.b-metrics strong{display:block;font-size:var(--h3);font-weight:900;letter-spacing:-.03em;
  color:var(--forest);font-variant-numeric:tabular-nums lining;line-height:1.1}
.b-metrics span{display:block;font-size:var(--micro);font-weight:700;color:var(--grey)}
.b-work{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);
  gap:var(--group-gap) var(--group-gap-x)}
.b-facts{display:grid;gap:var(--group-gap);align-content:start;min-width:0}
.b-desc{font-size:var(--small);max-width:100%}
.b-offer{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem var(--group-gap-x);
  border:var(--bw) solid var(--brand);border-radius:var(--br);
  padding:clamp(.6rem,1.4svh,1rem) clamp(.65rem,1.5vw,1rem)}
.b-offerfig{flex:0 0 auto;display:grid;gap:.1rem}
.b-offerpct{font-size:var(--h2);font-weight:900;letter-spacing:-.045em;line-height:1;
  color:var(--forest);font-variant-numeric:tabular-nums lining}
.b-offercopy{flex:1 1 11rem;min-width:0;font-size:var(--small);line-height:1.45;color:var(--muted)}
.b-pieces{display:grid;gap:.5rem;align-content:start;min-width:0}
.b-piecehead{display:flex;align-items:baseline;flex-wrap:wrap;gap:.25rem var(--group-gap-x)}
.b-piecegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--group-gap) var(--group-gap-x)}
.b-piece{display:grid;gap:.3rem;min-width:0}
.b-piece small{font-size:var(--micro);line-height:1.35;color:var(--muted)}

/* the decision — the point of the screen */
.b-decide{display:flex;align-items:center;flex-wrap:wrap;gap:var(--group-gap) var(--group-gap-x);
  padding-top:var(--group-gap);border-top:var(--bw) solid var(--brand)}

/* the send-it-out band, at the foot of the same screen */
.b-ready{display:flex;align-items:center;flex-wrap:wrap;gap:var(--group-gap) var(--group-gap-x);
  padding:clamp(.7rem,1.6svh,1.15rem) clamp(1rem,2.4vw,1.75rem)}
.b-readyhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem var(--group-gap-x)}
.b-readycopy{flex:1 1 24rem;min-width:0;display:grid;gap:.15rem}
.b-readytext{font-size:var(--small);line-height:1.45}

/* waiting */
.b-waitcopy{display:grid;gap:var(--group-gap);align-content:center;min-width:0}
.b-waitprog{display:grid;gap:.5rem}
.b-waitprog p{font-size:var(--small);color:var(--muted)}
.b-side{display:grid;gap:var(--group-gap);align-content:center;min-width:0}
.b-reviewers{display:grid;gap:.5rem}
.b-reviewer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--group-gap) var(--group-gap-x);
  align-items:center;border:var(--bw) solid var(--brand-15);border-radius:var(--br);
  background:var(--pure);padding:clamp(.45rem,1.1svh,.75rem) clamp(.65rem,1.3vw,1rem)}
.b-reviewer strong{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:1180px){
  .b-work{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .b-rail{max-height:clamp(8rem,22svh,16rem)}
}
@media (max-width:900px){
  .b-work{grid-template-columns:1fr}
}
@media (max-width:600px){
  .b-rail{max-height:none;overflow:visible}
  .b-piecegrid{grid-template-columns:1fr}
  .b-decide .btn,.b-ready .btn{width:100%}
}

/* ---- live ---- */
/* ---- C: live ---- */
.c-dayline{display:flex;align-items:baseline;gap:.5ch;font-size:var(--small);font-weight:500;color:var(--muted)}
.c-dayline strong{font-weight:900;color:var(--forest)}
.c-dayline .sep{color:var(--grey)}
.c-beatnum{display:flex;align-items:baseline;gap:.6ch;flex-wrap:wrap}
.c-thresh{display:grid;gap:.5rem;max-width:min(46rem,100%)}
.c-threshhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--group-gap-x)}
.c-threshv{font-size:var(--h3);font-weight:900;letter-spacing:-.03em;color:var(--forest);font-variant-numeric:tabular-nums lining}
.c-since{display:grid;gap:.5rem}
.c-copy svg{width:1.15rem;height:1.15rem;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2}
.c-podbtn{width:100%;text-align:left}
.c-rankid{display:grid;gap:.1rem;min-width:0}
.c-rankv{display:grid;gap:.1rem;justify-items:end;text-align:right}
.c-posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--group-gap-x)}
.c-post{display:grid;gap:.6rem;align-content:start}
.c-posthead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--group-gap-x)}
.c-posthead strong{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-posthead small{flex:0 0 auto;font-size:var(--micro);font-weight:700;color:var(--grey)}
.c-postact{display:flex;flex-wrap:wrap;gap:.6rem}
.c-btable{display:grid}
.c-brow{display:grid;grid-template-columns:minmax(7rem,1fr) 4.5rem 6rem minmax(0,2.4fr) auto;
  gap:var(--group-gap-x);align-items:baseline;width:100%;text-align:left;background:transparent;
  padding:clamp(.6rem,1.6svh,.95rem) 0;border-top:1px solid var(--brand)}
.c-bname{font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-bamt{font-size:var(--body);font-weight:900;color:var(--forest);font-variant-numeric:tabular-nums lining}
.c-bsrc{font-size:var(--micro);font-weight:700;letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--muted)}
.c-bnote{font-size:var(--small);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-bopen{font-size:var(--small);font-weight:900;color:var(--brand)}
.c-updates{display:grid}
.c-update{display:grid;grid-template-columns:6rem minmax(0,1fr);gap:var(--group-gap-x);align-items:baseline;
  padding:clamp(.7rem,1.8svh,1.05rem) 0;border-top:1px solid var(--brand)}
.c-update time{font-size:var(--micro);font-weight:900;letter-spacing:var(--tag-ls);text-transform:uppercase;color:var(--grey)}
.c-update strong{display:block;font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest);margin-bottom:.2rem}
.c-sincelist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--group-gap-x)}
.c-sinceitem{display:grid;gap:.15rem;padding:clamp(.75rem,1.8vw,1.1rem);border-radius:var(--br);
  background:var(--sect-light);min-width:0}
.c-sinceitem strong{font-size:var(--h3);font-weight:900;letter-spacing:-.03em;color:var(--forest)}
.c-sinceitem span{font-size:var(--small);color:var(--muted)}
.c-srcs{display:grid;gap:.6rem}
.c-src{display:grid;grid-template-columns:7rem minmax(0,1fr) auto;gap:var(--group-gap-x);align-items:center}
.c-srcn{font-size:var(--small);font-weight:900;letter-spacing:-.01em;color:var(--forest)}
.c-srcv{font-size:var(--micro);color:var(--muted);font-variant-numeric:tabular-nums lining}
@media (max-width:900px){
  .c-posts{grid-template-columns:1fr}
  .c-sincelist{grid-template-columns:1fr}
}
@media (max-width:600px){
  .c-brow{grid-template-columns:minmax(0,1fr) auto;row-gap:.2rem}
  .c-bsrc,.c-bnote,.c-bopen{grid-column:1/-1}
  .c-bnote{white-space:normal}
  .c-update{grid-template-columns:1fr;row-gap:.3rem}
  .c-src{grid-template-columns:minmax(0,1fr) auto}
}

/* ---- payouts ---- */
/* ---- D — PAYOUTS ---- */
.d-hub{gap:var(--group-gap)}
.d-money{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(15rem,.88fr);
  gap:clamp(1.5rem,4.5vw,4.5rem);align-items:end}
.d-net{display:grid;gap:.35rem;min-width:0}
.d-break{align-self:end}
.d-now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--group-gap-x);align-items:center}
.d-nowcopy{display:grid;gap:.2rem;min-width:0}
.d-nowact{justify-content:flex-end;align-items:center}

.d-col{display:grid;gap:.5rem;align-content:start;min-width:0}
.d-path{display:grid;gap:.25rem}
.d-actpane{display:grid;gap:var(--group-gap);align-content:center;justify-items:start}
.d-mile{grid-template-columns:minmax(0,1.05fr) minmax(13rem,.95fr);align-items:center}
.d-quiet{display:grid;gap:var(--group-gap);justify-items:center;text-align:center}
.d-quiet .wrap{justify-content:center}

.d-drop{display:grid;justify-items:center;align-content:center;gap:var(--group-gap);
  width:100%;min-height:var(--upload-surface-h);padding:clamp(1rem,2.4vw,1.75rem);
  border:var(--bw) solid var(--brand);border-radius:var(--br);background:var(--brand-5);text-align:center}

.d-capture{display:grid;gap:.15rem}
.d-capture strong{font-weight:900}

/* the step list is the one long thing in this chapter: it scrolls inside itself,
   under a back control and a page title, so the page never grows */
.d-steps{display:grid;max-height:calc(100svh - var(--chrome-gap-y) - var(--stage-pad-y) * 3.2 - 15rem)}
.d-step{display:grid;grid-template-columns:minmax(6rem,8rem) minmax(0,1fr) auto;
  gap:var(--group-gap-x);align-items:start;padding:clamp(.7rem,1.8svh,1.15rem) 0}
.d-step + .d-step{border-top:var(--bw) solid var(--brand)}
.d-stepn{display:grid;gap:.15rem;min-width:0}
.d-steplbl{font-size:var(--micro);font-weight:900;letter-spacing:var(--tag-ls);
  text-transform:uppercase;color:var(--forest)}
.d-step.done .d-steplbl{color:var(--muted)}
.d-stepb{display:grid;gap:.3rem;min-width:0}
.d-stepa{display:flex;justify-content:flex-end;align-items:center}

.d-bridge{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--group-gap);align-items:center}
.d-bridgec{display:grid;gap:.4rem}

.d-close{width:100%}
.d-close .hero-num{color:var(--white)}
.d-closec{display:grid;gap:var(--group-gap);justify-items:start}
.d-closec .wrap{align-items:center}
.d-closec .beat-rail{width:min(28rem,100%)}

@media (max-width:900px){
  .d-money,.d-now,.d-bridge,.d-step{grid-template-columns:1fr}
  .d-nowact,.d-stepa{justify-content:flex-start}
}

/* ---- settings-after ---- */
/* ---- E: settings room ---- */
.e-tabs{display:grid;gap:.4rem;align-content:start}
.e-tab{display:flex;align-items:center;min-height:var(--ctrl-t-h);padding:0 1rem;
  border:var(--bw) solid transparent;border-radius:var(--br);background:transparent;text-align:left;
  font-size:var(--body);font-weight:700;letter-spacing:-.02em;color:var(--muted)}
.e-tab[aria-selected="true"]{border-color:var(--brand);background:var(--brand-5);
  color:var(--forest);font-weight:900}
.e-panel{display:grid;gap:var(--group-gap);align-content:start;overflow:auto;scrollbar-width:thin;
  max-height:calc(100svh - var(--chrome-gap-y) - var(--stage-pad-y) * 2.4 - 11rem - 12svh)}
.e-block{display:grid;gap:.6rem;align-content:start;padding-top:var(--group-gap);
  border-top:1px solid var(--brand)}
.e-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:var(--group-gap-x)}
.e-fields{display:grid;gap:.75rem}
.e-link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--group-gap-x);align-items:center}
.e-bridge{display:flex;align-items:center;justify-content:space-between;gap:var(--group-gap-x);flex-wrap:wrap}

.e-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--group-gap-x);
  align-items:center;padding:clamp(.6rem,1.6svh,.95rem) 0;border-top:1px solid var(--brand)}
.e-row .ix{width:2rem;height:2rem;display:grid;place-items:center;border:var(--bw) solid var(--brand);
  border-radius:var(--br);color:var(--brand);font-size:var(--small);font-weight:900}
.e-row strong{display:block;font-size:var(--body);font-weight:900;letter-spacing:-.02em;color:var(--forest)}
.e-row .sub{display:block;font-size:var(--micro);font-weight:500;color:var(--muted);margin-top:.15rem}

.e-tgls{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:0 var(--group-gap-x)}
.e-tgl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--group-gap-x);align-items:center;
  padding:clamp(.55rem,1.4svh,.85rem) 0;border-top:1px solid var(--brand)}
.e-tgl strong{display:block;font-size:var(--small);font-weight:900;letter-spacing:-.02em;color:var(--forest)}
.e-tgl small{display:block;font-size:var(--micro);font-weight:500;color:var(--muted);margin-top:.1rem}

/* ---- E: the wrap moment ---- */
.e-field{display:grid;gap:var(--group-gap);align-content:center}
.e-wrap2{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:var(--group-gap-x)}
.e-hs{display:block;margin-top:.2rem;font-weight:500}
.e-cool{display:grid;gap:.1rem;align-content:center;padding:clamp(.8rem,2vw,1.15rem);
  border:var(--bw) solid var(--brand);border-radius:var(--br);background:var(--pure)}
.e-cool .cl{font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);
  text-transform:uppercase;color:var(--grey)}
.e-cool strong{font-size:var(--h2);font-weight:900;letter-spacing:-.035em;line-height:1;color:var(--forest)}
.e-cool .cs{font-size:var(--micro);font-weight:500;color:var(--muted)}
.sect-dark .e-cool{background:transparent;border-color:var(--dark-line)}
.sect-dark .e-cool .cl{color:var(--pale)}
.sect-dark .e-cool strong{color:var(--white)}
.sect-dark .e-cool .cs{color:var(--light)}

/* ---- E: the four-beat story strip (#storyStrip .story-beat is animated) ---- */
.e-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--group-gap-x)}
.e-strip .story-beat{display:grid;gap:.3rem;align-content:space-between;min-width:0;
  min-height:clamp(9rem,min(17vw,32svh),17rem);
  padding:clamp(.9rem,2.2vw,1.4rem);border:var(--bw) solid var(--brand);
  border-radius:var(--br);background:var(--pure)}
.e-strip .story-beat span{font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);
  text-transform:uppercase;color:var(--grey)}
.e-strip .story-beat strong{font-size:var(--h2);font-weight:900;letter-spacing:-.035em;
  line-height:1.05;color:var(--forest)}
.e-strip .story-beat p{font-size:var(--small);font-weight:500;line-height:1.4;color:var(--muted)}
.e-strip .story-beat:last-child{background:var(--forest);border-color:var(--forest)}
.e-strip .story-beat:last-child span{color:var(--pale)}
.e-strip .story-beat:last-child strong{color:var(--white)}
.e-strip .story-beat:last-child p{color:var(--light)}

@media (max-width:900px){
  .e-tabs{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
  .e-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .e-panel{max-height:none;overflow:visible}
  .e-two,.e-strip,.e-tgls{grid-template-columns:1fr}
  .e-link{grid-template-columns:1fr}
}
/* the refunds preview is a link, and has to read as one */
.a-reflink{color:var(--brand);text-decoration:underline;text-underline-offset:.2em;
  overflow-wrap:anywhere;display:inline-block;min-height:var(--ctrl-t-h);
  display:inline-flex;align-items:center}



/* ---- live hub: the moment, then the real sections stacked under it ---- */
.lhub{display:grid;gap:var(--section-gap);width:100%}
/* The lead holds most of a screen so arriving still feels like arriving, but
   stops short of a full one so the first section header peeks and the page
   reads as continuing. */
.moment.lead{min-height:calc(72svh - var(--chrome-gap-y));align-content:center}
/* the actions sit clear of the figures rather than crowding under them */
.moment.lead>.wrap{margin-top:clamp(2.75rem,9svh,6rem)}
.lstack{display:grid;gap:var(--section-gap)}
.lsec{display:grid;gap:var(--group-gap)}
.lsec-go{display:flex;align-items:center;gap:var(--group-gap-x);width:100%;
  min-height:var(--ctrl-s-h);padding:0 clamp(.8rem,1.6vw,1.2rem);
  border:var(--bw) solid var(--brand);border-radius:var(--br);background:var(--pure);
  color:var(--forest);text-align:left}
.lsec-go .lg-l{flex:1 1 auto;min-width:0;font-size:var(--h3);font-weight:900;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsec-go .lg-o{flex:0 0 auto;font-size:var(--tag);font-weight:900;letter-spacing:var(--tag-ls);
  text-transform:uppercase;color:var(--brand)}
.lsec-go .ga{flex:0 0 auto;color:var(--brand);font-size:var(--h3);font-weight:700;line-height:1}
.lsec-go:hover{background:var(--brand-5)}
/* the section is the page's own markup, so its title steps down a level here
   and its own back-to-hub affordances are not repeated */
.lsec-body{display:grid;gap:var(--group-gap);min-width:0}
.lsec-body .h1{font-size:var(--h2)}
.lsec-body .scene-head{gap:.35rem}
/* the Updates link on the campaign-page section is the only route to the
   updates history from the hub, so it stays visible inline */
@media (max-width:600px){
  .moment.lead{min-height:0}
  .lsec-go .lg-o{display:none}
}

</style>

   upfront does, and buys it down to 15%. Upfront is a Product option only:
   there is no such thing as an upfront Idea campaign, so isUpfront() is the
   one place that decides and nothing downstream has to remember the rule.

   screen, the offer band, the counter modal and the counter's opening bid
   all move together. */

function btn(tier, label, attrs){
  attrs = attrs || {};
  var a = ['class="btn btn-'+tier + (attrs.cls?' '+attrs.cls:'') + '"'];
  if (attrs.act)      a.push('data-action="'+escAttr(attrs.act)+'"');
  if (attrs.arg!=null)a.push('data-arg="'+escAttr(attrs.arg)+'"');
  if (attrs.type)     a.push('type="'+escAttr(attrs.type)+'"');
  else                a.push('type="button"');
  if (attrs.disabled) a.push('disabled');
  if (attrs.aria)     a.push('aria-label="'+escAttr(attrs.aria)+'"');
  return '<button '+a.join(' ')+'>'+esc(label)+'</button>';
}

function storyChapter(id){ return STORY_CHAPTERS.filter(function(x){ return x.id===id; })[0] || STORY_CHAPTERS[0]; }
function storyIndex(id){ var i=-1; STORY_CHAPTERS.forEach(function(x,n){ if(x.id===id) i=n; }); return Math.max(0,i); }
function storyLifecycleSection(){
  if (state.phase==='matching'||state.phase==='waiting') return 'choose';
  if (state.phase==='live') return 'live';
  if (state.phase==='ended'){
    if (state.cancelled) return 'after';
    if (!state.story.closeRecapDone) return 'live';
    if (state.section==='after') return 'after';
    return 'payouts';
  }
  return 'choose';
}
function storyUnlocked(id){
  if (id==='choose'||id==='settings') return true;
  if (id==='live') return state.phase==='live'||state.phase==='ended';
  if (id==='payouts'||id==='after') return state.phase==='ended';
  return false;
}
function storyLockedLine(id){
  if (id==='live')    return 'Opens when a creator accepts and the campaign is live.';
  if (id==='payouts') return 'Opens when the campaign closes and the money is counted.';
  if (id==='after')   return 'Opens when the campaign is over.';
  return '';
}
function storyNormalize(){
  var valid=['choose','live','payouts','after','settings'];
  if (valid.indexOf(state.section)<0) state.section = storyLifecycleSection();
  if (state.section!=='settings' && !storyUnlocked(state.section)) state.section = storyLifecycleSection();
  if (state.phase==='ended' && !state.cancelled && !state.story.closeRecapDone && state.section==='after') state.section='live';
}
/* The state change lands immediately and the NEW screen animates in. Gating a
   navigation on an exit tween's onComplete means a throttled ticker (background
   tab, low-power mode) leaves the app unnavigable — the animation must never be
   load-bearing for the state machine. */
function storyNavigate(target){
  if (!target) return;
  if (target!=='settings' && !storyUnlocked(target)){ toast(storyLockedLine(target)||'That part of the story is not open yet.'); return; }
  if (target==='settings') state.story.returnSection = state.section==='settings' ? storyLifecycleSection() : state.section;
  var from = state.section==='settings' ? (state.story.returnSection||storyLifecycleSection()) : state.section;
  var to   = target==='settings' ? from : target;
  STORY_ENTER_DIR = storyIndex(to)>storyIndex(from) ? 1 : storyIndex(to)<storyIndex(from) ? -1 : 0;
  state.section = target; state.drawer = null; state.modal = null; state.page = null;
  persist(); render(); window.scrollTo({top:0,behavior:'auto'});
}
function storyReturnToNow(){ storyNavigate(state.story.returnSection || storyLifecycleSection()); }


/* ---------- pages: hubs and drill-ins ----------------------------------
   A chapter's home is a HUB: the numbers that matter at true scale, a
   scannable state, and links out. Everything that manages detail — the
   leaderboard, the posts, the backers, the numbers behind the numbers — is
   its own PAGE, reached by a link and left by a back control that always
   sits in the upper left. That is what keeps a hub from collapsing back
   into a dashboard: the detail is one tap away, not stacked underneath.
   ---------------------------------------------------------------------- */
var PAGES = {};
function page(id, def){ PAGES[id] = Object.assign({ id:id }, def); }
function openPage(id){
  if (!PAGES[id]) return;
  state.page = id; state.drawer = null; SCENE_ENTER_DIR = 1;
  persist(); render(); window.scrollTo({top:0,behavior:'auto'});
}
function closePage(){
  state.page = null; SCENE_ENTER_DIR = -1;
  persist(); render(); window.scrollTo({top:0,behavior:'auto'});
}
function backBar(label){
  return '<div class="backbar"><button type="button" class="backbtn" data-action="page-back">'
       + '<span class="ar" aria-hidden="true">\u2190</span><span>' + esc(label||'Back') + '</span></button></div>';
}
/* A link out is a real target, not underlined text: it has to look pressable
   from across the room, because it is how the founder reaches half the app. */
function linkOut(id, label, meta){
  return '<button type="button" class="lnk" data-page="' + escAttr(id) + '">'
       + '<span class="lt">' + esc(label) + '</span>'
       + (meta ? '<span class="lm">' + esc(meta) + '</span>' : '')
       + '<span class="la" aria-hidden="true">\u2192</span></button>';
}
function linkRow(items){ return '<div class="lnks">' + items.join('') + '</div>'; }

/* ---------- scene engine ------------------------------------------------
   A chapter is a sequence. One scene owns the screen; the founder moves
   forward on purpose. Scene tables carry their own posture and frame so the
   composition of each beat is declared, not inherited.
   ---------------------------------------------------------------------- */
function sceneKey(){ return (state.section==='live' && state.phase==='ended') ? 'after' : state.section; }
function chapterScenes(){
  /* Every chapter is now a hub plus drill-in pages. Nothing is a foot-rail
     sequence, so this is always empty — kept because the scene helpers and the
     payout scene builders still reference it. */
  return [];
}
function sceneIndex(){
  var sc = chapterScenes(); if (!sc.length) return 0;
  return Math.max(0, Math.min(sc.length-1, Number(state.scene[sceneKey()])||0));
}
function sceneNormalize(){
  var kk = sceneKey(), sc = chapterScenes(); if (!sc.length) return;
  var ix = Math.max(0, Math.min(sc.length-1, Number(state.scene[kk])||0));
  if (state.scene[kk] !== ix){ var n = Object.assign({}, state.scene); n[kk]=ix; state.scene=n; }
}
function sceneSet(i, dir){
  var kk = sceneKey(), sc = chapterScenes(); if (!sc.length) return;
  var cur = sceneIndex();
  var next = Math.max(0, Math.min(sc.length-1, Number(i)||0));
  if (next === cur) return;
  SCENE_ENTER_DIR = dir!=null ? dir : (next>cur ? 1 : -1);
  var n = Object.assign({}, state.scene); n[kk]=next; state.scene=n;
  state.drawer = null;
  persist(); render(); window.scrollTo({top:0,behavior:'auto'});
}
function sceneGo(delta){ sceneSet(sceneIndex()+Number(delta), Number(delta)>0?1:-1); }
function currentScene(){ var sc = chapterScenes(); return sc.length ? sc[sceneIndex()] : null; }

function renderFoot(){
  /* The foot rail is gone: no dots, no step counter, no progress treatment of
     any kind. It also used to sit outside .stage, whose min-height never
     accounted for it — which is why every Get paid screen overflowed by
     exactly the foot's height. */
  return '';
}

/* ---------- pre-dashboard progress ------------------------------------- */
function progressSteps(){
  var arr=['password'];
  if (state.highEffort) arr.push('effort');
  if (state.campaignType==='product') arr.push('refunds');
  arr.push('community');
  if (state.communityPaid) arr.push('communityThanks');
  var ix = Math.max(0, arr.indexOf(state.onboarding));
  return { arr:arr, ix:ix, pct:(ix+1)/arr.length };
}

/* ---------- render ------------------------------------------------------ */
function render(){
  var root = document.getElementById('app');
  root.innerHTML = state.passwordSet ? renderShell() : renderOnboarding();
  document.getElementById('chrome').innerHTML = state.passwordSet ? renderStoryChrome() : renderFlowChrome();
  document.getElementById('overlays').innerHTML =
      (state.drawer ? renderDrawer() : '')
    + (state.modal  ? renderModal()  : '')
    + (state.toast  ? '<div id="toast" class="on"><div class="tt">'+esc(state.toast)+'</div></div>' : '');
  bind();
  motionEntrance();
}

function renderFlowChrome(){
  progressSteps();
  return '<header class="band">' + WORDMARK
    + '<div class="dayline"><span class="nm">Teeb</span><span class="sep">·</span>'
    + '<span class="ph">Setting up</span></div>'
    + '<div class="right" style="gap:var(--group-gap-x)">'
    + '</div></header>';
}

function renderOnboarding(){
  var POSTURE = { password:'mid-decision', effort:'mid-decision', refunds:'top-work',
                  community:'top-work', communityThanks:'center-reveal' };
  var FRAME   = { password:'standard', effort:'standard', refunds:'standard',
                  community:'wide', communityThanks:'narrow' };
  var st = state.onboarding;
  return '<div class="stage '+(POSTURE[st]||'top-work')+'"><div class="frame '+(FRAME[st]||'standard')+'">'
       + renderOnboardingStep() + '</div></div>';
}

function renderShell(){
  storyNormalize();
  sceneNormalize();

  if (state.page && PAGES[state.page]){
    var pg  = PAGES[state.page];
    var ttl = typeof pg.title === 'function' ? pg.title() : pg.title;
    var bk  = typeof pg.back  === 'function' ? pg.back()  : pg.back;
    return '<div class="stage ' + (pg.posture||'top-work') + '"><div class="frame ' + (pg.frame||'standard') + '">'
         + backBar(bk)
         + '<div class="scene top">' + pg.render() + '</div>'
         + '</div></div>';
  }

  var sc = currentScene(), body, posture, frame;
  if (sc){ body = sc.render(); posture = sc.posture; frame = sc.frame; }
  else { var bt = renderSectionBeat(); body = bt.html; posture = bt.posture; frame = bt.frame; }

  var lb = renderLookingBack();
  return '<div class="stage scene-stage ' + posture + '"><div class="frame ' + frame + '">'
       + (lb ? lb : '')
       + '<div class="scene' + (posture==='top-work'||posture==='scrollable-work' ? ' top' : '') + '">' + body + '</div>'
       + '</div></div>' + renderFoot();
}

/* Screens that are not part of a sequence: the authored arrival and recap
   beats, the chapter hubs, the waiting room, settings, the locked states. */
function renderSectionBeat(){
  if (state.section === 'choose'){
    var banner = renderFounderInterviewBanner();
    if (state.phase === 'matching' && !state.story.chooseIntroSeen)
      return { html: banner + renderChooseIntro(), posture:'mid-decision', frame:'wide' };
    if (state.phase === 'waiting')
      return { html: banner + renderWaiting(), posture:'mid-decision', frame:'standard' };
    if (state.phase === 'ended')
      return { html: chooseClosed(), posture:'mid-decision', frame:'narrow' };
    return { html: banner + renderChooseHub(), posture:'top-work', frame:'wide' };
  }
  if (state.section === 'live'){
    if (state.phase === 'matching' || state.phase === 'waiting')
      return { html: liveNotYet(), posture:'mid-decision', frame:'narrow' };
    if (state.phase === 'live' && !state.story.liveRecapDone)
      return { html: renderLiveRecap(), posture:'mid-decision', frame:'wide' };
    if (state.phase === 'ended' && !state.cancelled && !state.story.closeRecapDone)
      return { html: renderCloseRecap(), posture:'mid-decision', frame:'standard' };
    if (state.phase === 'ended')
      return { html: renderAfterHub(), posture:'mid-decision', frame:'wide' };
    return { html: renderLiveHub(), posture:'top-work', frame:'wide' };
  }
  if (state.section === 'payouts')
    return { html: renderPayoutHub(), posture:'mid-decision', frame:'wide' };
  if (state.section === 'settings')
    return { html: renderSettings(), posture:'top-work', frame:'wide' };
  if (state.section === 'after'){
    if (state.phase !== 'ended')
      return { html: afterLocked(), posture:'mid-decision', frame:'narrow' };
    return { html: renderAfterHub(), posture:'mid-decision', frame:'wide' };
  }
  return { html:'', posture:'top-work', frame:'standard' };
}

    + '<p class="lede">This section will become your daily campaign home once it\u2019s live.</p></div>'
