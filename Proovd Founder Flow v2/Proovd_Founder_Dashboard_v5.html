/* ---------- binding ----------------------------------------------------- */
function bind(){
  $$('[data-noop]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); }; });
  $$('[data-section]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); storyNavigate(x.dataset.section); }; });
  $$('[data-story-section]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); storyNavigate(x.dataset.storySection); }; });
  $$('[data-scene]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); sceneSet(Number(x.dataset.scene)); }; });
  $$('[data-page]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); openPage(x.dataset.page); }; });
  $$('[data-scene-go]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); sceneGo(Number(x.dataset.sceneGo)); }; });
  $$('[data-aff]').forEach(function(x){ x.onclick=function(){ state.selectedAffiliate=x.dataset.aff; persist(); render(); }; });
  $$('[data-settings]').forEach(function(x){ x.onclick=function(){ set({settingsTab:x.dataset.settings}); }; });
  $$('[data-settings-jump]').forEach(function(x){ x.onclick=function(){ state.settingsTab=x.dataset.settingsJump; storyNavigate('settings'); }; });
  $$('[data-close-modal]').forEach(function(x){ x.onclick=function(){ set({modal:null}); }; });
  $$('[data-close-drawer]').forEach(function(x){ x.onclick=function(){ set({drawer:null}); }; });
  $$('[data-open-legal]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); state.legalType=x.dataset.openLegal; set({drawer:'legal'}); }; });
  $$('[data-community]').forEach(function(x){ x.onclick=function(){ set({communityMode:x.dataset.community}); }; });
  $$('[data-bonus-pct]').forEach(function(x){ x.onclick=function(){ state.bonusDraft=Object.assign({},state.bonusDraft,{pct:Number(x.dataset.bonusPct)}); render(); }; });
  $$('[data-bonus-period]').forEach(function(x){ x.onclick=function(){ state.bonusDraft=Object.assign({},state.bonusDraft,{period:x.dataset.bonusPeriod}); render(); }; });
  $$('[data-counter-step]').forEach(function(x){ x.onclick=function(){ state.counterDraft=Math.max(1,Math.min(90,state.counterDraft+Number(x.dataset.counterStep))); render(); }; });
  $$('[data-meeting]').forEach(function(x){ x.onclick=function(){ selected().meeting=x.dataset.meeting; persist(); render(); }; });
  $$('[data-toggle]').forEach(function(x){ x.onclick=function(){ var kk=x.dataset.toggle; var n=Object.assign({},state.notifications); n[kk]=!n[kk]; state.notifications=n; persist(); render(); }; });
  $$('[data-like]').forEach(function(x){ x.onclick=function(){ var n=Object.assign({},state.likedPosts); n[x.dataset.like]=!n[x.dataset.like]; state.likedPosts=n; persist(); render(); toast(n[x.dataset.like]?'Liked — creator will see it.':'Like removed.'); }; });
  $$('[data-issue]').forEach(function(x){ x.onclick=function(){ state.selectedAffiliate=x.dataset.issue; set({modal:'issue'}); }; });
  $$('[data-creator-detail]').forEach(function(x){ x.onclick=function(){ state.selectedAffiliate=x.dataset.creatorDetail; set({drawer:'creator'}); }; });
  $$('[data-backer]').forEach(function(x){ x.onclick=function(){ set({modal:'backer'}); }; });
  $$('[data-work-again]').forEach(function(x){ x.onclick=function(){ var n=Object.assign({},state.workAgainRequests); n[x.dataset.workAgain]=true; state.workAgainRequests=n; persist(); render(); toast('Work-again request sent.'); }; });
  $$('[data-profile]').forEach(function(x){ x.oninput=function(e){ var n=Object.assign({},state.profile); n[x.dataset.profile]=e.target.value; state.profile=n; persist(); }; });
  $$('[data-personal]').forEach(function(x){ x.oninput=function(e){ var n=Object.assign({},state.personal); n[x.dataset.personal]=e.target.value; state.personal=n; persist(); }; });
  $$('[data-community-link]').forEach(function(x){ x.oninput=function(e){ state.communityLinks[Number(x.dataset.communityLink)]=e.target.value; persist(); }; });
  $$('[data-remove-community]').forEach(function(x){ x.onclick=function(){ state.communityLinks.splice(Number(x.dataset.removeCommunity),1); persist(); render(); }; });
  $$('[data-marketing]').forEach(function(x){ x.onclick=function(){ state.marketingPurpose=x.dataset.marketing; persist(); render(); }; });

  var rt=$('#refundLink'); if(rt) rt.oninput=function(e){
    var v=e.target.value, pv=$('#refundPreview');
    if(pv){ pv.textContent = v || 'yourstore.com/refunds'; pv.setAttribute('href', v||'#'); }
    state.refundLink=v; persist();
  };
  var cl=$('#communityLink'); if(cl) cl.oninput=function(e){ state.communityLink=e.target.value; persist(); };
  var bb=$('#bonusBackers'); if(bb) bb.oninput=function(e){ state.bonusDraft=Object.assign({},state.bonusDraft,{backers:Number(e.target.value||0)}); persist(); };
  var rr=$('#rejectReason'); if(rr) rr.oninput=function(e){ state.rejectReason=e.target.value; persist(); };
  var w9=$('#w9file'); if(w9) w9.onchange=function(){ state.w9=true; persist(); render(); toast('W-9 uploaded.'); };
  var pf=$('#proofFile'); if(pf) pf.onchange=function(){ state.proofDelivery=true; persist(); render(); toast('Delivery proof uploaded for review.'); };
  var cf=$('#campaignVisual'); if(cf) cf.onchange=function(){ toast('Visual added to this update request.'); };
  var form=$('#passwordForm'); if(form) form.onsubmit=function(e){
    e.preventDefault();
    var a=$('#pw').value, b=$('#pw2').value;
    if (a.length<8){ toast('Use at least 8 characters.'); return; }
    if (a!==b){ toast('Those passwords don’t match.'); return; }
    nextAfterPassword();
  };
  var pw=$('#pw'); if(pw) pw.oninput=function(e){
    var n=Math.min(4,Math.max(0,Math.floor(e.target.value.length/3)));
    $$('.strength i').forEach(function(el,i){ el.classList.toggle('on', i<n); });
  };
  $$('[data-action]').forEach(function(x){ x.onclick=function(e){ e.preventDefault(); handleAction(x.dataset.action, x); }; });
  bindMotion();
}

/* Arrow keys move the story the way a deck does. Typing is sacred: never steal
   the key while a field, a modal or the drawer has the founder. */
document.addEventListener('keydown', function(e){
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (state.modal || state.drawer || !state.passwordSet) return;
  var t = e.target;
  if (t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if (chapterScenes().length<2) return;
  if (e.key==='ArrowRight'){ e.preventDefault(); sceneGo(1); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); sceneGo(-1); }
});

/* ---------- motion (DNA 6.5) -------------------------------------------- */
function motionEntrance(){
  if (!HAS_GSAP) return;
  var g = window.gsap, red = reduced();
  var scene = $('.scene') || $('.stage>.frame');

  if (scene && !red && (SCENE_ENTER_DIR || STORY_ENTER_DIR)){
    var dir = SCENE_ENTER_DIR || STORY_ENTER_DIR;
    g.fromTo(scene, { x: dir>0 ? 34 : -34, opacity:.15 },
      { x:0, opacity:1, duration:dur('slow'), ease:MOTION.ease.move, clearProps:'transform' });
  }
  SCENE_ENTER_DIR = 0; STORY_ENTER_DIR = 0;

  /* the one progress treatment fills from the left, always */
  $$('[data-rail]').forEach(function(r){
    var pct = Math.max(0, Math.min(1, Number(r.dataset.pct)||0));
    var segs = $$('[data-rail-seg]', r), n = segs.length;
    segs.forEach(function(seg,i){
      var fill = Math.max(0, Math.min(1, pct*n - i));
      if (red){ g.set(seg,{ scaleX:fill }); return; }
      g.fromTo(seg, { scaleX:0 }, { scaleX:fill, duration:dur('slow'), ease:MOTION.ease.move, delay:i*.04 });
    });
  });

  if (red){ return; }

  var head = $('.h1');
  if (head){
    if (window.SplitText && document.fonts && document.fonts.ready){
      Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r,400); })]).then(function(){
        var sp;
        try { sp = new SplitText(head, { type:'words', mask:'lines' }); }
        catch(e){ g.fromTo(head,{opacity:0,y:18},{opacity:1,y:0,duration:dur('base')}); return; }
        g.set(head,{opacity:1});
        g.from(sp.words, { yPercent:120, opacity:0, duration:.65*k(), ease:MOTION.ease.hero,
          stagger:MOTION.text.words, onComplete:function(){ try{ sp.revert(); }catch(e){} } });
      });
    } else {
      g.fromTo(head,{opacity:0,y:18},{opacity:1,y:0,duration:dur('base'),ease:MOTION.ease.hero});
    }
  }
  var num = $('.hero-num');
  if (num) g.fromTo(num, {opacity:0,y:14,scale:.96},
    {opacity:1,y:0,scale:1,duration:dur('base'),ease:MOTION.ease.out,delay:.05,clearProps:'transform'});

  var support = $$('.lede,.copy,.card,.sect,.stat-l,.stat-d,.stat-w,.opt,.note').slice(0,6);
  if (support.length) g.fromTo(support, {opacity:0,y:MOTION.dur?MOTION.dist.enter:16},
    {opacity:1,y:0,duration:dur('base'),ease:MOTION.ease.out,stagger:MOTION.stagger.tight,delay:.06,clearProps:'transform'});
}
function bindMotion(){
  if (!HAS_GSAP || reduced()) return;
  var g = window.gsap, hoverable = window.matchMedia('(hover:hover)').matches;
  $$('button,.btn').forEach(function(el){
    if (el.disabled) return;
    var up = function(){ g.to(el,{scale:1,duration:.25,ease:MOTION.ease.out}); };
    el.addEventListener('pointerdown', function(){ g.to(el,{scale:.97,duration:MOTION.dur.instant,ease:'power2.out'}); });
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
    if (hoverable){
      el.addEventListener('mouseenter', function(){
        g.to(el,{scale:el.classList.contains('btn-p')?1.02:1.015,duration:MOTION.dur.instant,ease:'power2.out'});
      });
      el.addEventListener('mouseleave', up);
    }
  });
  $$('.field').forEach(function(el){
    el.addEventListener('focus', function(){ g.to(el,{scale:1.008,duration:MOTION.dur.base,ease:MOTION.ease.out}); });
    el.addEventListener('blur',  function(){ g.to(el,{scale:1,duration:MOTION.dur.quick,ease:MOTION.ease.exit}); });
  });
}

/* ---------- actions ----------------------------------------------------- */
function nextAfterPassword(){
  if (state.highEffort) set({onboarding:'effort'});
  else if (state.campaignType==='product') set({onboarding:'refunds'});
  else set({onboarding:'community'});
}
function handleAction(a, el){
  if(a==='story-explore'){set({drawer:'story'});return}
  if(a==='page-back'){closePage();return}
  if(a==='open-page'){openPage(el&&el.dataset?el.dataset.arg:null);return}
  if(a==='story-home'||a==='story-back-current'){storyNavigate(storyLifecycleSection());return}
  if(a==='story-back-now'){storyReturnToNow();return}
  if(a==='goto-after'){storyNavigate('after');return}
  if(a==='goto-choose'){storyNavigate('choose');return}
  if(a==='story-start-choose'){state.story.chooseIntroSeen=true;state.scene=Object.assign({},state.scene,{choose:0});persist();render();return}
  if(a==='story-recap-next'){state.story.liveRecapStep=Math.min(2,(state.story.liveRecapStep||0)+1);SCENE_ENTER_DIR=1;persist();render();return}
  if(a==='story-recap-done'||a==='story-recap-skip'){state.story.liveRecapDone=true;state.story.liveRecapStep=0;state.scene=Object.assign({},state.scene,{live:0});persist();render();return}
  if(a==='story-close-next'){state.story.closeRecapStep=Math.min(2,(state.story.closeRecapStep||0)+1);SCENE_ENTER_DIR=1;persist();render();return}
  if(a==='story-close-done'||a==='story-close-skip'){state.story.closeRecapDone=true;state.story.closeRecapStep=0;state.scene=Object.assign({},state.scene,{payouts:0});persist();storyNavigate('payouts');return}

function exportBackers(){
  var rows=[['Name','Pledge','Source','Checkout comment'],['Amina Salem','70','Instagram','I’ve been waiting for a local brand to do this.'],['Youssef Nabil','45','TikTok','Please make a travel size.'],['Sara Hany','120','Organic','Found you through search — the story sold me.'],['Maya Fawzy','70','Instagram','Would love a sampler set next.'],['Nadine Emad','45','TikTok','Gift packaging would be amazing.']];
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');

function playWrap(){

/* The chrome answers two questions and then gets out of the way: where the
   campaign is (the dayline), and where the founder is in it (the chapter
   rail, built from the one sanctioned progress treatment). */
function renderStoryChrome(){
  const viewed = S.section==='settings' ? (S.story.returnSection||storyLifecycleSection()) : S.section;
  const active = storyIndex(viewed), ch = storyChapter(viewed);

  /* a current chapter shows real progress, not a decorative half-fill */
  const pctFor = function(id){
    if (id==='choose')  return S.phase==='matching' ? .45 : S.phase==='waiting' ? .8 : 1;
    if (id==='live')    return Math.max(.1, Math.min(1, S.campaignDay / S.campaignLength));
    if (id==='payouts'){
      const steps = [S.w9, S.payoutRequested,
                     S.campaignType==='idea' ? S.ideaPaid : S.firstPayoutPaid,
                     S.campaignType==='idea' ? S.progressUpdateSubmitted : S.remainingPayoutPaid];
      let d = 0; steps.forEach(function(v){ if (v) d++; });
      return Math.max(.12, d/steps.length);
    }
    if (id==='after')   return S.afterPlayed ? 1 : .6;
    return 0;
  };

  const chapters = STORY_CHAPTERS.map(function(x,i){
    const unlocked = storyUnlocked(x.id);
    const cls = i<active ? 'done' : i===active ? 'current' : unlocked ? '' : 'locked';
    return `<button type="button" class="ch ${cls}" data-story-section="${escAttr(x.id)}"${!unlocked?' disabled':''}><label>${esc(x.label)}</label></button>`;
  }).join('');

  return `<header class="band"><button type="button" class="f-wm" data-action="story-home">${WORDMARK}</button><div class="dayline"><span class="nm">Teeb</span><span class="sep">·</span><span class="ph">${esc(phaseLabel())}</span>${S.phase==='live'?`<span class="sep">·</span><span class="rest">Day ${S.campaignDay}</span>`:''}</div><div class="now"><span class="nl">${S.section==='settings'?'Off the story · Settings':`Chapter ${active+1} of ${STORY_CHAPTERS.length}`}</span><span class="nt">${esc(S.section==='settings'?'Account controls':ch.title)}</span></div><div class="right">${S.section==='settings'?`<button type="button" class="back-now" data-action="story-back-now">Back to story</button>`:''}<button type="button" class="bell" aria-label="Notifications" data-action="notifications">${icon('bell')}<span class="badge">4</span></button><button type="button" class="explore-btn" aria-label="Settings" data-action="story-explore">${icon('dots')}<span>Settings</span></button></div></header><div class="chapters">${chapters}</div>`;
}

/* ---- the story drawer: the whole campaign on one night field ---- */
function renderStoryDrawer(){
  const now = storyLifecycleSection();

    const unlocked = storyUnlocked(x.id), current = x.id===now, viewing = x.id===S.section;
    const status = !unlocked ? 'Not yet' : current ? 'Now' : viewing ? 'Open' : 'Available';
    const body = !unlocked ? storyLockedLine(x.id) : x.note;
    const inner = `<span class="dtag">0${i+1} · ${esc(status)}</span><span class="dt">${esc(x.title)}</span><span class="db">${esc(body)}</span>`;

/* ==== A — ONBOARDING ====================================================
   The founder's first five screens after the Founder Flow. One decision per
   screen, a real headline, generous fields, no scroll. Postures and frames
   are declared by the shell's renderOnboarding() map:
     password  mid-decision/standard · effort    mid-decision/standard

function renderOnboardingStep(){

/* ================= PAYOUTS ================= */
/* ==================== D — PAYOUTS: the money, told in order ====================
   The chapter is genuinely a sequence of obligations, so it is the one chapter
   the shell still runs on a foot rail. Scene 0 is the moment: the net figure at
   display scale, the ledger beside it, the one thing that needs the founder, and
   links out to the full step list and the tax form.
   ============================================================================ */

function payoutFigures(){
  const gross=12840, aff=2760, proovd=385;
  return { gross:gross, aff:aff, proovd:proovd, net:gross-aff-proovd,
           eligible: S.campaignDay>=3 || S.phase==='ended' };
}

/* Ordered obligations. The review steps only exist while a rep actually holds
   the request — the same conditions the v4 path used. */
function payoutMilestoneIds(){
  const ids=[{id:'retry',label:'Card retries'}];
  if(S.campaignType==='idea'){
    ids.push({id:'request',label:'Request payment'});
    if(S.payoutRequested&&!S.payoutApproved) ids.push({id:'review',label:'In review'});
    ids.push({id:'update',label:'14-day update'});
  }else{
    ids.push({id:'first',label:'First 40%'});
    if(S.payoutRequested&&!S.firstPayoutPaid) ids.push({id:'review1',label:'In review'});
    ids.push({id:'proof',label:'Delivery proof'});
    ids.push({id:'rest',label:'Remaining 60%'});
    if(S.restRequested&&!S.remainingPayoutPaid) ids.push({id:'review2',label:'Final review'});
  }
  return ids;
}

/* One milestone as data, so the same words can be a scene, the promoted act on
   the hub, or a row on the step list without ever being re-typed. */
function payoutMilestone(id){
  const f=payoutFigures();
  const ideaPaid=S.ideaPaid||false, firstPaid=S.firstPayoutPaid||false, remainingPaid=S.remainingPayoutPaid||false;
  const updateState=S.progressUpdateSubmitted?'Sent ✓':S.progressUpdateDue?'Due now':(ideaPaid?'Scheduled':'After payout');
  const m={id:id,label:'',head:'',body:'',extra:'',act:'',done:false,action:false,upload:false};
  const all=payoutMilestoneIds();
  for(let i=0;i<all.length;i++) if(all[i].id===id) m.label=all[i].label;

  if(id==='retry'){
    m.head='Three-day card retry window';
    m.body='We retry failed cards and reduce chargebacks before you request money. After day three you can see exactly what cleared.';
    m.extra=f.eligible?`<div class="note d-capture"><strong>181 / 183 cards cleared</strong><span>$12,650 captured after retries</span></div>`:``;
    m.act=f.eligible?tagQuiet('Complete'):tagQuiet('In progress','soft');
    m.done=f.eligible;
  }else if(id==='request'){
    m.head=ideaPaid?'Payment paid':S.payoutRequested?'Payment requested':'Request your payout';
    m.body=ideaPaid?`${money(f.net)} was approved by a Proovd rep and sent to your payout account.`:'A Proovd rep approves the request before your net campaign money is paid out.';
    m.act=ideaPaid?tagQuiet('Paid ✓'):btn(S.payoutRequested?'s':'p',S.payoutRequested?'With Proovd rep':'Request payment',{act:'request-payout',disabled:!f.eligible||!S.w9||S.payoutRequested});
    m.done=ideaPaid||S.payoutRequested;
    m.action=!ideaPaid;
  }else if(id==='review'){
    m.head='Proovd is reviewing the request';
    m.body='No action from you. The rep approval and provider transfer are separate from the card-retry window you already cleared.';
    m.act=tagQuiet('In review','soft');
  }else if(id==='update'){
    m.head='14-day founder update';
    m.body=S.progressUpdateDue?'Your 14-day update is due. Send it so Proovd knows the campaign is still moving. Ghosting this request bans the account.':'Fourteen days after payout, Proovd asks for a progress update. Ghosting that request bans the account.';
    m.action=S.progressUpdateDue&&!S.progressUpdateSubmitted;
    m.act=m.action?btn('p','Send my update',{act:'payout-update'}):tagQuiet(updateState,ideaPaid?'':'soft');
    m.done=S.progressUpdateSubmitted;
  }else if(id==='first'){
    m.head=firstPaid?'First 40% paid':S.payoutRequested?'First 40% requested':'Request the first 40%';
    m.body=firstPaid?`${money(Math.round(f.net*.4))} was approved by a Proovd rep and sent.`:`${money(Math.round(f.net*.4))} becomes requestable after the card retry window. A Proovd rep approves it before payment.`;
    m.act=firstPaid?tagQuiet('Paid ✓'):btn(S.payoutRequested?'s':'p',S.payoutRequested?'With Proovd rep':'Request 40%',{act:'request-payout',disabled:!f.eligible||!S.w9||S.payoutRequested});
    m.done=firstPaid||S.payoutRequested;
    m.action=!firstPaid;
  }else if(id==='review1'){
    m.head='Proovd is reviewing the first payout';
    m.body='No action from you while the rep approves the request and the transfer is prepared.';
    m.act=tagQuiet('In review','soft');
  }else if(id==='proof'){
    m.head=S.proofDelivery?'Delivery proof received':'Upload proof of delivery';
    m.body='Show delivery to some customers to unlock the remaining money. You have up to 14 days; if you ghost, the account is banned and the held money is returned to backers.';
    m.act=`<label class="btn btn-s" for="proofFile">${S.proofDelivery?'Replace proof':'Upload proof'}</label><input id="proofFile" type="file" accept="image/*,.pdf" hidden>`;
    m.done=S.proofDelivery;
    m.action=true; m.upload=true;
  }else if(id==='rest'){
    m.head=remainingPaid?'Remaining 60% paid':S.restRequested?'Remaining payout requested':'Request the remaining 60%';
    m.body=remainingPaid?`${money(Math.round(f.net*.6))} was approved and sent. Your Product campaign payout is complete.`:`${money(Math.round(f.net*.6))} becomes eligible after delivery proof is reviewed.`;
    m.act=remainingPaid?tagQuiet('Paid ✓'):btn(S.restRequested?'s':'p',S.restRequested?'With Proovd rep':'Request the rest',{act:'request-rest',disabled:!S.proofDelivery||!S.w9||!firstPaid||S.restRequested});
    m.done=remainingPaid||S.restRequested;
    m.action=!remainingPaid;
  }else if(id==='review2'){
    m.head='Final payout is with Proovd';
    m.body='The remaining 60% is being reviewed against your delivery proof before it leaves the held balance.';
    m.act=tagQuiet('In review','soft');
  }
  return m;
}

  var cancelOpen = S.phase === 'matching' || S.phase === 'waiting' || (S.phase === 'live' && S.campaignDay <= 2);
  var cancelCopy = (S.phase === 'matching' || S.phase === 'waiting')
    ? 'The campaign has not started yet, so cancellation is still open. We’ll ask why before anything changes.'
    : cancelOpen
      ? 'You are still inside the first two campaign days. We’ll ask why before anything changes.'
      : 'Cancellation closed after day 2 of the live campaign.';

  return '<div class="e-two">'
    +   '<div class="col gap-g">'
    +     '<div><span class="kicker">Chargebacks</span>'
    +     '<h2 class="h2">' + (S.campaignType === 'idea' ? 'Proovd is responsible.' : 'You are responsible.') + '</h2></div>'
    +     '<p class="copy">' + (S.campaignType === 'idea'
            ? 'For Idea campaigns, Proovd carries chargeback responsibility.'
            : 'For Product campaigns, the founder carries chargeback responsibility because you are delivering the product.') + '</p>'
    +   '</div>'
    +   '<div class="e-block"><h2 class="h3">Cancel campaign</h2>'
    +     '<p class="copy">' + esc(cancelCopy) + '</p>'
    +     '<div class="wrap">'
    +       btn('t','Cancel campaign',{act:'cancel-campaign',cls:'danger',disabled:!cancelOpen})
    +     '</div>'
    +   '</div>'
    + '</div>';
}

function toggleRow(k,v){
  var labels = {
    backer:['Each new backer','A notification when someone backs the campaign.'],
    daily:['Daily recap','One useful summary of the day — not a stream.'],
    creator:['Creator activity','Posts, accepts, performance thresholds and issues.'],
    updates:['Campaign update nudges','Only when an update would help backers.'],
    payout:['Payout milestones','Card retries, approvals and delivery-proof deadlines.']
  };
  var L = labels[k];
  if (!L) return '';
  return '<div class="e-tgl">'
       +   '<div class="grow"><strong>' + esc(L[0]) + '</strong><small>' + esc(L[1]) + '</small></div>'
       +   '<button type="button" class="tgl" data-toggle="' + escAttr(k) + '"'
       +     ' aria-pressed="' + (v ? 'true' : 'false') + '" aria-label="' + escAttr(L[0]) + '"><i></i></button>'
       + '</div>';
}

/* ---------- the wrap moment -------------------------------------------- */
function renderAfterHub(){

  page('after-story', {
    title:'Your campaign story', back:'Campaign complete', posture:'top-work', frame:'wide',
    render:function(){
      var beat = function(when, big, line){
        return '<div class="story-beat"><span>' + esc(when) + '</span>'
             + '<strong>' + esc(big) + '</strong><p>' + esc(line) + '</p></div>';
      };
      return '<div class="scene-lead">'
        +   '<div class="scene-head"><span class="kicker">Your campaign story</span>'
        +   '<h2 class="h2">From first match to final backer.</h2></div>'
        +   btn('s','Play wrap-up',{act:'play-wrap'})
        + '</div>'
        + '<div class="e-strip" id="storyStrip">'
        +   beat('Day 1','3 creators','went live with you.')
        +   beat('Day 4','100 backers','made the campaign feel real.')
        +   beat('Day 8','Organic joined','with no affiliate cut on those backers.')
        +   beat('Final', money(12840), 'raised from 183 people.')
        + '</div>';
    }
  });

  page('after-creators', {
    title:'Creators', back:'Campaign complete', posture:'top-work', frame:'wide',
    render:function(){
      var aff = S.affiliates.slice().sort(function(a,b){ return b.backers - a.backers; }).slice(0,3);
      return '<div class="scene-head"><span class="kicker">Creators</span>'
        +   '<h2 class="h2">Who you’d work with again.</h2></div>'
        + '<div class="podium">' + aff.map(function(a,i){
            var done = !!S.workAgainRequests[a.id];
            var tier = done ? 's' : (i === 0 ? 'p' : 's');
            var label = done ? 'Work-again requested ✓' : 'Send work-again request';
            return '<div class="pod' + (i === 0 ? ' first on-dark' : '') + '">'
              +   '<div class="row">'
              +     ph({on:(i === 0 ? 'forest' : 'light'), seed:i, w:'var(--dossier-media)'})
              +     '<span class="rk">' + (i + 1) + '</span>'
              +   '</div>'
              +   '<span class="nm">' + esc(a.name) + '</span>'
              +   '<span class="hd">' + esc(a.backers + ' backers · ' + money(a.revenue)) + '</span>'
              +   '<button type="button" class="btn btn-' + tier + '" data-work-again="' + escAttr(a.id) + '"'
              +     (done ? ' disabled' : '') + '>' + esc(label) + '</button>'
              + '</div>';
          }).join('') + '</div>';
    }
  });

  page('after-data', {
    title:'Your data', back:'Campaign complete', posture:'top-work', frame:'narrow',
    render:function(){
      return '<div class="scene-head"><span class="kicker">Your data stays yours</span>'
        +   '<h2 class="h2">Backers, recap and account controls.</h2>'
        +   '<p class="copy">Export what you need, manage profile information, or close the account when every obligation is finished.</p>'
        + '</div>'
        + '<div class="wrap">'
        +   btn('p','Export backers',{act:'export-backers'})
        +   '<button type="button" class="btn btn-s" data-section="settings">' + esc('Profile & account') + '</button>'
        + '</div>';
    }
  });

  return '<div class="sect sect-dark on-dark e-field">'
    +   '<div class="scene-head"><span class="kicker">Campaign complete</span>'
    +   '<h1 class="h1">183 people backed Teeb.</h1></div>'
    +   '<div class="figures">'
    +     '<div class="fig"><span class="n hero-num">' + money(12840) + '</span>'
    +       '<span class="l">Money made</span></div>'
    +     '<div class="fig"><span class="n">183</span>'
    +       '<span class="l">Backers</span></div>'
    +   '</div>'
    +   '<div class="e-wrap2">'
    +     note('<strong>Campaign threshold hit ✓</strong>'
    +          '<span class="e-hs">$12,840 raised against a $10,000 threshold</span>')
    +     '<div class="e-cool"><span class="cl">Cooldown</span><strong>3 months</strong>'
    +       '<span class="cs">Then you can apply again.</span></div>'
    +   '</div>'
    +   '<p class="lede">You can keep every recap and backer export. New campaigns open after the cooldown, then you apply again — nothing is auto-accepted.</p>'
    +   linkRow([
          linkOut('after-story','Your campaign story','From first match to final backer.'),
          linkOut('after-creators','Creators','Who you’d work with again.'),
          linkOut('after-data','Your data','Backers, recap and account controls.')
        ])
    + '</div>';
}

render();
})();

</script>
</body>
</html>
