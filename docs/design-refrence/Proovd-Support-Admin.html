:root{
  --brand:#41ed98; --white:#fafafa; --paper:#fff; --green:#013f17; --deep:#012d10;
  --light:#e9ffe1; --mint:#d2fbc2; --muted:#669370; --quiet:#a2afa8; --pale:#eaf7ee;
  --grey:#f1f3f2; --yellow:#f7ff9e; --blue:#defafc; --shell:min(2100px, 100% - 96px);
}
*{box-sizing:border-box}
html{background:var(--white)}
body{background:var(--white);color:var(--deep);margin:0;font-synthesis:none;
  font-family:Satoshi,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:3px solid #41ed9852;outline-offset:3px}
::selection{background:#41ed9826}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
dl,dd{margin:0}

/* ---------- shell ---------- */
.app{min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;background:#fafafaf2;backdrop-filter:blur(6px);
  border-bottom:2px solid var(--brand);display:flex;align-items:center;justify-content:space-between;
  gap:28px;min-height:66px;padding-inline:48px}
.topbar .wordmark{font-size:19px;font-weight:700;letter-spacing:-.04em}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:750;color:var(--muted)}
.topbar .avatar{width:34px;height:34px;display:grid;place-items:center;background:var(--light);
  color:var(--green);font-size:13px;font-weight:800;border-radius:1px}
.wrap{width:var(--shell);margin-inline:auto}

/* ---------- record chrome ---------- */
.nav-context{border-bottom:1px solid var(--pale);display:flex;align-items:center;gap:14px;min-height:74px}
.nav-context .mono{width:46px;height:46px;display:grid;place-items:center;background:var(--light);
  color:var(--green);font-size:15px;font-weight:800;border-radius:1px;flex:none}
.nav-context .id-block{display:flex;flex-direction:column;gap:2px;min-width:0}
.nav-context strong{font-size:20px;letter-spacing:-.02em}
.nav-context .sub{font-size:14px;color:var(--muted)}
.nav-context .spacer{margin-left:auto}
.tabs{display:flex;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--pale)}
.tabs button{flex:none;border:0;border-bottom:3px solid transparent;background:0 0;cursor:pointer;
  color:var(--muted);font-size:15px;font-weight:850;min-height:64px;padding:0 18px;
  display:inline-flex;align-items:center;gap:8px}

.tabs button.active{color:var(--deep);border-bottom-color:var(--brand)}

  padding:2px 8px;border-radius:1px}
.page{padding:44px 0 120px}

/* ---------- buttons ---------- */
.primary,.secondary,.tertiary,.quiet{cursor:pointer;border-radius:1px;display:inline-flex;
  align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 18px;
  font-size:14px;font-weight:850;white-space:nowrap}
.primary{background:var(--brand);border:2px solid var(--brand);color:var(--deep)}
.primary:hover{background:#35d98a;border-color:#35d98a}
.secondary{background:0 0;border:2px solid var(--brand);color:var(--green)}
.secondary:hover{background:var(--pale)}
.tertiary{background:0 0;border:0;color:var(--green);padding-inline:9px;
  text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em;
  text-decoration-color:#9dbfa8}
.tertiary:hover{text-decoration-color:var(--green)}
.quiet{background:var(--paper);border:1px solid #bfcfc5;color:var(--green);
  min-height:40px;padding:0 14px;font-size:13.5px}
.quiet:hover{background:var(--pale);border-color:var(--green)}
.quiet.danger{border-style:dashed;border-color:var(--deep);color:var(--deep)}
.quiet.danger:hover{background:var(--deep);color:var(--white);border-style:solid}
.edit-mark::before{content:"\270E";font-size:15px;line-height:1}

/* ---------- moment / hero ---------- */
.moment{margin-bottom:56px}
.moment .eyebrow{font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px}
.moment h2{font-size:clamp(30px,3.2vw,44px);letter-spacing:-.04em;line-height:1.02;margin-bottom:16px}
.moment p{font-size:17px;line-height:1.6;color:var(--green);max-width:88ch}

/* ---------- section card ---------- */
.section{background:var(--paper);border:1px solid #a9f2cb;padding:30px 32px;
  display:flex;flex-direction:column;align-items:stretch}
.section+.section{margin-top:22px}
.section-head{order:0;margin-bottom:26px}
.section-head h3{font-size:clamp(23px,1.9vw,29px);letter-spacing:-.03em;line-height:1.15}
.section-head p{margin-top:8px;font-size:15px;color:var(--muted);max-width:80ch}
.section>*{order:1}
.section-foot{order:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  margin-top:28px;padding-top:22px;border-top:1px solid var(--brand)}
.section.flag{border:2px solid var(--brand);border-left:.4rem solid var(--deep);padding:34px 34px 34px 30px}
.section.flag .section-head h3{font-size:clamp(26px,2.2vw,32px)}

/* ---------- facts: one per line, always ---------- */
.facts{display:grid;grid-template-columns:minmax(0,1fr)}
.facts>div{display:grid;grid-template-columns:minmax(190px,250px) minmax(0,1fr);gap:36px;
  padding:21px 0;align-items:baseline;border-top:1px solid #c8f6de}
.facts>div:first-child{border-top:0}
.facts dt{font-size:14px;font-weight:750;letter-spacing:.01em;color:var(--muted)}
.facts dd{font-size:17px;font-weight:700;line-height:1.55;max-width:68ch}
.facts dd .soft{font-weight:500;color:var(--muted)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:1px;
  border:2px solid var(--brand);background:var(--paper);color:var(--green);white-space:nowrap}
.chip.wait{background:var(--yellow);border-color:var(--deep);color:var(--deep)}
.chip.done{background:var(--light);border-color:var(--brand);color:var(--green)}
.chip.closed{background:var(--paper);border-color:var(--quiet);color:var(--muted)}
.chip.new{background:var(--brand);border-color:var(--brand);color:var(--deep)}
.chip.sm{font-size:11px;padding:3px 7px;border-width:1px}
.pri{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800}
.pri i{width:9px;height:9px;border-radius:1px;background:var(--quiet);flex:none}
.pri.urgent i{background:var(--deep)}
.pri.high i{background:var(--brand)}

/* ---------- queue ---------- */
.queue-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px}
.queue-tools input{flex:1 1 300px;min-height:48px;padding:0 16px;border:2px solid var(--quiet);
  background:var(--paper);color:var(--deep);border-radius:1px;font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{cursor:pointer;border:1px solid #bfcfc5;background:var(--paper);color:var(--green);
  min-height:40px;padding:0 14px;font-size:13.5px;font-weight:800;border-radius:1px}
.filters button.on{background:var(--deep);border-color:var(--deep);color:var(--white)}
.queue{border-top:2px solid var(--brand)}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:26px;

  border-bottom:1px solid var(--brand);cursor:pointer;padding:22px 14px;min-height:104px}
.trow:hover{background:var(--pale)}
.trow.overdue{box-shadow:inset .35rem 0 0 var(--deep)}
.trow .tid{font-size:13px;font-weight:850;letter-spacing:.05em;color:var(--muted);

.trow .subj{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.trow .who{display:block;margin-top:6px;font-size:15px;color:var(--muted)}
.trow .mid{display:flex;flex-direction:column;gap:7px;font-size:15px}
.trow .next{font-weight:750;color:var(--green)}
.trow .due{font-size:14px;color:var(--muted)}
.trow .due.late{color:var(--deep);font-weight:850}
.trow .go{font-size:22px;color:var(--green)}
.queue-empty{padding:40px 14px;font-size:17px;color:var(--muted);border-bottom:1px solid var(--brand)}

.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);gap:26px;align-items:start}
.rightcol{display:flex;flex-direction:column;gap:22px;position:sticky;top:88px}

/* ---------- conversation ---------- */
.thread{display:flex;flex-direction:column}
.msg{border-top:1px solid #c8f6de;padding:24px 0}

.msg-head strong{font-size:16px;font-weight:800}

.idband{position:sticky;top:66px;z-index:20;background:var(--white);

    h += '<div class="section-foot"><button class="secondary edit-mark" data-act="classify">Change category</button>' +
      '<button class="quiet edit-mark" data-act="priority">Change priority</button>' +
      '<button class="tertiary" data-act="hist" data-v="Classification">View classification history</button></div></section>';

    /* next response */
    h += '<section class="section' + (isOpen(t) && t.nextActionOwner === "Proovd" && !needsOwner(t) ? " flag" : "") + '">';
    h += '<div class="section-head"><h3>Next response</h3><p>' +
      (isOpen(t) ? "Who owes the next action, and when the customer was promised an update." : "This case is finished. Nothing is outstanding.") + "</p></div>";
    if (isOpen(t)) {
      h += rows([
        ["Status", '<span class="chip ' + statusClass(t.status) + '">' + esc(t.status) + "</span>"],
        ["Next action owner", esc(t.nextActionOwner)],
        ["Next action", esc(t.nextAction)],
        ["Next customer update due", t.nextUpdateDue ? esc(t.nextUpdateDue) : '<span class="soft">Not promised yet</span>'],
        ["First-response SLA", esc(t.slaDue) + ' <span class="soft">· ' + esc(t.slaLabel) + "</span>"],
        ["Last response", t.lastResponse ? esc(t.lastResponse) : '<span class="soft">No reply sent yet</span>']
      ]);
    } else {
      h += rows([
        ["Status", '<span class="chip ' + statusClass(t.status) + '">' + esc(t.status) + "</span>"],
        ["Resolution", esc(t.resolution)],
        ["Resolved by", esc(t.resolvedBy) + " · " + esc(t.resolvedAt)],
        ["Closed at", t.closedAt ? esc(t.closedAt) : null]
      ]);
    }
    h += '<div class="section-foot">';
    if (isOpen(t)) {
      h += '<button class="secondary" data-act="status">Change who this is waiting on</button>';
      h += '<button class="quiet edit-mark" data-act="update-due">Set next update date</button>';
      h += '<button class="quiet" data-act="resolve">Mark resolved</button>';
    } else if (t.status === "Resolved") {
      h += '<button class="secondary" data-act="close">Close ticket</button>';
      h += '<button class="quiet" data-act="reopen">Reopen ticket</button>';
    } else {
      h += '<button class="secondary" data-act="reopen">Reopen ticket</button>';
    }
    h += '<button class="tertiary" data-act="hist" data-v="Status">View status history</button>';
    h += "</div></section>";
    return h;
  }

  function evidenceView(t) {
    var h = '<section class="section"><div class="section-head"><h3>Evidence</h3><p>' +
      (t.evidence.length ? "Everything attached to this case, and which record it came from." : "Nothing has been attached to this case yet.") + "</p></div>";
    if (t.evidence.length) {
      h += "<div>";
      t.evidence.forEach(function (e) {
        h += '<div class="ev"><div><strong>' + esc(e.description) + "</strong>" +
          '<div class="m">' + esc(e.type) + " · added by " + esc(e.addedBy) + " · " + esc(e.addedAt) + "<br>" + esc(e.related) + "</div></div>" +
          '<button class="quiet" data-act="link" data-v="' + esc(e.related) + '">Open record</button></div>';
      });
      h += "</div>";
    }
    h += '<div class="section-foot"><button class="secondary" data-act="evidence">Add evidence</button>' +
      '<button class="tertiary" data-act="hist" data-v="Evidence">View evidence history</button></div></section>';

    h += '<section class="section"><div class="section-head"><h3>Parties contacted</h3><p>' +
      (t.contacts.length ? "Coordination Proovd did outside the customer thread. This ticket stays the central case." : "Nobody outside the customer thread has been contacted about this case.") + "</p></div>";
    if (t.contacts.length) {
      h += "<div>";
      t.contacts.forEach(function (c) {
        h += '<div class="ev"><div><strong>' + esc(c.party) + "</strong>" +
          '<div class="m">' + esc(c.at) + "<br>" + esc(c.message) + "<br>Expected back: " + esc(c.expected) + " · " + esc(c.outcome) + "</div></div></div>";
      });
      h += "</div>";
    }
    h += '<div class="section-foot">';
    if (t.related.founder && t.requester.type !== "Founder") h += '<button class="secondary" data-act="contact" data-v="Founder">Contact the Founder</button>';
    if (t.related.affiliate && t.requester.type !== "Affiliate") h += '<button class="quiet" data-act="contact" data-v="Affiliate">Contact the Affiliate</button>';
    if (t.related.backer && t.requester.type !== "Backer") h += '<button class="quiet" data-act="contact" data-v="Backer">Contact the Backer</button>';
    h += '<button class="tertiary" data-act="hist" data-v="Contact">View contact history</button></div></section>';
    return h;
  }

  function historyView(t) {
    var h = '<section class="section"><div class="section-head"><h3>Ticket history</h3>' +
      "<p>Every recorded event on this case, oldest first. Nothing here is editable or removable.</p></div>";
    h += '<div class="timeline">';
    t.timeline.forEach(function (e) {
      h += '<div class="tl"><time>' + esc(e.at) + '</time><div class="what">' + e.what + "</div></div>";
    });
    h += "</div>";
    if (t.reopens.length) {
      h += '<div style="margin-top:30px"><h4 style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Reopen history</h4>';
      t.reopens.forEach(function (r) {
        h += rows([["Reopened by", esc(r.by)], ["Reopened at", esc(r.at)], ["Reason", esc(r.reason)]]);
      });
      h += "</div>";
    }
    h += "</section>";
    return h;
  }

  function renderTicket() {
    var t = state.ticket, blocked = isOpen(t) && (needsOwner(t) || t.nextActionOwner === "Proovd");
    var h = '<div class="wrap"><div class="nav-context">';
    h += '<span class="mono">' + esc(initials(t.requester.name)) + "</span>";
    h += '<span class="id-block"><strong>' + esc(t.id) + '</strong><span class="sub">' + esc(t.requester.name) + " · " + esc(t.requester.type) + "</span></span>";
    h += '<span class="spacer"></span><button class="tertiary" data-act="back">← All tickets</button>';
    h += "</div>";

    h += '<header class="idband ' + (blocked ? "blocked" : (!isOpen(t) ? "done" : "")) + '">';
    h += '<div class="idl"><div class="row1"><h2>' + esc(t.subject) + "</h2>";
    h += '<span class="chip ' + statusClass(t.status) + '">' + esc(t.status) + "</span></div>";
    h += '<div class="meta">' + esc(t.requester.name) + " · " + esc(t.requester.type) +
      (t.related.campaign ? " · " + esc(t.related.campaign) : "") + " · opened " + esc(t.createdAt) + "</div>";
    if (isOpen(t)) {
      h += '<p class="blocker"><i></i>' + esc(t.nextAction) + (t.nextUpdateDue ? " · customer update due " + esc(t.nextUpdateDue) : "") + "</p>";
    } else {
      h += '<p class="calm">' + esc(t.status === "Closed" ? "Closed " + t.closedAt + ". The full conversation and resolution stay on the record." : "Resolved " + t.resolvedAt + " by " + t.resolvedBy + ".") + "</p>";
    }
    h += "</div>";
    h += '<div class="idr"><span class="pri ' + t.priority.toLowerCase() + '"><i></i>' + esc(t.priority) + " priority</span></div>";
    h += "</header>";

    var tabs = ["Conversation", "Case & ownership", "Evidence & contact", "History"];
    h += '<nav class="tabs">';
    tabs.forEach(function (x) {
      var n = x === "Evidence & contact" ? (t.evidence.length + t.contacts.length) : 0;
      h += '<button data-act="tab" data-v="' + esc(x) + '" class="' + (state.tab === x ? "active" : "") + '">' + esc(x) +
        (n ? ' <span class="count">' + n + "</span>" : "") + "</button>";
    });
    h += "</nav>";

    h += '<div class="page">';
    if (state.tab === "Conversation") h += '<div class="split"><div>' + threadView(t) + "</div>" + '<div class="rightcol">' + ctxPanel(t) + "</div></div>";
    else if (state.tab === "Case & ownership") h += caseView(t);
    else if (state.tab === "Evidence & contact") h += evidenceView(t);
    else h += historyView(t);
    h += "</div></div>";
    return h;
  }

  /* ============================ modals ============================ */
  function field(label, inner, opt) {
    return "<label>" + esc(label) + (opt ? ' <span class="opt">optional</span>' : "") + inner + "</label>";

  function sel(id, opts, cur) {
    var h = '<select id="' + id + '">';
    opts.forEach(function (o) { h += '<option' + (o === cur ? " selected" : "") + ">" + esc(o) + "</option>"; });
    return h + "</select>";
  }

          var due = document.getElementById("due").value.trim();
          t.thread.push({ kind: "out", from: ME, to: t.requester.name, at: "Now · Aug 13, 2026", body: msg, attachments: att ? [att] : [], delivery: "Sent" });
          t.lastResponse = "Now · Aug 13, 2026 · " + ME;
          if (due) t.nextUpdateDue = due;
          t.timeline.push({ at: "Now · Aug 13, 2026", what: "<b>Reply sent</b> to " + esc(t.requester.name) });
          return null;
        }
      };
    },

        consequence: "The evidence is recorded with its type, source record, and who added it.",
        body: function () {

          h += field("Description", '<textarea id="ed" placeholder="What this evidence shows."></textarea>');
          h += field("Related record", '<input id="er" placeholder="e.g. Transaction TX-3391, Post SP-1188">', true);

        }

    assign: function (t) {

        title: t.owner ? "Reassign this ticket" : "Assign an owner",
        lede: "Every ticket that needs human action needs one named owner.",

        body: function () {
          var h = field("New owner", sel("ow", ADMINS.concat([ME]), t.owner || ME));

          if (t.status === "New") t.status = "Open";

            t.nextAction = n + " must review the request and send the first response";

        }

    status: function (t) {
      return {

        body: function () {
          var h = field("Status", sel("st", STATUSES.filter(function (s) { return s !== "Resolved" && s !== "Closed"; }), t.status));
          h += field("What that party owes", '<textarea id="na" placeholder="e.g. Ahmed Teeb must confirm delivery access for Priya’s Pro tier pre-order">' + esc(t.nextAction || "") + "</textarea>");

        }

    classify: function (t) {

    priority: function (t) {

            var w = e.what.toLowerCase();

            if (hit) { any = true; h += '<div class="tl"><time>' + esc(e.at) + '</time><div class="what">' + e.what + "</div></div>"; }
          });
          if (!any) h += '<div class="tl"><div class="what">Nothing has been recorded for this section yet.</div></div>';
          return h + "</div>";
        }
      };
    },
    link: function (t, target) {
      return {
        title: target, lede: "This record lives in its own workspace. The Support ticket links to it rather than duplicating its controls.",
        consequence: null, readonly: true,
        body: function () {
          return rows([["Record", esc(target)], ["Reached from", esc(t.id) + " · " + esc(t.subject)],
          ["Why it is linked", "The ticket needs this record's current state as context. Operational controls stay on the record itself."]]);
        }
      };
    }
  };

  function renderModal() {
    var m = state.modal;
    if (!m) return "";
    var h = '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">';
    h += "<h3>" + esc(m.title) + "</h3>";
    if (m.lede) h += '<p class="lede">' + esc(m.lede) + "</p>";
    if (m.consequence) h += '<div class="consequence">' + esc(m.consequence) + "</div>";
    if (state.err) h += '<div class="consequence" style="border-left-color:var(--deep);background:var(--yellow)">' + esc(state.err) + "</div>";
    h += m.body();
    h += '<div class="modal-foot">';
    if (!m.readonly) h += '<button class="primary" data-act="confirm">' + esc(m.confirm) + "</button>";
    h += '<button class="tertiary" data-act="cancel">' + (m.readonly ? "Close" : "Back") + "</button>";
    h += "</div></div></div>";
    return h;
  }

  /* ============================ render ============================ */
  function render() {
    var h = '<div class="app">';
    h += '<header class="topbar"><span class="wordmark">proovd.</span>' +
      '<span class="who">Support · Admin<span class="avatar">' + esc(initials(ME)) + "</span></span></header>";
    h += state.view === "queue" ? renderQueue() : renderTicket();
    h += "</div>";
    h += renderModal();
    root.innerHTML = h;
    var q = document.getElementById("q");
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    var tpl = document.getElementById("tpl");
    if (tpl) tpl.addEventListener("change", function () {
      var k = tpl.value === "Write from scratch" ? "" : tpl.value;
      var box = document.getElementById("msg");
      if (k && TEMPLATES[k]) box.value = TEMPLATES[k].replace(/\{name\}/g, state.ticket.requester.name.split(" ")[0]);
      box.focus();
    });
  }

  /* ============================ events ============================ */
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { state.q = e.target.value; render(); }
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (act === "scrim" && e.target !== el) return;

    if (act === "open") { state.ticket = get(el.getAttribute("data-id")); state.view = "ticket"; state.tab = "Conversation"; }
    else if (act === "back") { state.view = "queue"; state.ticket = null; }
    else if (act === "tab") state.tab = v;
    else if (act === "filter") state.filter = v;
    else if (act === "cancel" || act === "scrim") { state.modal = null; state.err = null; }
    else if (act === "confirm") {
      var err = state.modal.run();
      state.err = err;
      if (!err) state.modal = null;
    }
    else if (act === "assign-me") {
      var t = state.ticket;
      if (t.owner) t.previousOwner = t.owner;
      t.owner = ME; t.assignedAt = "Now · Aug 13, 2026"; t.assignReason = null;
      if (t.status === "New") t.status = "Open";
      if (t.nextAction && t.nextAction.indexOf("no owner") >= 0) t.nextAction = ME + " must review the request and send the first response";
      t.timeline.push({ at: "Now · Aug 13, 2026", what: "<b>Owner set to " + esc(ME) + "</b>" });
    }
    else if (MODALS[act]) {
      state.err = null;
      state.modal = act === "create" ? MODALS.create() : MODALS[act](state.ticket, v);
    }
    else return;
    render();
  });

  render();
})();

  </script>
</body>
</html>
