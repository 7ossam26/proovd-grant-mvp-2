:root {
  --brand: #41ed98;
  --canvas: #fafafa;
  --forest: #013f17;
  --dark: #013f17;
  --night: #012d10;
  --light: #e9ffe1;
  --grey: #a2afa8;
  --yellow: #f7ff9e;
  --ink: #012d10;
  --muted: #669370;
  --dark-line: rgba(233, 255, 225, 0.35);
  --green-5: rgba(65, 237, 152, 0.05);
  --green-15: rgba(65, 237, 152, 0.15);
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
  background: #fafafa;
  color: var(--ink);
  font-family: Satoshi, sans-serif;
  font-weight: 400;
}
body {
  overflow-x: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
select,
label:has(input[type="checkbox"]),
.founder-row {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}
::selection {
  background: rgba(65, 237, 152, 0.15);
}

.app-shell {
  min-height: 100vh;
  background: var(--canvas);
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 14.5rem;
  background: var(--night);
  color: var(--light);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  border: 0;
  background: transparent;
  color: var(--light);
  font-size: 1.4rem;
  font-weight: 700;
  min-height: 3rem;
  padding: 0;
  text-align: left;
}
.brand-mark {
  position: relative;
  display: inline-grid;
  width: 2.35rem;
  height: 2.35rem;
  border: 2px solid var(--light);
  place-items: center;
  flex: 0 0 auto;
}
.brand-mark i,
.brand-mark b {
  position: absolute;
  width: 0.72rem;
  height: 1.55rem;
  background: var(--light);
  display: block;
}
.brand-mark i {
  transform: translateX(-0.42rem);
}
.brand-mark b {
  transform: translateX(0.42rem) rotate(180deg);
}
.sidebar nav {
  display: grid;
  gap: 0.6rem;
  margin-top: 4.5rem;
}
.sidebar nav > span {

.public-hero {

.public-art strong {

}
.public-progress {

    width: 5rem;
    padding: 1rem 0.7rem;
    align-items: center;
  }

  .sidebar nav > span,
  .sidebar nav button > span,
  .sidebar nav button > em,
  .sidebar footer {

    margin-top: 3rem;
  }
  .workspace {
    margin-left: 0;
  }
  .directory-hero {
    grid-template-columns: 1fr;
  }
  .directory-next {
    grid-template-columns: 1fr;
  }
  .queue-strip {
    grid-template-columns: 1fr;
  }
  .queue-strip button:nth-child(2) {
    border-right: 0;

  .queue-strip button:nth-child(-n + 2) {
    border-bottom: 1px solid var(--brand);
  }
  .directory-tools {
    grid-template-columns: 1fr;
  }
  .search-field {
    grid-column: 1/-1;
  }
  .founder-table-head {
    display: none;
  }
  .founder-row {
    grid-template-columns: 1fr 1fr;
  }
  .founder-row > span:nth-child(3),
  .founder-row > span:nth-child(4),
  .founder-row > span:nth-child(5) {
    display: none;
  }
  .record-header {
    position: sticky;
    top: 0;
  }
  .record-identity {
    grid-template-columns: auto 1fr;
  }
  .record-actions {
    grid-column: 1/-1;
  }
  .signal-strip {
    grid-template-columns: 1fr;
  }
  .signal-strip > div {
    border-bottom: 1px solid var(--brand);
  }
  .signal-strip > div:first-child {
    border-left: 0;
  }
  .moment-grid {
    grid-template-columns: 1fr;
  }
  .editable-section dl {

/* Restored workspace format: compact directory, record, and complete form. */
.directory,
.legacy-create {
  max-width: 92rem;
  padding: 3rem clamp(1.75rem, 3.4vw, 3.75rem) 7rem;
}
.legacy-page-title {
  display: flex;

  justify-content: space-between;
  gap: 2.5rem;
  margin-bottom: 3rem;
}
.legacy-page-title > div:first-child {
  min-width: 0;
}
.legacy-page-title > div > span {
  color: var(--forest);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.legacy-page-title h1,
.legacy-create > header h1 {
  max-width: none;
  margin: 0.35rem 0 0.55rem;
  font-size: clamp(2.25rem, 4vw, 3.6rem);
  line-height: 0.96;
  letter-spacing: -0.045em;
  font-weight: 500;
}
.legacy-page-title p {
  max-width: 50rem;
  margin: 0;
  color: var(--muted);
  line-height: 1.5;
}
.legacy-queues {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  margin-bottom: 2.25rem;
}
.legacy-queues button {
  min-height: 6.25rem;
  padding: 1.1rem 1.15rem;
  gap: 0.2rem;
}
.legacy-queues button.active {
  border-bottom: 0.24rem solid var(--brand);
}
.legacy-queues strong {
  font-size: 1.7rem;
}
.legacy-queues small {
  line-height: 1.25;
}
.legacy-toolbar {
  grid-template-columns: minmax(18rem, 1fr) 11rem 12rem auto;
  align-items: end;
  gap: 1.25rem;
  margin-bottom: 2rem;
}
.shown-count {
  min-height: 2.75rem;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  color: var(--muted);
  font-size: 0.75rem;
  white-space: nowrap;
}
.founder-row {
  min-height: 5.4rem;
  padding: 1.1rem 1rem;
  gap: 1.6rem;
}
.founder-table-head {
  padding: 1rem 1rem 0.85rem;
  gap: 1.6rem;
}

.record-header {
  padding: 1.15rem clamp(1.5rem, 3.2vw, 3.5rem) 0;
}
.record-identity {

  line-height: 1.6;
}
.record-name > div {
  margin-top: 0.85rem;
  gap: 0.65rem;
}
.record-header {
  position: static;
}
.record-context {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 2.5rem;
  max-width: none;
  margin: 0;
  padding: 0 0 1.35rem;

}
.record-context > div {

}
.record-context span {

  letter-spacing: 0.09em;
  font-weight: 700;

.record-context p {
  margin: 0;

  .legacy-page-title > .dna-button,
  .create-header-actions,
  .create-header-actions .dna-button {
    width: 100%;
  }
  .legacy-queues {
    grid-template-columns: 1fr;
  }
  .legacy-queues button:nth-child(n) {
    min-height: 4.8rem;
    border-right: 0;
    border-bottom: 1px solid var(--brand);
  }
  .legacy-queues button:last-child {
    border-bottom: 0;
  }
  .legacy-toolbar {
    grid-template-columns: 1fr;
  }
  .legacy-toolbar .search-field,
  .legacy-toolbar .shown-count {
    grid-column: auto;
  }
  .record-identity {
    grid-template-columns: 3.5rem minmax(0, 1fr);
  }
  .record-actions {
    grid-column: 1 / -1;
  }
  .signal-strip {
    grid-template-columns: 1fr;
  }
  .signal-strip > div:nth-child(n) {
    border-right: 0;
  }
  .legacy-form-section > header {
    grid-template-columns: 1fr;
  }
  .legacy-form-section .flow-fields {
    padding: 1rem;
  }
  .legacy-form-footer {
    display: grid;
    grid-template-columns: 1fr;
  }
  .legacy-form-footer > span {
    margin: 0;
  }
  .editable-section dl > div {
    grid-template-columns: 1fr;
    gap: 0.45rem;
    padding: 1.15rem 0;
  }
  .editable-section dd {
    font-size: 1.05rem;
  }
  .inline-edit {
    align-items: flex-start;
  }
}

@media (min-width: 600px) and (max-width: 899px) {
  .editable-section dl > div {
    grid-template-columns: minmax(9rem, 0.32fr) minmax(0, 1fr);
    gap: 1.25rem;
  }
}

/* Affiliates: roster rail + selected-relationship detail. */
.aff-split {
  display: grid;
  grid-template-columns: 23rem minmax(0, 1fr);
  gap: 2.25rem;
  align-items: start;
}
.aff-rail {
  display: grid;
  gap: 1rem;
  align-content: start;
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 3rem);
  overflow: auto;
  padding-right: 0.35rem;
}
.rail-card {
  display: grid;
  gap: 0.5rem;
  text-align: left;
  padding: 1.2rem 1.3rem;
  background: #ffffff;
  border: 2px solid var(--brand);
  border-left-width: 0.4rem;
  border-left-color: transparent;
  border-radius: 1px;
  min-height: 0;
}
.rail-card.selected {
  border-left-color: var(--brand);
  background: var(--green-5);
}
.rail-card > header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem;
}
.rail-card strong {
  font-size: 1.05rem;
  overflow-wrap: anywhere;
}
.rail-card small {
  color: var(--muted);
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}
.rail-card > header > b {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--forest);
  text-align: right;
  flex: 0 0 auto;
  max-width: 8rem;
}
.rail-card p {
  margin: 0;
  font-size: 0.88rem;
  line-height: 1.45;
}
.rail-terms {
  font-weight: 700;
}
.rail-blocker {
  background: var(--yellow);
  color: var(--night);
  padding: 0.55rem 0.65rem;
  font-weight: 700;
  border-radius: 1px;
}
.rail-divider {
  margin: 0.75rem 0 0;
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-weight: 700;
  color: var(--muted);
}
.aff-detail {
  display: grid;
  gap: 2rem;
  min-width: 0;
}
.aff-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1.5rem;
  padding-bottom: 1.35rem;
  border-bottom: 2px solid var(--brand);
}
.aff-detail-head h3 {
  margin: 0 0 0.35rem;
  font-size: 1.65rem;
}
.aff-detail-head p {
  margin: 0;
  color: var(--muted);
}
@media (max-width: 1100px) {
  .aff-split {
    grid-template-columns: 1fr;
  }
  .aff-rail {
    position: static;
    max-height: none;
    grid-auto-flow: column;
    grid-auto-columns: minmax(17rem, 1fr);
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }
}

/* Negotiation thread, entry logs, and repeatable fields. */
.nego-status {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 14rem);
  gap: 2rem;
  align-items: start;
  padding: 1.25rem 1.4rem;
  border: 2px solid var(--brand);
  background: var(--green-5);
  margin-bottom: 1.5rem;
}
.nego-status span {
  display: block;
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-weight: 700;
  color: var(--forest);
  margin-bottom: 0.35rem;
}
.nego-status strong {
  font-size: 1.05rem;
  line-height: 1.35;
  display: block;
}
.nego-status small {
  display: block;
  color: var(--muted);
  margin-top: 0.35rem;
  line-height: 1.55;
}
.nego-thread {
  display: grid;
  border-top: 1px solid var(--brand);
}
.entry-log {
  display: grid;
  border-top: 1px solid var(--brand);
  margin-top: 0.5rem;
}
.entry-log article {
  padding: 1rem 0.35rem;
  border-bottom: 1px solid var(--brand);
}
.entry-log span {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--forest);
}
.entry-log h4 {
  margin: 0.3rem 0 0.2rem;
  font-size: 1rem;
}
.entry-log p {
  margin: 0.2rem 0;
  color: var(--muted);
  line-height: 1.55;
  font-size: 0.92rem;
}
.entry-log .empty {
  padding: 1rem 0.35rem;
  color: var(--muted);
}
@media (max-width: 899px) {
  .nego-status {
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }
}

/* ===== CRAFT PASS =====================================================
   2A global (shared M) - 2B dense group - 2C detail column
   2D version thread - 2E rail + responsive
   ===================================================================== */

/* --- 2A. Shared M ---------------------------------------------------- */
.editable-section h3 {
  text-wrap: balance;
  overflow-wrap: anywhere;
  line-height: 1.2;
}
.editable-section > header p {
  text-wrap: pretty;
}

/* the new home of every action */
.editable-section > .section-foot {
  display: grid;
  justify-items: start;
  gap: 0.9rem;
  margin-top: 1.6rem;
  padding-top: 1.4rem;
  border-top: 1px solid var(--brand);
}
.editable-section:not(:has(dl > div)) > .section-foot {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}
.editable-section.dark > .section-foot {
  border-top-color: var(--dark-line);
}

/* tertiary must look clickable without hover */
.section-foot .dna-button.tertiary {
  padding-inline: 0.9rem;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 0.3em;
  text-decoration-color: #9dbfa8;
  text-decoration-color: color-mix(in srgb, var(--forest) 42%, #ffffff);
}
.section-foot .dna-button.tertiary:hover {
  text-decoration-color: var(--forest);
}
.editable-section.dark .section-foot .dna-button.tertiary {
  color: var(--brand);
  text-decoration-color: rgba(65, 237, 152, 0.55);
}

/* the third weight: a bordered chip that is never dimmed */
.dna-button.quiet {
  min-height: 2.25rem;
  padding: 0.46rem 0.8rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--forest);
  background: #ffffff;
  border: 1px solid #bfcfc5;
  border-color: color-mix(in srgb, var(--forest) 25%, #ffffff);
  border-radius: 1px;
  letter-spacing: 0.005em;
  text-decoration: none;
}
.dna-button.quiet:hover {
  background: var(--canvas);
  border-color: var(--forest);
}
.dna-button.quiet.danger-text {
  color: var(--night);
  border-color: var(--night);
  border-style: dashed;
}
.dna-button.quiet.danger-text:hover {
  background: var(--night);
  color: var(--canvas);
  border-style: solid;
}
.editable-section.dark .dna-button.quiet {
  color: var(--canvas);
  background: transparent;
  border-color: rgba(65, 237, 152, 0.55);
}

@media (max-width: 60rem) {
  .editable-section > .section-foot {
    margin-top: 1.15rem;
    padding-top: 1rem;
  }
}
@media (max-width: 48rem) {
  .dna-button.quiet {
    min-height: 2.5rem;
    font-size: 0.88rem;
  }
}

/* Action band: the last card type still mounting its actions on the right.
   Same rule as .section-foot - actions sit below the copy they act on. */
.action-band {
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
  row-gap: 0;
}
.action-band > div:last-child {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  gap: 0.65rem;
  margin-top: 1.6rem;
  padding-top: 1.4rem;
  border-top: 1px solid var(--brand);
}
@media (max-width: 60rem) {
  .action-band > div:last-child {
    margin-top: 1.15rem;
    padding-top: 1rem;
  }
}

/* --- 2B. The dense action group (Terms) ------------------------------ */
.section-actions--dense {
  gap: 0.7rem 0.75rem;
  min-width: 0;
}
.section-actions--dense .dna-button {
  white-space: nowrap;
  flex: 0 0 auto;
}
.section-actions--dense .actions-decide,
.section-actions--dense .actions-record {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  min-width: 0;
}
.section-actions--dense .actions-decide {
  gap: 0.75rem;
}
.section-actions--dense .actions-record {
  gap: 0.5rem;
  flex: 1 1 100%;
}
.section-actions--dense .actions-break {
  flex: 1 0 100%;
  height: 0;
  margin: 0;
  padding: 0;
}
.section-actions--dense .actions-escape {
  margin-left: auto;
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  padding-left: 1.5rem;
}
.section-actions--dense > .actions-escape:first-child {
  margin-left: 0;
  padding-left: 0;
}
.section-actions--dense .actions-escape .dna-button {
  min-height: 2.25rem;
  padding-inline: 0;
  font-size: 0.9rem;
}
.section-actions--dense .actions-escape .dna-button::after {
  content: "\2192";
  margin-left: 0.45rem;
  font-weight: 700;
  text-decoration: none;
  display: inline-block;
}
.section-actions--dense .actions-rule {
  flex: 0 0 auto;
  width: 1px;
  height: 1.5rem;
  margin-inline: 0.5rem;
  background: #bfcfc5;
  background: color-mix(in srgb, var(--forest) 25%, #ffffff);
}
.section-actions--dense .dna-button:focus-visible {
  outline: 2px solid var(--night);
  outline-offset: 2px;
}

@media (max-width: 48rem) {
  .section-actions--dense .actions-decide {
    flex: 1 1 100%;
  }
  .section-actions--dense .actions-decide .dna-button {
    flex: 1 1 auto;
  }
  .section-actions--dense .actions-escape {
    margin-left: 0;
    padding-left: 0;
    flex: 1 1 100%;
  }
  .section-actions--dense .actions-rule {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .section-actions--dense .dna-button {
    transition: none;
  }
}

/* --- 2C. Detail column ----------------------------------------------- */
.aff-split {
  display: grid;
  grid-template-columns: minmax(19rem, 21rem) minmax(0, 1fr);
  gap: 2rem;
  align-items: start;
}
.aff-detail {
  display: grid;
  gap: 1.15rem;
  min-width: 0;
}
.aff-detail > .editable-section.needs-action {
  margin-block-end: 1.1rem;
}
.aff-detail .editable-section dl > div {
  grid-template-columns: minmax(9.5rem, 0.3fr) minmax(0, 1fr);
  gap: 1.5rem;
}
.aff-detail .editable-section dt {
  overflow-wrap: normal;
  hyphens: none;
}

/* quiet by default */
.aff-detail > .editable-section {
  border-width: 1px;
  border-color: #a9f2cb;
  border-color: color-mix(in srgb, var(--brand) 45%, #ffffff);
  padding: 1.75rem;
}
.aff-detail > .editable-section > header {
  margin-bottom: 1.35rem;
  column-gap: 1.25rem;
}
.aff-detail > .editable-section h3 {
  font-size: 1.15rem;
  line-height: 1.3;
  letter-spacing: -0.005em;
}
.aff-detail > .editable-section > header p {
  font-size: 0.92rem;
}
.aff-detail > .editable-section dl > div {
  padding: 1.05rem 0;
  border-top-color: #c8f6de;
  border-top-color: color-mix(in srgb, var(--brand) 32%, #ffffff);
}
.aff-detail > .editable-section dt {
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 0.045em;
}
.aff-detail > .editable-section dd {
  font-size: 1rem;
}
.aff-detail > .editable-section > .section-foot {
  margin-top: 1.25rem;
  padding-top: 1.1rem;
  border-top-color: color-mix(in srgb, var(--brand) 45%, #ffffff);
}

/* the one card that needs the operator */
.aff-detail > .editable-section.needs-action {
  border-width: 2px;
  border-color: var(--brand);
  border-left-width: 0.4rem;
  border-left-color: var(--night);
  padding: 2.35rem 2.35rem 2.35rem 2.05rem;
}
.aff-detail > .editable-section.needs-action > header {
  margin-bottom: 2.1rem;
}
.aff-detail > .editable-section.needs-action h3 {
  font-size: 1.5rem;
}
.aff-detail > .editable-section.needs-action > header p {
  font-size: 1rem;
}
.aff-detail > .editable-section.needs-action dl > div {
  padding: 1.5rem 0;
  border-top-color: var(--brand);
}
.aff-detail > .editable-section.needs-action dt {
  font-size: 0.85rem;
  color: var(--forest);
  letter-spacing: 0.05em;
}
.aff-detail > .editable-section.needs-action dd {
  font-size: 1.15rem;
}
.aff-detail > .editable-section.needs-action > .section-foot {
  margin-top: 1.9rem;
  padding-top: 1.5rem;
  border-top-color: var(--brand);
}

/* sticky identity header */
.aff-detail-head {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--canvas);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem 1.5rem;
  padding: 1.1rem 0.9rem 1.15rem;
  margin-inline: -0.9rem;
  border-bottom: 2px solid var(--brand);
  box-shadow: 0 0.7rem 0.7rem -0.7rem rgba(1, 45, 16, 0.09);
}
.aff-detail-head.blocked {
  border-bottom-color: var(--night);
}
.aff-detail-head.ended {
  border-bottom-color: var(--muted);
}
.aff-detail-id {
  min-width: 0;
  flex: 1 1 22rem;
}
.aff-detail-title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.3rem 0.7rem;
  margin-bottom: 0.3rem;
}
.aff-detail-head h3 {
  margin: 0;
  font-size: 1.65rem;
  line-height: 1.15;
}
.aff-detail-head p {
  margin: 0;
  color: var(--muted);
}
.aff-state-chip {
  flex: 0 0 auto;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
  padding: 0.3rem 0.55rem;
  border: 2px solid var(--brand);
  border-radius: 1px;
  background: #ffffff;
  color: var(--forest);
}
.aff-state-chip.blocked {
  background: var(--yellow);
  border-color: var(--night);
  color: var(--night);
}
.aff-state-chip.ended {
  background: #ffffff;
  border-color: var(--muted);
  color: var(--muted);
}
.aff-head-blocker {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  margin: 0.6rem 0 0;
  font-size: 0.95rem;
  line-height: 1.45;
  font-weight: 700;
  color: var(--night);
}
.aff-head-blocker i {
  flex: 0 0 auto;
  width: 0.55rem;
  height: 0.55rem;
  margin-top: 0.42rem;
  border-radius: 1px;
  background: var(--night);
}

/* mobile: keep the slab, drop the bulk, and restore the row collapse that
   the .aff-detail-scoped dl rule (0,3,1) would otherwise out-specify. */
@media (max-width: 720px) {
  .aff-detail > .editable-section.needs-action {
    padding: 1.25rem 1.25rem 1.25rem 0.95rem;
  }
  .aff-detail .editable-section dl > div {
    grid-template-columns: 1fr;
    gap: 0.45rem;
    padding: 1.15rem 0;
  }
}

/* --- 2D. Version thread ---------------------------------------------- */
.nego-thread {
  --nego-rule: rgba(1, 63, 23, 0.14);
  --nego-past: #4d7359;
  --nego-empty: #d7e3da;
  display: block;
  margin: 1.75rem -1rem 0;
  padding-top: 1.5rem;
  border-top: 2px solid var(--brand);
}
.nego-thread > h4 {
  margin: 0 0 0.4rem;
  padding: 0 1rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
.nego-rows {
  display: grid;
}
.nego-thread article {
  display: grid;
  grid-template-columns: 2.75rem 5rem minmax(0, 1fr) 9.5rem;
  grid-template-areas: "ver pct body status";
  column-gap: 1.25rem;
  row-gap: 0.55rem;
  align-items: start;
  padding: 1.15rem 1rem;
  border-top: 1px solid var(--nego-rule);
  background-color: #ffffff;
}
.nego-thread article:first-child {
  border-top: 0;
}
.nego-thread article > b {
  grid-area: ver;
}
.nego-thread article > .nego-pct {
  grid-area: pct;
}
.nego-thread article > div {
  grid-area: body;
}
.nego-thread article > em {
  grid-area: status;
  justify-self: end;
}
.nego-thread article > .nego-pct {
  font-size: 1.45rem;
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--night);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums lining;
  font-feature-settings: "tnum" 1;
}
.nego-thread article > b {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.2;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  padding-top: 0.5rem;
}
.nego-thread article > div > strong {
  display: block;
  font-size: 0.95rem;
  font-weight: 700;
  line-height: 1.35;
  color: var(--forest);
  padding-top: 0.28rem;
}
.nego-thread .nego-at {
  margin-left: 0.5rem;
  font-weight: 400;
  font-size: 0.82rem;
  color: var(--nego-past);
  font-variant-numeric: tabular-nums;
}
.nego-thread article > div > small {
  display: block;
  margin-top: 0.3rem;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--nego-past);
  max-width: 46ch;
}
.nego-thread article.current {
  background-color: var(--green-5, #f2fcf6);
  box-shadow: inset 0.3rem 0 0 var(--brand);
}
.nego-thread article.current > b {
  color: var(--forest);
}
.nego-thread article.current > .nego-pct {
  color: var(--night);
}
.nego-accept {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 13rem));
  gap: 0.45rem;
  margin-top: 0.7rem;
}
.nego-stamp {
  display: grid;
  grid-template-columns: 0.95rem minmax(0, 1fr);
  column-gap: 0.4rem;
  align-items: start;
  padding: 0.4rem 0.55rem;
  border-radius: 1px;
  border-left: 3px solid var(--nego-empty);
  background: #ffffff;
}
.nego-stamp.yes {
  border-left-color: var(--brand);
  background: var(--green-5, #f2fcf6);
}
.nego-stamp > i {
  display: block;
  grid-row: 1 / span 2;
  width: 0.95rem;
  height: 0.95rem;
  margin-top: 0.14rem;
  border: 1.5px solid var(--nego-empty);
  border-radius: 50%;
  position: relative;
}
.nego-stamp.yes > i {
  border-color: var(--brand);
  background: var(--brand);
}
.nego-stamp.yes > i::after {
  content: "";
  position: absolute;
  left: 0.3rem;
  top: 0.12rem;
  width: 0.18rem;
  height: 0.4rem;
  border: solid var(--night);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg);
}
.nego-stamp .who {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.3;
  color: var(--forest);
}
.nego-stamp .when {
  font-size: 0.8rem;
  line-height: 1.35;
  color: var(--nego-past);
  font-variant-numeric: tabular-nums;
}

/* dead rows: demote by SIZE, never by opacity (opacity fails AA here) */
.nego-thread article.superseded,
.nego-thread article.declined {
  padding-block: 0.9rem;
}
.nego-thread article.superseded > .nego-pct,
.nego-thread article.declined > .nego-pct {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--nego-past);
}
.nego-thread article.superseded > div > strong,
.nego-thread article.declined > div > strong {
  font-size: 0.88rem;
  color: var(--nego-past);
}
.nego-thread article.superseded > div > small,
.nego-thread article.declined > div > small {
  font-size: 0.82rem;
  color: var(--nego-past);
}
.nego-thread article.superseded .nego-accept,
.nego-thread article.declined .nego-accept {
  display: flex;
  flex-wrap: wrap;
  column-gap: 1.4rem;
  row-gap: 0.2rem;
  margin-top: 0.35rem;
}
.nego-thread article.superseded .nego-stamp,
.nego-thread article.declined .nego-stamp {
  display: inline;
  padding: 0;
  border-left: 0;
  background: transparent;
}
.nego-thread article.superseded .nego-stamp > i,
.nego-thread article.declined .nego-stamp > i {
  display: none;
}
.nego-thread article.superseded .nego-stamp .who,
.nego-thread article.declined .nego-stamp .who {
  font-size: 0.7rem;
  color: var(--nego-past);
}
.nego-thread article.superseded .nego-stamp .when,
.nego-thread article.declined .nego-stamp .when {
  font-size: 0.78rem;
  color: var(--nego-past);
}
.nego-thread article.superseded .nego-stamp .who::after,
.nego-thread article.declined .nego-stamp .who::after {
  content: " ";
}

/* status chip - four states, no red needed */
.nego-thread article > em {
  font-style: normal;
  display: inline-flex;
  align-items: center;
  min-height: 1.5rem;
  margin-top: 0.35rem;
  padding: 0.22rem 0.55rem;
  border: 1px solid transparent;
  border-radius: 1px;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1.25;
  white-space: normal;
  text-align: right;
  color: var(--forest);
  cursor: default;
}
.nego-thread article.current > em {
  background: var(--brand);
  color: var(--night);
  border-color: var(--brand);
}
.nego-thread article.locked > em {
  background: #ffffff;
  color: var(--forest);
  border-color: var(--brand);
}
.nego-thread article.superseded > em {
  background: transparent;
  border-color: transparent;
  color: var(--nego-past);
}
.nego-thread article.declined > em {
  background: #ffffff;
  color: var(--nego-past);
  border-color: var(--muted);
}
.nego-thread article.declined > .nego-pct {
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
  text-decoration-color: var(--muted);
}

@media (max-width: 60rem) {
  .nego-thread article {
    grid-template-columns: 2.75rem 5rem minmax(0, 1fr);
    grid-template-areas:
      "ver pct status"
      "body body body";
  }
}

/* --- 2E. Rail + responsive ------------------------------------------- */
.aff-rail {
  display: grid;
  gap: 0.85rem;
  align-content: start;
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
  overflow-x: visible;
  padding-right: 0.5rem;
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: var(--brand) transparent;
}
.rail-card {
  position: relative;
  display: grid;
  gap: 0.45rem;
  text-align: left;
  padding: 1rem 1.15rem 1.05rem;
  background: #ffffff;
  border: 2px solid var(--brand);
  border-left-width: 0.4rem;
  border-left-color: var(--brand);
  border-radius: 1px;
  min-width: 0;
  cursor: pointer;
}
.rail-card.selected {
  background: var(--green-5);
  border-color: var(--forest);
  border-left-width: 0.4rem;
  box-shadow: inset 0 0 0 1px var(--forest);
}
.rail-card.selected::after {
  content: "";
  position: absolute;
  right: -2px;
  top: 1.05rem;
  width: 0.7rem;
  height: 0.7rem;
  background: var(--forest);
  transform: translateX(50%) rotate(45deg);
}
.rail-card:focus-visible {
  outline: 3px solid var(--night);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: no-preference) {
  .rail-card {
    transition: background-color 140ms ease, border-color 140ms ease;
  }
}
.rail-card > header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 0.5rem 0.7rem;
}
.rail-card strong {
  display: block;
  min-width: 0;
  font-size: 1.02rem;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rail-card > small {
  display: block;
  min-width: 0;
  margin-top: -0.15rem;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rail-card > header > b {
  justify-self: end;
  max-width: 7.5rem;
  font-size: 0.66rem;
  font-weight: 700;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.055em;
  text-align: right;
  overflow-wrap: normal;
  hyphens: none;
}
.rail-card > header > b.st-quiet {
  color: var(--muted);
}
.rail-card > header > b.st-turn {
  color: var(--forest);
}
.rail-card > header > b.st-closed {
  color: var(--muted);
}
.rail-card p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}
.rail-card .rail-terms {
  font-weight: 700;
  color: var(--forest);
}
.rail-card .rail-signal {
  color: var(--muted);
}
.rail-card .rail-blocker {
  margin: 0.2rem 0 0;
  padding: 0.5rem 0.6rem;
  background: var(--yellow);
  color: var(--night);
  border-left: 3px solid var(--night);
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.rail-card.closed {
  background: var(--canvas);
  border-color: var(--muted);
  border-left-color: var(--muted);
}
.rail-card.closed strong,
.rail-card.closed .rail-terms,
.rail-card.closed .rail-signal {
  color: var(--muted);
}
.rail-card.closed.selected {
  background: #ffffff;
  border-color: var(--forest);
  box-shadow: inset 0 0 0 1px var(--forest);
}
.rail-divider {
  margin: 0.6rem 0 0.1rem;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 0.6rem;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.rail-divider::after {
  content: "";
  height: 1px;
  background: var(--brand);
}

/* horizontal strip - this breakpoint MUST equal the one where .aff-split
   collapses to 1fr, or you get a scroller inside a 21rem column. */
@media (max-width: 1100px) {
  /* MUST stay in the same block as the rail strip below - a two-column split
     with a horizontal rail gives you a scroller inside a 21rem column. */
  .aff-split {
    grid-template-columns: minmax(0, 1fr);
  }
  .aff-rail {
    position: static;
    max-height: none;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0.85rem;
    overflow-x: auto;
    overflow-y: visible;
    scroll-snap-type: x mandatory;
    scroll-padding-inline-start: 0.25rem;
    overscroll-behavior-x: contain;
    padding: 0 0 0.75rem;
    scrollbar-gutter: auto;
  }
  .aff-rail > .rail-card {
    flex: 0 0 clamp(15.5rem, 78vw, 20rem);
    scroll-snap-align: start;
    min-width: 0;
    padding: 0.9rem 1rem 0.95rem;
    gap: 0.35rem;
  }
  .aff-rail > .rail-card .rail-signal {
    font-size: 0.8rem;
  }
  .aff-rail > .rail-card.selected::after {
    right: auto;
    left: 50%;
    top: auto;
    bottom: -2px;
    transform: translate(-50%, 50%) rotate(45deg);
  }
  .aff-rail > .rail-divider {
    flex: 0 0 auto;
    align-self: stretch;
    margin: 0;
    display: grid;
    place-items: center;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    padding-inline-start: 0.6rem;
    border-inline-start: 1px solid var(--brand);
  }
  .aff-rail > .rail-divider::after {
    content: none;
  }
}
</style>
