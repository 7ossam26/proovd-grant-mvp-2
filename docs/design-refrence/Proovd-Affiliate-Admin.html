/* ===================================================================
   CRAFT PASS - applies the Founder Admin design standards here.
   Appended last, so every rule below wins on equal specificity.
   Mobile is re-declared at the end for anything that would clobber it.
   =================================================================== */

/* --- 1. Section actions move to the BOTTOM of the card ---------------
   The head is display:contents, so its children become flex items of the
   section itself; order then puts the title first and the buttons last,
   below the data they act on. No JSX change, no DOM reorder. */
.plain-section,
.profile-section {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.plain-section > *,
.profile-section > * {
  order: 1;
}
.plain-head,
.profile-section-head {
  display: contents;
}
.plain-head > *,
.profile-section-head > * {
  order: 1;
}
/* the title block leads */
.plain-head > :first-child,
.profile-section-head > :first-child {
  order: 0;
  margin-bottom: 28px;
}
/* every action container trails, and is fenced off from the data */
.plain-head > .provider-actions,
.plain-head > .link-actions,
.plain-head > .primary,
.plain-head > .secondary,
.plain-head > .tertiary,
.profile-section-head > .provider-actions,
.profile-section-head > .link-actions,
.profile-section-head > .primary,
.profile-section-head > .secondary,
.profile-section-head > .tertiary,
.plain-section > .context-actions,
.profile-section > .context-actions {
  order: 2;
  justify-content: flex-start;
  align-self: stretch;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--brand);
}
/* action containers are rows, left-aligned, wrapping */
.plain-head > .provider-actions,
.plain-head > .link-actions,
.profile-section-head > .provider-actions,
.profile-section-head > .link-actions,
.plain-section > .context-actions,
.profile-section > .context-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
/* a lone button as a direct head child must not stretch full width */
.plain-head > .primary,
.plain-head > .secondary,
.plain-head > .tertiary,
.profile-section-head > .primary,
.profile-section-head > .secondary,
.profile-section-head > .tertiary {
  width: fit-content;
  border-top: 1px solid var(--brand);
}

/* --- 2. Facts: one per line, never side by side --------------------- */
.fact-grid,
.money-grid {
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
}
.fact-grid > div,
.money-grid > div {
  grid-template-columns: minmax(190px, 250px) minmax(0, 1fr);
  gap: 36px;
  padding: 21px 0;
  align-items: baseline;
}
.fact-grid > .wide-fact {
  grid-column: auto;
  grid-template-columns: minmax(190px, 250px) minmax(0, 1fr);
}
.fact-grid > .wide-fact dd {
  justify-self: start;
  max-width: 68ch;
}

/* --- 3. Data reads bigger; labels stop shouting --------------------- */
.fact-grid dt,
.modal-facts dt,
.money-grid dt {
  font-size: 14px;
  font-weight: 750;
  letter-spacing: 0.01em;
  color: var(--muted);
}
.fact-grid dd,
.modal-facts dd,
.money-grid dd {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.55;
  text-align: left;
  max-width: 68ch;
}

/* --- 4. Calm the type ramp -----------------------------------------
   42px headings over 13px data was the "yelling" ratio. Headings come
   down, data goes up, so the gap closes from ~3.2x to ~1.6x. */
.profile-section-head h3,
.plain-head h3,
.provider-strip h3 {
  font-size: clamp(23px, 1.9vw, 29px);
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.controls-group h2 {
  font-size: clamp(30px, 3.2vw, 44px);
  letter-spacing: -0.04em;
  line-height: 1.02;
}

/* --- 5. Primary button contrast ------------------------------------
   --brand (#41ed98) behind --light (#e9ffe1) computes to ~1.3:1 and
   fails WCAG outright. --deep on --brand is ~9.8:1. */
.primary {
  color: var(--deep);
}
.primary:disabled {
  opacity: 1;
  color: var(--muted);
  background: var(--grey);
  border-color: var(--quiet);
  cursor: not-allowed;
}
.secondary {
  color: var(--green);
}

/* --- 6. Editable things look editable ------------------------------- */
.plain-head > .provider-actions .secondary::before,
.profile-section-head > .provider-actions .secondary::before,
.context-actions .secondary::before {
  content: "\270E";
  font-size: 15px;
  line-height: 1;
}

/* --- 7. Form labels are readable ------------------------------------ */
.correction-form label,
.modal-body label {
  font-size: 14px;
  gap: 10px;
}

/* --- 8. The shell uses the screen --------------------------------
   Every wrapper was width:min(1240px, 100% - 64px). On a 1920 screen
   that parked 680px of dead margin either side. */
.workspace-nav-context,
.workspace-tabs,
.workspace-subtabs,
.content-wrap,
.focused-wrap,
.campaign-shell,
.directory-page,
.record-wrap {
  width: min(2100px, 100% - 96px);
}

/* --- 9. Chrome type stops being 10px ------------------------------
   Tabs were 11px, sub-tabs 10px, the record name 14px. */
.workspace-tabs button {
  font-size: 15px;
  min-height: 64px;
  padding: 0 18px;
  gap: 8px;
}
.workspace-subtabs button {
  font-size: 14px;
  min-height: 52px;
  padding: 0 16px;
}
.workspace-nav-context {
  min-height: 74px;
  gap: 14px;
}
.workspace-nav-context strong {
  font-size: 20px;
  letter-spacing: -0.02em;
}
.workspace-nav-context > span:nth-child(2) > span,
.workspace-nav-context small {
  font-size: 14px;
}
.back-control {
  font-size: 15px;
}
.control-list button {
  min-height: 92px;
  gap: 22px;
}
.control-list strong,
.relationship-row strong {
  font-size: 19px;
  letter-spacing: -0.02em;
}
.control-list small,
.relationship-row small {
  font-size: 15px;
  line-height: 1.45;
}
.summary-block span,
.evidence-decision-fact span {
  font-size: 15px;
}
.owner-label {
  font-size: 12px;
  padding: 8px 11px;
}
.identity-facts dt {
  font-size: 13px;
}
.identity-facts dd {
  font-size: 17px;
}

/* --- mobile re-declarations (these would otherwise lose to the
       unconditional rules above) ----------------------------------- */
@media (width<=760px) {
  .fact-grid > div,
  .money-grid > div {
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
    padding: 16px 0;
  }
  .fact-grid > .wide-fact {
    grid-template-columns: minmax(0, 1fr);
  }
  .fact-grid dd,
  .modal-facts dd,
  .money-grid dd {
    font-size: 16px;
  }
  .plain-head > .provider-actions,
  .plain-head > .link-actions,
  .profile-section-head > .provider-actions,
  .profile-section-head > .link-actions,
  .plain-section > .context-actions,
  .profile-section > .context-actions {
    flex-direction: column;
    align-items: stretch;
    margin-top: 22px;
    padding-top: 20px;
  }
  .plain-head > .primary,
  .plain-head > .secondary,
  .plain-head > .tertiary,
  .profile-section-head > .primary,
  .profile-section-head > .secondary,
  .profile-section-head > .tertiary {
    width: 100%;
  }
  .plain-head > :first-child,
  .profile-section-head > :first-child {
    margin-bottom: 20px;
  }
  /* the shell keeps its snug mobile gutter */
  .workspace-nav-context,
  .workspace-tabs,
  .workspace-subtabs,
  .content-wrap,
  .focused-wrap,
  .campaign-shell,
  .directory-page,
  .record-wrap {
    width: calc(100% - 36px);
  }
  .workspace-tabs button {
    font-size: 14px;
    min-height: 56px;
    padding: 0 13px;
  }
  .workspace-subtabs button {
    font-size: 13px;
    min-height: 46px;
    padding: 0 12px;
  }
  .workspace-nav-context {
    min-height: 62px;
  }
  .workspace-nav-context strong {
    font-size: 17px;
  }
  .control-list button {
    min-height: 82px;
    gap: 16px;
  }
  .control-list strong,
  .relationship-row strong {
    font-size: 17px;
  }
}
</style>
