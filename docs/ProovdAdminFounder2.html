   `.record-row.action` / `.waiting` left-edge cue against exactly that value;
   changing it here would knock those rows off the shared left rail. */

.record-row {
  grid-template-columns:
    minmax(8rem,    1.05fr)
    minmax(0,       1.15fr)
    minmax(6.5rem,   .95fr)
    minmax(9rem,    1.5fr)
    var(--rec-act, minmax(7.5rem, 1.45fr));
  grid-template-rows: auto auto;
  align-items: start;
  column-gap: var(--rec-gap, clamp(.875rem, 1.4vw, 1.75rem));

  /* the value line and its caption line are one thought — the tightest gap on
     the page. Vertical space answers to height, never to width (§4.5A). */
  row-gap: clamp(.1875rem, .55svh, .375rem);

  /* the band's own breathing. Kept modest on purpose: with two lines per row
     the zebra field is already doing the separating, and a review stage is
     twenty-four fields long — the space belongs to the reading band, not to
     the gutters above and below it (§4.1, §4.6). */
  padding-block: clamp(.625rem, 1.35svh, 1rem);
  padding-inline: var(--sp-16);
}

/* the field name — a locator, alone in the left margin. Its leading is matched
   to the value's so the two first lines sit on the same optical rail (§4.18).
   Weight, size and colour are identity's and are left alone. */
.record-row > strong {
  grid-column: 1;
  grid-row: 1;
  line-height: 1.55;
  overflow-wrap: break-word;
}

/* THE VALUE — the dominant object of the whole system.
   Running text, not a label: larger than everything else on the row, lighter
   than the field name, and bounded by measure rather than by a column (§9.1).
   Colour is inherited from the row (identity's `--body`) and not re-declared. */
.record-row > div {
  grid-column: 2 / 5;
  grid-row: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
  max-width: var(--copy-max);
  font-size: clamp(1.05rem, 1.008rem + .16vw, 1.19rem);
  font-weight: 400;
  line-height: 1.55;
}
/* §9.4: these values are data, not labels — urls, ids and account handles wrap
   at a boundary rather than truncating away the part that identifies them. */
.record-row > div > span {
  min-width: 0;
  overflow-wrap: break-word;
}

/* provenance — the quietest line on the row, sitting under the value it
   explains. Identity already gives it 12px/faint; this is placement only. */
.record-row > .row-source {
  grid-column: 3;
  grid-row: 2;
  align-self: center;
  overflow-wrap: break-word;
}

/* state — a chip, on its own rail, one column right of the source so the two
   never read as one string (§7.2A). Identity owns the four chip textures. */
.record-row > .status-tag {
  grid-column: 4;
  grid-row: 2;
  align-self: center;
}

/* the row's own controls (§4.17 — local tools are sized as tools and attached
   to their object). Scoped to `.record-row` so the bare `.row-actions` layout
   other sections rely on is untouched. Column gap only: the buttons already
   carry a 44px box, so a row gap here would double-space a wrapped pair. */
.record-row .row-actions {
  grid-column: 5;
  grid-row: 1 / span 2;
  align-self: center;
  justify-content: flex-end;
  column-gap: var(--sp-12);
  row-gap: 0;
}


/* ═════════════════ 4. THE FOUR-TILE SUMMARY FAMILY — SHARED GRAMMAR (§4.12)

   `.compact-state-grid`, `.split-summary`, `.decision-branch` and
   `.final-summary` are four different jobs, so they are not one template used
   four times. What they share is grammar, not shape: every tile is the same
   left-aligned kicker → value → note stack, on the same gap rhythm, reading
   left to right. What differs is which tile is dominant and how it earns it —
   width, value scale, surface, and in one case a direction mark.

   The old version was all four as `repeat(4, 1fr)` inside one 1px black box
   with `border-left` dividers: identical treatment for four different jobs,
   which is exactly the §4.12 / §10.2-test-4 failure. */

.compact-state-grid,
.split-summary,
.decision-branch,
.final-summary {
  display: grid;
  align-items: stretch;
  column-gap: clamp(1rem, 1.8vw, 2rem);
  row-gap: var(--group-gap-y);
  min-width: 0;
  max-width: min(100%, var(--frame-standard));
}

.compact-state-grid > div,
.split-summary > div,
.decision-branch > div,
.final-summary > div {
  display: grid;
  align-content: start;
  gap: var(--sp-4);
  min-width: 0;
}

/* the tile's three parts, ranked. A quiet uppercase locator, the value, and a
   readable qualifier — three jobs, three treatments (§7.2A). */
.compact-state-grid > div > span,
.split-summary > div > span,
.decision-branch > div > span,
.final-summary > div > span {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}
.compact-state-grid > div > strong,
.split-summary > div > strong,
.decision-branch > div > strong,
.final-summary > div > strong {
  font-size: clamp(1.19rem, 1.064rem + .4vw, 1.54rem);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -.015em;
  color: var(--ink);
  overflow-wrap: break-word;
}
.compact-state-grid > div > small,
.split-summary > div > small,
.decision-branch > div > small,
.final-summary > div > small {
  font-size: 0.84rem;
  font-weight: 400;
  line-height: 1.45;
  color: var(--muted);
  max-width: 34ch;                /* §9.1 — a qualifier is still reading copy */
}


/* ── 4a. `.compact-state-grid` — WHERE A STAGE STANDS ──────────────────────
   Four independent readouts of equal rank: version, delivery, reminders,
   account. Nothing here is dominant and nothing should pretend to be, so this
   is the quietest member of the family — no fill at all, tiles sitting
   directly on the page (§4.2), gathered by one brand hairline above them,
   which is the same one-pixel rail the column heads use. On Invite it follows
   a `--grey-lightest` prefill band, so a fifth grey box would have blurred
   straight into it. Intrinsic tracks: it reflows continuously rather than
   waiting for a breakpoint (§8.0A). */

.compact-state-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(10.5rem, 100%), 1fr));
  margin-block-start: var(--section-gap-y);
  padding-block-start: var(--sp-16);
  border-top: var(--hair) solid var(--brand);
}


/* ── 4b. `.split-summary` — HOW A PAYMENT SPLITS ───────────────────────────
   Not four equal readouts: three counts around one payment model, and the
   model is the thing being agreed to. So the tracks are deliberately unequal —
   the model gets roughly twice the width of a count and the larger value — and
   the set sits on a quiet field, because on Matching it is a summary of terms
   above a working form rather than a status line (§4.3, §4.17). */

.split-summary {
  grid-template-columns:
    minmax(6.5rem,          .8fr)    /* possible matches  */
    minmax(min(17rem,100%), 1.9fr)   /* payment model — the dominant tile */
    minmax(6.5rem,          .7fr)    /* affiliate offers  */
    minmax(8rem,            1fr);    /* founder responses */
  padding-block: clamp(1.125rem, 2.4svh, 1.75rem);
  padding-inline: clamp(1.125rem, 2.2vw, 1.75rem);
  background: var(--grey-lightest);
}
.split-summary > div:nth-child(2) > strong {
  font-size: clamp(1.33rem, 1.12rem + .75vw, 1.82rem);
}


/* ── 4c. `.decision-branch` — WHICH WAY A CLOSE WENT ───────────────────────
   Three tiles, but a chain rather than a set: configured rule → frozen result
   → the branch that is now allowed. Position carries the order and a
   decorative arrow carries the direction; the terminal tile is the one that is
   live, so it takes §1's selection/action treatment — 5% brand fill and a
   brand border — plus a larger value. Two independent cues, both surviving
   grayscale and both readable with the pointer elsewhere (§4.16).
   Tiles 1–2 carry a transparent border of the same weight so all three sit on
   one baseline grid rather than the ringed one shifting by 2px (§4.18). */

.decision-branch {
  --db-gap: clamp(1.75rem, 3.2vw, 3.25rem);
  grid-template-columns:
    minmax(8rem,             1fr)     /* configured success rule */
    minmax(8rem,             1fr)     /* frozen result           */
    minmax(min(15rem,100%), 1.4fr);   /* allowed branch — the live end */
  column-gap: var(--db-gap);
}
.decision-branch > div {
  position: relative;
  border: var(--bw) solid transparent;
  padding-block: clamp(.875rem, 1.8svh, 1.25rem);
  padding-inline: clamp(1rem, 1.8vw, 1.5rem);
}
/* the direction mark. A decorative glyph, never readable copy — it sits in the
   gap between two tiles and says "and therefore". */
.decision-branch > div:not(:last-child)::after {
  content: "\2192";
  position: absolute;
  top: 50%;
  inset-inline-end: calc((var(--db-gap) / -2) - .35em);
  transform: translateY(-50%);
  color: var(--sage);
  font-size: 1.12rem;
  font-weight: 800;
  line-height: 1;
}
.decision-branch > div:last-child {
  align-content: center;
  background: var(--brand-5);
  border-color: var(--brand);
  border-radius: var(--radius);
}
/* §1: on a 5%-brand field with a brand border the text stays `#012D10` — the
   brand colour is spent on the border, never on dark-green-adjacent copy. */
.decision-branch > div:last-child > strong {
  font-size: clamp(1.33rem, 1.12rem + .8vw, 1.82rem);
}


/* ── 4d. `.final-summary` — THE FINAL RESULT OF THE CAMPAIGN ───────────────
   The payoff, and the one place in this file that spends real colour. §4.11
   "proof, evidence or result": the evidence goes before the explanation and is
   physically stronger than the copy describing it. So the result tile is wide,
   display-scale, and dark green — the single dark fill on the Complete screen,
   which 40-complete.css deliberately left unspent for exactly this. The three
   supporting figures sit beside it on a quiet field in a descending ladder:
   the founder's money outranks two counts (§4.17). Remove all the colour and
   the composition still ranks correctly by width and scale (§10.2 test 8). */

.final-summary {
  grid-template-columns:
    minmax(min(16rem, 100%), 1.75fr)   /* final result — the hero */
    repeat(3, minmax(7.5rem, 1fr));    /* net, creators, cooldown */
}
.final-summary > div {
  padding-block: clamp(1rem, 2svh, 1.5rem);
  padding-inline: clamp(1rem, 1.8vw, 1.5rem);
  background: var(--grey-lightest);
}
.final-summary > div:first-child {
  align-content: center;
  padding-block: clamp(1.5rem, 3.2svh, 2.25rem);
  padding-inline: clamp(1.25rem, 2.4vw, 2rem);
  background: var(--dark);
}
/* §1 dark-green section: title `#FAFAFA`, body `#E9FFE1`, quiet label in a
   listed supporting green. Never brand green on a dark-green fill. */
.final-summary > div:first-child > span   { color: var(--sage); }
.final-summary > div:first-child > strong {
  color: var(--page);
  font-size: clamp(1.96rem, min(3vw, 5svh), 2.8rem);
  line-height: 1.05;
  letter-spacing: -.03em;
}
.final-summary > div:first-child > small  { color: var(--mint); max-width: 30ch; }

/* second rank — the number the founder actually receives */
.final-summary > div:nth-child(2) > strong {
  font-size: clamp(1.33rem, 1.12rem + .8vw, 1.82rem);
}


/* ══════════════════════════════════ 5. `.policy-note` — A SYSTEM NOTE (§1)

   Neutral policy and legal text. It is not a state, not a task and not a card:
   it is a band of reading copy the page has to carry. Accent blue is the
   authorised colour for exactly this, and it gives the six stages a non-green
   texture that earns its place by meaning rather than by quota (§7.2A).
   No border — the field is the grouping (§4.8) — and the measure is capped so
   a wide monitor grows the margin, not the line (§9.1).

   It is pulled back to a group step because it belongs to the group above it
   (§4.1, §4.7): on Fee it qualifies the checkout it follows, on Matching it
   qualifies the offer list it follows. */

.policy-note {
  display: grid;
  align-content: start;
  gap: var(--sp-8);
  max-width: min(100%, 48rem);
  padding-block: clamp(1.125rem, 2.4svh, 1.75rem);
  padding-inline: clamp(1.25rem, 2.4vw, 2rem);
  background: var(--accent-blue);
  border-radius: var(--radius);
}
.policy-note:not(:first-child) {
  margin-block-start: calc(var(--block-gap-y) - var(--section-gap-y));
}
.policy-note > strong {
  font-size: clamp(1.05rem, 1.008rem + .2vw, 1.19rem);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -.01em;
  color: var(--darker);
}
.policy-note > p {
  font-size: 0.98rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--ink-50);
  max-width: var(--copy-max);
}

/* `.policy-note.action` is the same object asking for something, and §4.16
   requires more than a tint to separate it. Three independent cues, none of
   which is a hue swap:
     1. a solid `--darker` leading edge — the same left-edge language
        `.record-row.action` carries one section above, and the only one of the
        three that survives grayscale;
     2. its heading steps up a size;
     3. its body copy comes off `--ink-50` and goes to full-strength `--darker`
        — this is the paragraph that has to actually be read, not skimmed.

   It deliberately does NOT take accent yellow. It only ever appears on
   Delivery, where 20-chrome.css already spends that screen's one accent band
   on `.attention-line`; a second yellow field would break §1's one-band rule
   and put two "needs attention" surfaces on one page. `--grey-light` is one
   step denser than the zebra field, so with the dark edge and the darker copy
   it still reads heavier than the light-blue neutral note, never quieter. */
.policy-note.action {
  background: var(--grey-light);
  border-inline-start: var(--bw) solid var(--darker);
  padding-inline-start: calc(clamp(1.25rem, 2.4vw, 2rem) - var(--bw));
}
.policy-note.action > strong {
  font-size: clamp(1.12rem, 1.064rem + .3vw, 1.33rem);
}
.policy-note.action > p {
  color: var(--darker);
}


/* ══════════════════════ 6. `.inline-decision-panel` — A WORKING OBJECT (§7.1)

   This is not a note. It is the place on the Delivery stage where a decision
   actually gets made, so it reads as an object you operate: white fill on the
   `#FAFAFA` page — which is precisely the case §2 names for a border — with
   the brand boundary §1 reserves for a "needs you" container. The state it is
   waiting on is the largest thing inside it, the sentence that makes the
   decision safe sits directly beneath it at reading measure, and the three
   controls sit on the object itself rather than floating to a page footer
   (§4.14 CTA gravity). The primary is stepped away from the two tertiary
   controls so the group reads as "two exits, one commitment" (§4.17). */

.inline-decision-panel {
  display: grid;
  grid-template-columns: minmax(min(22rem, 100%), 1fr) auto;
  align-items: center;
  column-gap: clamp(1.5rem, 3vw, 3rem);
  row-gap: var(--group-gap-y);
  max-width: min(100%, var(--frame-standard));
  padding-block: clamp(1.25rem, 2.6svh, 1.875rem);
  padding-inline: clamp(1.25rem, 2.4vw, 2rem);
  background: var(--pure);
  border: var(--bw) solid var(--brand);
  border-radius: var(--radius);
}
.inline-decision-panel:not(:first-child) {
  margin-block-start: calc(var(--block-gap-y) - var(--section-gap-y));
}
.inline-decision-panel > div:first-child {
  display: grid;
  align-content: start;
  gap: var(--sp-4);
  min-width: 0;
}
.inline-decision-panel > div:first-child > span {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}
.inline-decision-panel > div:first-child > strong {
  font-size: clamp(1.26rem, 1.12rem + .5vw, 1.68rem);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -.02em;
  color: var(--ink);
}
.inline-decision-panel > div:first-child > p {
  font-size: 0.98rem;
  font-weight: 400;
  line-height: 1.55;
  color: var(--muted);
  max-width: var(--copy-max);
  margin-block-start: var(--sp-4);
}
/* scoped to this panel only — the bare `.inline-actions` layout is global */
.inline-decision-panel .inline-actions {
  justify-content: flex-end;
  column-gap: var(--sp-16);
  row-gap: var(--sp-8);
}
.inline-decision-panel .inline-actions > .primary {
  margin-inline-start: var(--sp-8);
}


/* ══════════════════════════════ 7. RESPONSIVE POSTURES (§8, §8.0A, §8.3)

   The tracks above are already intrinsic — every one is `minmax(<rem>, <fr>)`,
   so head and rows resolve from container width alone and the layout responds
   continuously between the sizes below. The two blocks here exist only where
   the topology genuinely has to change (§8.0A): five columns cannot hold their
   readable minima under ~900px, and a two-up caption cannot under ~600px.

   Checked at 1920, 1536, 1366, 1024 (five columns, air growing on the right of
   the 74rem cap), 768, 390 and 360 (stacked record). */

@media (max-width: 900px) {

  /* THE ROW BECOMES A RECORD (§4.22 — recompose before shrinking).
     Hierarchy survives the reflow (§8.3): the value stays the dominant object
     and takes the full width, the state stays visible on the name's line so a
     list is still scannable, and the row's controls stay inside the row.
     The column rail is genuinely redundant once the columns are gone — the one
     sanctioned withdrawal in this brief, and the only `display:none` here. */
  .record-table-head { display: none; }

  .record-row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto;
    row-gap: var(--sp-8);
    padding-block: var(--sp-16);
  }
  .record-row > strong      { grid-column: 1;      grid-row: 1; }
  .record-row > .status-tag { grid-column: 2;      grid-row: 1; justify-self: end; align-self: start; }
  .record-row > div         { grid-column: 1 / -1; grid-row: 2; }
  .record-row > .row-source { grid-column: 1 / -1; grid-row: 3; align-self: start; }
  .record-row .row-actions  {
    grid-column: 1 / -1;
    grid-row: 4;
    align-self: start;
    justify-content: flex-start;
  }

  /* THE TILE FAMILY. Each variant keeps its own dominant tile through the
     reflow rather than collapsing into four identical squares (§8.3). */
  .split-summary  { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .final-summary  { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .final-summary > div:first-child { grid-column: 1 / -1; }

  .decision-branch {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--block-gap-y);
  }
  /* the chain turns vertical, so the direction mark turns with it */
  .decision-branch > div:not(:last-child)::after {
    content: "\2193";
    top: 100%;
    inset-inline-end: auto;
    inset-inline-start: var(--sp-4);
    transform: none;
  }

  /* the decision panel stacks; its controls stay on the object, left-aligned
     under the statement they act on rather than stranded at the right edge */
  .inline-decision-panel { grid-template-columns: minmax(0, 1fr); }
  .inline-decision-panel .inline-actions { justify-content: flex-start; }
}

@media (max-width: 600px) {

  /* On a phone the caption pair cannot share a line with the name, so the
     record runs straight down in reading order: what field → what it says →
     where it came from → what state → what you can do about it. The value is
     still the first thing under the name and still the largest text in the
     record (§8.3 responsive equivalence). */
  .record-row {
    grid-template-columns: minmax(0, 1fr);
    padding-block: var(--sp-12);
  }
  .record-row > .status-tag { grid-column: 1; grid-row: 4; justify-self: start; }
  .record-row > .row-source { grid-row: 3; }
  .record-row .row-actions  { grid-row: 5; }

  .compact-state-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split-summary      { grid-template-columns: minmax(0, 1fr); }
  .final-summary      { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* the payoff does not give up its scale on a small screen — it is the whole
     point of the moment it closes (§8.3, §9.3 first-glance fit) */
  .final-summary > div:first-child > strong {
    font-size: clamp(1.82rem, min(7.5vw, 4.5svh), 2.52rem);
  }
}



/* ══════ 26-compact-table.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 26-COMPACT-TABLE
   The two numeric/attribution tables: `.creator-performance` (Live) and
   `.close-table` (Campaign ended), plus `.compact-table-section`,
   `.compact-table` and `.table-footer`.

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               compare entities by number — creator against creator,
                       charge against charge — and act on the one row that is off.
   Dominant object:    the numeric column that is the point of each table:
                       the Admin-set percentage (creator-performance), the
                       chargeable subtotal (close-table). Everything else is context.
   Supporting object:  the identity cell — name over id/handle — which anchors the
                       left rail of every row and makes a number belong to someone.
   Primary action:     none in-section. Each row carries one task-local control
                       (Open / Attempts) that sits on the row band it acts on.
   Composition thesis: both tables are borderless grids of alternating tinted
                       bands under one brand column rail; creator-performance is a
                       narrow 58rem block of three tall rows whose left half is a
                       name plus a display-scale percentage and whose right half is
                       four right-aligned effort metrics packed against the row's
                       Open control; close-table is a wider 66rem ledger of six
                       short rows where a right-aligned money pair sits against the
                       name and two left-aligned state columns run out to the
                       Attempts control on the row's right edge; below 900px each
                       row recomposes into a stacked record — headline number
                       pinned right of the name, remaining cells flowing beneath —
                       and the column rail, now redundant, is withdrawn.
   Vertical posture:   Scrollable-work (these sections live inside a long stage).
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES
   1. The old sheet gave both tables one treatment behind `min-width: 930px`, so
      every laptop scrolled sideways to read a ledger. There is no min-width and
      no horizontal scroll here: tracks are `minmax(<rem>, <fr>)` — resolved from
      container width only, never from cell content, so the header rail and every
      independent row grid land on the same columns — and the row recomposes into
      a stacked record before the minima can ever collide (§4.22).
   2. Every cell was 13–14px of equal weight, so nothing read as a number. Weight,
      scale and alignment now rank each column: identity anchors left, the number
      that IS the row goes display-scale, measured facts right-align onto a shared
      units rail, and genuinely secondary values drop to `--muted` (§4.17, §10.2/5).
   3. Ten `border-bottom`s become the globally-provided alternating field plus one
      deliberate gap step between the two zones of each row (§4.8, §1).
   ========================================================================= */


/* ═══════════════════════════════════════════════ SECTION FRAME (§4.18 §9.1)
   The section — heading rail, brand hairline and table — is capped as one
   object so the hairline is exactly as wide as the columns it labels (§4.14).
   Two different caps: this is one of the four levers separating the two
   silhouettes (§4.12 — composition width). Left-aligned to the stage rail;
   on a wide monitor the extra width becomes a field of air on the right
   rather than 1400px-wide rows (§9.1, §4.13). */

.compact-table-section { min-width: 0; }

.compact-table-section:has(.creator-performance) { max-width: min(100%, 54rem); }
.compact-table-section:has(.close-table)         { max-width: min(100%, 62rem); }

/* The section header rail already carries a brand hairline; the column rail
   carries a second one. Push them apart so they read as two tiers rather than
   one doubled rule (§4.1 — different relationship, different distance). */
.compact-table {
  width: 100%;
  min-width: 0;
  margin-block-start: var(--group-gap-y);
}


/* ═════════════════════════════════════ SHARED GRID GEOMETRY (§4.11 §9.5)
   Head and row are separate elements, so they can only agree on columns if
   every track is content-independent. Hence `minmax(<rem>, <fr>)` throughout
   and no `auto` / `max-content` track anywhere in this file.
   Column gap is horizontal → width-driven. Row height is vertical → svh. */

.compact-table > .compact-table-head,
.compact-table > .compact-table-row {
  column-gap: var(--ct-gap, var(--col-gap));
  row-gap: var(--ct-gap, var(--col-gap));
  padding-inline: var(--sp-16);
}

.compact-table > .compact-table-head {
  padding-block: 0 var(--sp-8);
}

/* the identity cell — name over id/handle, the row's anchor.
   Both lines are labels, so both truncate rather than rewrap the row (§9.4). */
.compact-table-row > span:first-child {
  display: grid;
  align-content: center;
  min-width: 0;
}
.compact-table-row > span:first-child > strong,
.compact-table-row > span:first-child > small {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* the task-local control sits on the row's own right rail — inside the band it
   acts on, at the same inline edge the band ends (§4.17, §4.14). Height stays
   the globally set 2.75rem, which is also the 44px touch floor (§9.2). */
.compact-table-row > span:last-child {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.compact-table-row .inline-actions {
  justify-content: flex-end;
  gap: var(--sp-4) var(--sp-12);
}


/* ═══════════════════════════════ TABLE A — CREATOR PERFORMANCE (Live)
   Attribution and effort. Seven columns, three rows, tall and open.
   Geometry: a left zone that reads left-aligned (who, and the number the
   Admin set for them) and a right zone that reads right-aligned (what was
   measured), separated by one extra step of space rather than a rule. */

.creator-performance {
  --ct-gap: clamp(.75rem, 1vw, 1.25rem);
}

.creator-performance > .compact-table-head,
.creator-performance > .compact-table-row {
  grid-template-columns:
    minmax(8rem,    1.3fr)   /* Creator     — anchor */
    minmax(5.5rem,  1.1fr)   /* Percentage  — the dominant number */
    minmax(5rem,     .5fr)   /* Backers     */
    minmax(4.5rem,  .72fr)   /* Reserved    */
    minmax(4rem,     .6fr)   /* Clicks      */
    minmax(5.25rem, .78fr)   /* Posts       */
    minmax(3.5rem,   .5fr);  /* Action      */
}

.creator-performance > .compact-table-row {
  min-height: clamp(3.75rem, 6.5svh, 4.75rem);
  padding-block: var(--sp-16);
}

/* zone step: attribution | effort. Proximity does the grouping work a divider
   used to do, and it is applied to head and row alike so the rail stays true. */
.creator-performance > .compact-table-head > span:nth-child(3),
.creator-performance > .compact-table-row  > span:nth-child(3) {
  padding-inline-start: var(--sp-16);
}

/* the measured facts share one units rail so a column can be read downward */
.creator-performance > .compact-table-head > span:nth-child(n+3),
.creator-performance > .compact-table-row  > span:nth-child(n+3):nth-child(-n+6) {
  text-align: right;
}

.creator-performance .compact-table-row > span:first-child { gap: var(--sp-4); }
.creator-performance .compact-table-row > span:first-child > strong { line-height: 1.3; }

/* the percentage — the one number the Admin actually sets, so it is the only
   display-scale figure on the row (§4.11 "choosing one important number",
   §4.17). Capped on both axes so a wide-and-short screen cannot inflate it
   into the row's vertical budget (§4.20, §10.1). */
.creator-performance .compact-table-row > span:nth-child(2) {
  display: grid;
  align-content: center;
  gap: var(--sp-4);
  min-width: 0;
}
.creator-performance .compact-table-row > span:nth-child(2) > strong {
  font-size: clamp(1.54rem, min(1.176rem + .8vw, 3.6svh), 2.1rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.03em;
}
.creator-performance .compact-table-row > span:nth-child(2) > small {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* effort ranking — reserved money outranks a raw count, a click total is the
   softest signal on the row, and "2 of 3 live" is a phrase, not a figure. */
.creator-performance .compact-table-row > span:nth-child(3) { font-weight: 600; }
.creator-performance .compact-table-row > span:nth-child(4) { font-weight: 700; color: var(--ink); }
.creator-performance .compact-table-row > span:nth-child(5) { font-weight: 500; color: var(--muted); }
.creator-performance .compact-table-row > span:nth-child(6) { font-size: 0.98rem; font-weight: 500; }


/* ═════════════════════════════ TABLE B — CLOSE LEDGER (Campaign ended)
   Money settling. Six columns, six rows, short and dense — roughly 60px of
   row against creator-performance's ~83px, which is the density half of the
   silhouette split (§4.12, §4.11 "dense management"). Geometry: name anchor,
   then a right-aligned money pair (what is owed, less what is tax), then a
   step of space, then the state word on its own left edge and the payment
   state pulled right onto the same rail as the Attempts control.
   Swap this content into Table A and three creators would rattle around in a
   display-scale layout; swap Table A's into this and the percentage would be
   buried in a ledger line. That is the §10.2 test 4 answer. */

.close-table {
  --ct-gap: clamp(.625rem, .85vw, 1rem);
}

.close-table > .compact-table-head,
.close-table > .compact-table-row {
  grid-template-columns:
    minmax(8.5rem, 1.45fr)   /* Backer     — anchor, and where the slack lives */
    minmax(4.5rem,  .62fr)   /* Subtotal   — the money */
    minmax(4.75rem, .55fr)   /* Final tax  — the deduction */
    minmax(6.5rem,   .9fr)   /* Status     */
    minmax(7rem,    .95fr)   /* Payment    */
    minmax(5rem,    .45fr);  /* Action     */
}

.close-table > .compact-table-row {
  min-height: clamp(3.25rem, 5svh, 3.75rem);
  padding-block: var(--sp-8);
}

/* zone step: what is owed | where it stands */
.close-table > .compact-table-head > span:nth-child(4),
.close-table > .compact-table-row  > span:nth-child(4) {
  padding-inline-start: var(--sp-16);
}

/* Alignment cadence — left, right·right, left, right — and the Action cell is
   already right-aligned, so Payment lands on the same rail as the control that
   inspects it: "Retry 2 of 3" sits one gap from "Attempts". That adjacency is
   how the row's local tool stays attached at every width (§4.17), and the
   alternating cadence is what Table A's four-column right rail does not have
   (§4.12 — column relationship). */
.close-table > .compact-table-head > span:nth-child(2),
.close-table > .compact-table-head > span:nth-child(3),
.close-table > .compact-table-head > span:nth-child(5),
.close-table > .compact-table-head > span:nth-child(6),
.close-table > .compact-table-row  > span:nth-child(2),
.close-table > .compact-table-row  > span:nth-child(3),
.close-table > .compact-table-row  > span:nth-child(5) {
  text-align: right;
}

/* tighter identity stack — the ledger's density comes from here, not from
   smaller type (§4.22: recompose and re-space before shrinking) */
.close-table .compact-table-row > span:first-child > strong { line-height: 1.2; }
.close-table .compact-table-row > span:first-child > small  { line-height: 1.25; }

/* subtotal is the point of the row; tax is context under it (§4.17) */
.close-table .compact-table-row > span:nth-child(2) {
  font-size: clamp(1.05rem, 1.008rem + .2vw, 1.19rem);
  font-weight: 700;
  color: var(--ink);
}
.close-table .compact-table-row > span:nth-child(3) {
  font-size: 0.98rem;
  font-weight: 500;
  color: var(--muted);
}
/* state outranks mechanism; both wrap at word boundaries rather than clip (§9.4) */
.close-table .compact-table-row > span:nth-child(4) { font-weight: 600; }
.close-table .compact-table-row > span:nth-child(5) { font-weight: 400; color: var(--muted); }


/* ═══════════════════════════════════════════════ TABLE FOOTER (§4.14)
   Where a total or a summary action closes the table. It sits flush against
   the last row so it reads as part of the table, on --grey-light — one step
   denser than the zebra's --grey-lightest, so it is a different object from a
   row — and in dark bold sentence case, so it can never be mistaken for the
   uppercase micro-caps of the column rail above.
   NOTE: this class is not present in the captured DOM; see report. */

.table-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-8) var(--sp-24);
  min-height: var(--ctl-h-sm);
  margin-block-start: 0;
  padding: var(--sp-12) var(--sp-16);
  background: var(--grey-light);
  color: var(--ink);
  font-size: 0.98rem;
  font-weight: 600;
}
.table-footer > * { min-width: 0; }
.table-footer strong {
  font-size: clamp(1.12rem, 1.064rem + .3vw, 1.4rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -.025em;
  color: var(--ink);
}


/* ═══════════════════════════════ STACKED RECORD POSTURE (§8, §8.3, §4.22)
   Below the 900px structural line seven or six columns cannot hold their
   minimum readable widths, so the row recomposes into a record instead of
   scrolling sideways or shrinking type. The column rail is genuinely
   redundant once the columns are gone, and is the one sanctioned withdrawal.
   Hierarchy survives the reflow: the identity keeps the record's left rail,
   the dominant number stays dominant and pins to the right of it, and each
   row's own control stays inside the row's own band (§8.3). */

@media (max-width: 900px) {

  .compact-table > .compact-table-head { display: none; }

  .compact-table > .compact-table-row {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: start;
    row-gap: var(--sp-12);
    column-gap: var(--ct-gap, var(--col-gap));
    padding-block: var(--sp-16);
    min-height: 0;
  }

  /* identity takes every column but the last; the record's headline number
     takes the last one and stays right-aligned against it. `1 / -2` and
     `-2 / -1` hold for both the 4-column and the 2-column template. */
  .compact-table > .compact-table-row > span:first-child  { grid-column: 1 / -2; }
  .compact-table > .compact-table-row > span:nth-child(2) { grid-column: -2 / -1; text-align: right; }

  /* the remaining cells auto-flow beneath. A units rail only exists when there
     are columns to compare, so alignment and the zone step both stand down. */
  .creator-performance > .compact-table-row > span:nth-child(n+3):nth-child(-n+6),
  .close-table         > .compact-table-row > span:nth-child(3),
  .close-table         > .compact-table-row > span:nth-child(5) { text-align: start; }

  .creator-performance > .compact-table-row > span:nth-child(3),
  .close-table         > .compact-table-row > span:nth-child(4) { padding-inline-start: 0; }

  /* the open table gives its control a full line under the record; the dense
     ledger lets Attempts auto-flow into the last cell of its second line.
     The density split survives the reflow (§8.3 responsive equivalence). */
  .creator-performance > .compact-table-row > span:last-child {
    grid-column: 1 / -1;
    justify-content: flex-start;
  }
}

@media (max-width: 600px) {

  .compact-table > .compact-table-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    row-gap: var(--sp-8);
  }

  /* the headline number carries the record on a phone, so it does not give up
     its scale when the record narrows (§8.3: dominant stays dominant) */
  .creator-performance .compact-table-row > span:nth-child(2) > strong {
    font-size: clamp(1.68rem, min(1.288rem + 2.4vw, 4svh), 2.24rem);
  }

  /* §9: nothing overflows. The section rail's qualifier is set `nowrap`
     globally; at 360px a 40-character qualifier cannot hold a line. Scoped to
     this section only, and reported as a deviation. */
  .compact-table-section > header > span { white-space: normal; }
}



/* ══════ 28-prefill-forms.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 28-PREFILL-FORMS
   The Invite stage's prefill fieldset: `.invite-prefill`, its `.locked` state,
   the two `.prefill-section`s, `.prefill-grid`, its `label` / `label.wide`
   children, and the `.onboarding-prefill` band.

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               author the invitation this Founder will actually receive,
                       while checking the account facts already on file.
   Dominant object:    the two prose writing surfaces — Problem and Solution.
                       They are the body of the invitation; everything else on
                       this screen is a field around them (§4.11 "writing a
                       substantial answer": the writing surface IS the object).
   Supporting object:  the "Saved for onboarding" band — six short values the
                       Founder never sees, present so the author can trust that
                       the account behind the invitation is complete.
   Primary action:     Send invite. It lives in `.actionbar` (owned elsewhere);
                       this section's only job is to make pressing it safe.
   Composition thesis: the invitation is one 60ch column pinned to the stage's
                       left rail — a two-up rail of short identity fields, then
                       two full-column writing surfaces roughly 11rem tall, then
                       a single short field carrying display-scale digits; a full
                       section gap below it the onboarding prefills sit inside a
                       56rem `--grey-lightest` band as a packed wrap-flow of six
                       fields whose widths are set by what each one holds — email
                       widest, count narrowest — bottom-aligned so every field in
                       a row lands on one rail.
   Vertical posture:   Top-work (§4.19) — the fieldset begins immediately under
                       the state strip and grows downward.
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES

   1. The old grid was `repeat(2, minmax(0,1fr))` with one `18px 20px` gap, so a
      person's name got exactly the same width as a two-sentence problem
      statement, and every gap on the screen was the same gap. Width now follows
      the shape of the content (§4.11, §9.1) and the gaps are ranked (§4.1):
      label→field is the tightest thing on the screen, Problem→Solution is a
      pair gap, rail→writing→number are group gaps, section→section is a section
      gap. Nothing here is a 50/50 split; the invitation column uses intrinsic
      `auto-fit` tracks inside a `ch` cap, and the onboarding band uses a
      content-shaped wrap-flow.

   2. The two sections were typographically identical, so the most consequential
      distinction on the screen — what the Founder will read versus what he will
      never see — was invisible. They now differ on four independent axes
      (§4.12): composition width (60ch column vs 56rem band), field scale (tall
      writing surfaces + display digits vs uniform `--field-h` rows), density
      (open, ranked gaps vs packed wrap-flow) and ground (page vs quiet
      `--grey-lightest` field). Cover the copy and they are still two different
      kinds of object; remove the colour and the difference survives (§10.2/8).

   3. `.locked` was `opacity:.55`, which reads as broken rather than settled.
      There is no opacity in this file. Locked inverts the ground instead: the
      whole fieldset drops onto a quiet field with a `--sage` leading edge (the
      same "waiting on someone else" cue `.record-row.waiting` already uses),
      the onboarding band steps one tone deeper, the writing surfaces stop
      offering a resize grip and shrink to the height of a value rather than a
      workspace. Every value keeps the full `--muted`-on-`--grey-light` contrast
      the identity layer gives it.

   Field identity — white fill, grey ring, brand focus ring, `--field-h`, label
   typography, the select caret, textarea line-height — is owned by
   15-identity.css and is not re-declared here. This file owns arrangement only:
   which field goes where, how wide, in what group, at what rhythm. The one
   deliberate exception is documented at THE NUMBER, below.
   ========================================================================= */


/* ══════════════════════════════════════════ THE FIELDSET (§4.18 §4.5A)
   A <fieldset> ships with a groove border, UA padding and an intrinsic
   `min-inline-size: min-content` that will happily blow a grid track out.
   All four are removed so the element is a pure grouping wrapper.

   Vertical margin is section-scale because the fieldset is a whole task group
   sitting between two state readouts. `.workspace-inner` is a normal block
   container, so these margins collapse with the neighbours' rather than
   stacking with them. */

.invite-prefill {
  min-width: 0;
  min-inline-size: 0;
  margin: var(--section-gap-y) 0;
  padding: 0;
  border: 0;

  /* the one derived step this file needs: how much a group gap has to grow to
     become a block gap. Both operands are height-driven tokens (§4.5A), and the
     result is always positive because block-min (1.5rem) > group-max (1.25rem). */
  --gap-step: calc(var(--block-gap-y) - var(--group-gap-y));
}


/* ═════════════════════════════════════════════ SECTION RHYTHM (§4.1 §4.5A)
   Two sections, one big deliberate gap. The onboarding band adds its own top
   padding on top of this, so the optical separation lands in §4.1's 64–120px
   section range without either value being invented. */

.prefill-section { min-width: 0; }
.prefill-section + .prefill-section { margin-block-start: var(--section-gap-y); }

/* The heading rail itself is the globally-owned section header (heading,
   qualifier span, supporting line, brand hairline). Only the parts specific to
   this DOM are set here: the wrapper <div> around h2 + p has no global rule, so
   it needs to be told to shrink, to keep its supporting line tight under its
   heading (§4.1), and to yield the qualifier span to the far end of the rail. */
.prefill-section .prefill-heading > div {
  display: grid;
  gap: var(--sp-4);
  flex: 1 1 20rem;
  min-width: 0;
}
.prefill-section .prefill-heading > span { flex: none; }


/* ═══════════════════════════════════════ LABEL = ONE FIELD UNIT (§4.1 §7.1)
   A label, its field, and nothing between them but 8px. This is the tightest
   relationship on the screen and it is spaced accordingly. `align-content:
   start` keeps the pair pinned to the top of the label box when a neighbouring
   label in the same row wraps to two lines. */

.prefill-grid label {
  display: grid;
  gap: var(--sp-8);
  align-content: start;
  min-width: 0;
}


/* ══════════════════════════════════ 1. SHOWN IN THE INVITATION (§4.11 §9.1)
   The live, consequential group: this is the document the Founder receives.

   The whole section — heading rail, brand hairline and fields — is capped at
   one reading measure so the hairline is exactly as wide as the fields it
   labels (§4.14), and so a 4K monitor grows air on the right rather than
   stretching a name field across half a desk (§9.1, §4.13). The cap is authored
   in `ch` because what it is really capping is the measure of the two prose
   surfaces: ~60ch of column gives the textareas ~66ch of text. */

.prefill-section:not(.onboarding-prefill) { max-width: min(100%, 60ch); }

/* Heading sits a touch further from its fields here than in the dense band —
   still inside §4.1's "related" range, but part of what makes this section read
   open and the band read packed (§4.12). */
.prefill-section:not(.onboarding-prefill) .prefill-heading { margin-bottom: var(--sp-24); }

/* Intrinsic tracks, not a 50/50 split. Inside a 60ch column `auto-fit` resolves
   to exactly two ~15rem tracks on any desktop and to one track once the column
   can no longer hold two — a continuous response, not a breakpoint (§8.0A).
   Row gap is the *group* gap: it is the gap between fields that belong
   together, and it is deliberately smaller than the steps set below. */
.prefill-section:not(.onboarding-prefill) .prefill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr));
  column-gap: var(--col-gap);
  row-gap: var(--group-gap-y);
  align-items: end;          /* fields land on one rail even if a label wraps */
}

/* the two prose surfaces take the whole column */
.prefill-grid label.wide { grid-column: 1 / -1; }

/* THE WRITING SURFACE (§4.11 "writing a substantial answer")
   The dominant object of the section, so it is given real vertical room rather
   than the 92px hairline it used to be. Height answers to viewport height, not
   width (§4.5A): on a 1080px screen these are ~11rem tall, on a 768px laptop
   ~10rem, and they never exceed 13rem. Measure comes from the column cap
   above — no second max-width is invented here. */
.prefill-section:not(.onboarding-prefill) .prefill-grid textarea {
  min-height: clamp(9rem, 22svh, 13rem);
}

/* THE GAP LEDGER (§4.1, §4.5A spacing ledger)
   Three ranked vertical steps inside one section, none of them mechanical:
     · identity rail → writing block   = group gap + step  (a new group begins)
     · Problem → Solution              = group gap         (one pair, kept tight)
     · writing block → the number      = group gap + step  (a new group begins)
   `label:not(.wide) + label.wide` is Problem — the first wide field after the
   short rail. `label.wide + label:not(.wide)` is the number — the first short
   field after the writing block. Solution, sitting between two wides, keeps the
   base row gap and so stays visibly bound to Problem. */
.prefill-grid label:not(.wide) + label.wide,
.prefill-grid label.wide + label:not(.wide) {
  margin-block-start: var(--gap-step);
}


/* ────────────────────────────────────── THE NUMBER (§4.11 §4.17 §9.2)
   "Choosing one important number": the number is the hero and its descriptor is
   subordinate and physically attached. So "Number of views" is not a half-width
   form slot — it is the shortest field on the screen holding the largest digits,
   with its label pulled to a 4px hairline gap so the descriptor clings to the
   value instead of floating above a box.

   DELIBERATE, SCOPED EXCEPTION to AGENT-BRIEF §3: this is the one rule in this
   file that sets `font-size` on an input. §4.11 makes display scale a
   compositional requirement of this task, and it cannot be expressed any other
   way. Nothing else about the control's identity is touched — fill, ring, focus
   ring, weight and caret all remain the global treatment — and the rule is
   scoped to a single input inside a single section so no other field in the
   product can inherit it. `font-weight` is deliberately left at the global 600;
   the scale alone carries the hierarchy.

   The size is capped on both axes (§4.20): width sets the target, height caps
   it, so a wide-but-short window cannot push the digits into the layout. */
.prefill-section:not(.onboarding-prefill) .prefill-grid label:has(input[type="number"]) {
  gap: var(--sp-4);
  max-width: min(100%, 14rem);
}
.prefill-section:not(.onboarding-prefill) .prefill-grid input[type="number"] {
  min-height: calc(var(--field-h) + var(--sp-12));
  font-size: clamp(1.54rem, min(1.008rem + 1.1vw, 4svh), 2.1rem);
  letter-spacing: -.02em;
  padding-inline: var(--sp-16) var(--sp-12);  /* room for the native stepper */
}


/* ══════════════════════════════════════ 2. SAVED FOR ONBOARDING (§4.12 §7.2A)
   Reference the Founder never sees. It has to read as a different kind of
   object with the copy covered, and it does so by composition first: wider,
   shorter, denser, uniform field height, no writing surface, no display type.
   The `--grey-lightest` field is the supporting cue, not the argument — remove
   it and the two sections are still obviously different (§10.2/8). It is a
   quiet grouping field, which §1 names as the tool to reach for before a
   border; it is not a decorative pastel panel (§10.1).

   The band is inset from the invitation column's left rail by its own padding.
   That offset is intentional and repeatable (§4.18): heading rail, hairline and
   fields all move together, so the band reads as one contained group rather
   than as drift. */

.onboarding-prefill {
  max-width: min(100%, 56rem);
  padding: var(--block-gap-y) var(--sp-24);
  background: var(--grey-lightest);
}

/* A packed wrap-flow, not a grid — the mechanism itself is part of the
   silhouette contrast (§4.12: a ruled column beside a packed ledger).
   Each field's flex basis and cap are set by what it actually holds, so widths
   state content shape: an email address is the widest thing here, a count is
   the narrowest, and a one-word brand descriptor never occupies the same slot
   as an address. `align-items: flex-end` bottom-aligns the labels, which — since
   every field is exactly `--field-h` — lands every field in a row on one rail
   even when a long label like "Number of affiliate matches" wraps to two lines
   (§9.7). Grow factors are modest and every field is capped, so the rows fill
   the band without any field drifting away from its natural size (§9.1). */
.onboarding-prefill .prefill-grid {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  column-gap: var(--col-gap);
  row-gap: var(--group-gap-y);
}

/* default shape — also the fallback for engines without `:has()` */
.onboarding-prefill .prefill-grid label {
  flex: 2 1 min(12rem, 100%);
  max-width: 20rem;
}

/* an address is long editable data — widest basis, widest cap (§9.4) */
.onboarding-prefill .prefill-grid label:has(input[type="email"]) {
  flex: 3 1 min(18rem, 100%);
  max-width: 26rem;
}
/* a chooser has to show its longest option without truncating it */
.onboarding-prefill .prefill-grid label:has(select) {
  flex: 3 1 min(16rem, 100%);
  max-width: 24rem;
}
/* a handle and a one-word descriptor are short — they must look short */
.onboarding-prefill .prefill-grid label:has(input:not([type])) {
  flex: 2 1 min(10rem, 100%);
  max-width: 15rem;
}
/* a count is the narrowest thing in the band. It stays a plain field: there is
   one hero number on this screen and it is in the invitation (§5.6, §4.3). */
.onboarding-prefill .prefill-grid label:has(input[type="number"]) {
  flex: 1 1 min(8rem, 100%);
  max-width: 10rem;
}


/* ═══════════════════════════════════════════ LOCKED — READ-ONLY, NOT BROKEN
   (§4.16 two independent cues, §7.2A state must be the reason for a fill,
    §10.2/2 cover-the-copy, §10.2/5 grayscale)

   No opacity. The identity layer already fills disabled fields with
   `--grey-light` and sets their text `--muted`; this composes around that so
   the state is unmistakable while every value stays at full contrast.

   Three cues, all legible in grayscale with the copy covered:
     · the ground inverts — the whole fieldset drops onto a quiet field, so the
       white wells that say "type here" are gone from the screen entirely;
     · the onboarding band steps one tone deeper, so the two sections stay
       distinguishable and each locked field sits flush inside its own band,
       bounded by its ring alone — the silhouette of a value, not of a well;
     · a `--sage` leading edge, the same "waiting on someone else" mark
       `.record-row.waiting` already carries elsewhere in the product. */

.invite-prefill.locked {
  padding: var(--block-gap-y) var(--sp-24);
  background: var(--grey-lightest);
  border-left: var(--bw) solid var(--sage);
}
.invite-prefill.locked .onboarding-prefill { background: var(--grey-light); }

/* a locked writing surface is a rendered value, not a workspace: it stops
   offering a resize grip and stops reserving a workspace's worth of height, so
   a settled two-sentence answer does not sit in a large empty box (§10.2/18). */
.invite-prefill.locked .prefill-grid textarea {
  min-height: clamp(5rem, 11svh, 7rem);
  resize: none;
}
.invite-prefill.locked .prefill-grid label { cursor: default; }


/* ═══════════════════════════════════════════════ RESPONSIVE (§8 §8.3 §9.2)
   Almost nothing is needed here, and that is the point: both compositions are
   intrinsic. The invitation column is capped in `ch`, so it never stretches on
   a wide monitor and resolves from two tracks to one the moment two 15rem
   tracks no longer fit — around a 500px column, well below the 900px line. The
   onboarding band wraps continuously; at 390px an email takes its own row while
   the username and the count still share one, so short fields never become
   full-bleed just because the screen is narrow (§8.3).

   Hierarchy is preserved through the reflow: the writing surfaces keep their
   height-driven `svh` minimum and stay the largest objects in the fieldset, the
   number keeps its display scale and its short cap, and each label stays
   attached to its own field. Every field remains at least `--field-h` — a
   3rem/48px floor, above the 44px minimum — at every width (§9.2). */

@media (max-width: 600px) {
  /* the band's inset relaxes so the phone keeps its content measure, but the
     band itself is not dropped: the two sections must stay distinguishable on
     the smallest screen too (§4.9 — compress rhythm, never collapse it). */
  .onboarding-prefill,
  .invite-prefill.locked { padding-inline: var(--sp-16); }
}



/* ══════ 30-matching.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 30-MATCHING
   The Matching stage: the add-an-affiliate-offer form, the offer inventory,
   and the Creator record card (also reused, compact, in the Complete stage).

   ── §4.10 COMPOSITION CONTRACT ────────────────────────────────────────────
   Task:               choose one affiliate, set the exact commission
                       percentage, publish it, then read the offer inventory
                       that already exists.
   Dominant object:    the percentage — a display-scale number with its "%"
                       welded to it, with the button that publishes it
                       hanging directly underneath at the same width.
   Supporting object:  the affiliate chooser beside it (who the number is
                       for) and the record list below (what the numbers
                       already produced).
   Primary action:     "Add to Founder dashboard" — the commitment that
                       closes the little form. (The stage's own progression
                       action lives in the actionbar and is not mine.)
   Composition thesis: the add form is one full-width quiet field whose
                       title runs across the top, whose work row splits into
                       a wide affiliate chooser on the left and a display
                       -scale percentage on the right, with the Add button
                       spanning the full width of the percentage column
                       directly beneath it; below the band the inventory
                       sits unboxed on the page as two-track records —
                       an 18rem identity rail, then a stats field that ranks
                       percentage + founder response into their own inner
                       column ahead of the context stats — separated by an
                       alternating #F7F7F7 field, never a divider per row,
                       with each record's actions on the record itself.
   Vertical posture:   Top-work.

   ── WHAT WAS WRONG, AND WHAT REPLACED IT ─────────────────────────────────
   1. The form was `1fr 1fr 170px auto` on a single 76px line: an
      explanation, a select, a 36px percentage box and a small button all at
      the same physical weight, so the one number the admin is actually
      choosing was the smallest thing on the screen. It is now the largest
      (§4.11 "choosing one important number"), its unit is a real attached
      sibling rather than a floating `b`, and the button that commits it is
      the full width of that number's column (§9.2 proportional closure).
   2. Form and inventory used to be two identical 1px boxes. They now differ
      in geometry AND density: the form is a filled --grey-light band with a
      title rail and a two-part work row; the inventory sits directly on the
      page as open rows (§4.12, §4.2).
   3. `.creator-record dl` was six equal `minmax(150px,1fr)` cells — the
      exact failure §4.17 names. The percentage and the founder's response
      are now a consequential inner column at value scale; audience, shelf
      visibility and final-campaign state are quiet context beside them.
   4. `border-bottom` on every record became one alternating field (§4.8).

   Colour budget spent here: none. Two tints of the grey field ladder
   (--grey-light for the work band, --grey-lightest for the row field) and
   the ink/body/muted/faint text roles. No dark-green fill, no accent band —
   the stage heading, the state strip and the summary tiles belong to other
   agents and the screen only gets one (§1, §10.2 test 8).
   ========================================================================= */


/* ═══════════════════════════════════════════════════════ THE ADD FORM
   A quiet field, not a card. §4.8 grouping order stops at "background
   contrast" — a border here would make it a fourth identical rectangle on a
   screen that already has summary tiles and a state strip. --grey-light is
   one step heavier than the row field below, so the band reads as the place
   where work happens and the list reads as what already exists. */

.matching-add-form {
  /* the hero number's two-axis cap (§4.20) and the height of its field */
  --pct-size: clamp(2.25rem, min(4.6vw, 6svh), 3.25rem);
  --pct-h:    clamp(3.75rem, 7.5svh, 4.5rem);
  /* the commitment column: the number and its button share this width */
  --commit-w: 26rem;

  display: grid;
  grid-template-columns:
    minmax(min(16rem, 100%), 1fr)                    /* who  */
    minmax(min(15rem, 100%), var(--commit-w));       /* how much + publish */
  column-gap: clamp(1.5rem, 4vw, 4.5rem);            /* horizontal → width  */
  row-gap: var(--group-gap-y);                       /* vertical → height   */
  align-items: end;                                  /* fields sit on one baseline rail */
  min-width: 0;
  padding: clamp(1.25rem, 3svh, 2.25rem) clamp(1.25rem, 3vw, 2.75rem);
  background: var(--grey-light);
  border-radius: var(--radius);
}
.matching-add-form > * { min-width: 0; }

/* title rail across the whole band — §4.1: the heading stays close to the
   controls it introduces, and nothing below it is a second heading. */
.matching-add-form > div {
  grid-column: 1 / -1;
  grid-row: 1;
  align-self: start;
  display: grid;
  gap: var(--sp-8);
}
.matching-add-form h2 {
  font-size: clamp(1.19rem, 1.064rem + .35vw, 1.54rem);
  font-weight: 800;
  line-height: 1.22;
  letter-spacing: -.012em;
  color: var(--ink);
}
.matching-add-form p {
  max-width: 52ch;                                   /* §9.1 measure cap */
  font-size: 0.91rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--muted);
}

/* a label owns its field as one unit; 8px inside the unit is deliberately
   tighter than the 12–20px between units (§4.1). */
.matching-add-form label {
  display: grid;
  gap: var(--sp-8);
  align-content: end;
  min-width: 0;
}

/* the affiliate chooser — wide, because its option labels are long, but
   capped so a 1920 monitor grows air instead of the control (§9.1). */
.matching-add-form label:nth-of-type(1) {
  grid-column: 1;
  grid-row: 2;
  max-width: 34rem;
}

/* the decision itself */
.matching-add-form label:nth-of-type(2) {
  grid-column: 2;
  grid-row: 2;
}

/* the commitment that closes the object, at the object's full width
   (§9.2) — roughly 40% of the whole work row, and never a small button
   parked at the end of a cramped line. */
.matching-add-form > button {
  grid-column: 2;
  grid-row: 3;
  width: 100%;
  min-height: clamp(3.25rem, 6svh, 4rem);            /* §9.2 secondary range */
  justify-content: center;
  padding-inline: clamp(1.25rem, 2.5vw, 2rem);
}


/* ══════════════════════════════════════════════ THE PERCENTAGE — THE HERO
   §4.11 "choosing one important number": the number is display-scale, the
   unit is subordinate and physically attached, and the number is NOT
   wrapped in a generic form card. The field keeps its grey-ring identity
   from 15-identity.css untouched — only its scale changes here (§9.2).
   The number's own width is its container, so the field is sized to the
   digits rather than stretched across the column. */

.percentage-input {
  display: grid;
  grid-auto-flow: column;
  justify-content: start;
  align-items: center;
  column-gap: .16em;
  font-size: var(--pct-size);                        /* the em base for this group */
  line-height: 1;
}
.percentage-input input {
  width: 3.9em;                                      /* fits "50.5" plus the native stepper */
  min-height: var(--pct-h);
  padding: .12em .34em;
  font-size: 1em;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1;
  text-align: center;
}
.percentage-input b {
  font-size: .48em;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.01em;
  color: var(--muted);                               /* attached, but subordinate */
}


/* ═════════════════════════════════════════════════ THE OFFER INVENTORY
   §4.11 "uploading or collecting assets": what has already been added stays
   visible beneath the input surface, and every delete/edit control lives on
   the item it affects. The section header rail is owned globally; only the
   records below it are mine. */

.creator-records .creator-record {
  /* the field runs wider than the text rail so record copy lines up with
     the section heading above it, not 1rem inside it (§4.18). */
  --rec-bleed: var(--sp-16);
}

.creator-record {
  display: grid;
  grid-template-columns:
    minmax(min(13rem, 100%), 18rem)                  /* identity rail */
    minmax(0, 1fr);                                  /* stats + actions */
  column-gap: clamp(1.25rem, 2.6vw, 2.75rem);
  row-gap: var(--group-gap-y);
  align-items: start;
  padding: clamp(1rem, 2.4svh, 1.625rem) var(--rec-bleed, var(--sp-16));
  margin-inline: calc(-1 * var(--rec-bleed, var(--sp-16)));
  border-radius: var(--radius);
}
.creator-record > * { min-width: 0; }

/* §4.8 / brief 7: one alternating field, never twenty dividers. */
.creator-records .creator-record:nth-of-type(even) { background: var(--grey-lightest); }

.creator-record > .creator-main   { grid-column: 1; grid-row: 1 / span 2; }
.creator-record > dl              { grid-column: 2; grid-row: 1; }
.creator-record > .inline-actions { grid-column: 2; grid-row: 2; }

/* ── the identity anchor ────────────────────────────────────────────────
   handle → name → fit note, tight, as one mass. */
.creator-main {
  display: grid;
  gap: var(--sp-4);
  align-content: start;
  min-width: 0;
}
.creator-main span {                                 /* @handle — a label, so it truncates (§9.4) */
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--muted);
}
.creator-main h3 {
  font-size: clamp(1.19rem, 1.12rem + .25vw, 1.4rem);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -.012em;
  color: var(--ink);
}
.creator-main p {
  max-width: 36ch;
  font-size: 0.91rem;
  font-weight: 400;
  line-height: 1.45;
  color: var(--muted);
}

/* ── the stats, ranked ──────────────────────────────────────────────────
   §4.17: five equal cells is a failure to rank. Column 1 carries the two
   consequential values — the percentage the admin set and the founder's
   answer to it. Column 2 carries the context the admin only glances at. */
.creator-record dl {
  display: grid;
  grid-template-columns:
    minmax(min(9rem, 100%), 12rem)                   /* consequence */
    minmax(0, 1fr);                                  /* context */
  column-gap: clamp(1.25rem, 2.4vw, 2.5rem);
  row-gap: var(--sp-12);
  align-items: start;
}
.creator-record dl > div { display: grid; gap: .15rem; min-width: 0; }

.creator-record dl > div:nth-child(2) { grid-column: 1; grid-row: 1; }  /* admin-set percentage */
.creator-record dl > div:nth-child(4) { grid-column: 1; grid-row: 2; }  /* founder response */
.creator-record dl > div:nth-child(1) { grid-column: 2; grid-row: 1; }  /* audience */
.creator-record dl > div:nth-child(3) { grid-column: 2; grid-row: 2; }  /* founder dashboard */
.creator-record dl > div:nth-child(5) { grid-column: 2; grid-row: 3; }  /* final campaign */

.creator-record dt {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  line-height: 1.3;
  color: var(--faint);
}
.creator-record dd {
  font-size: 0.98rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--body);
  overflow-wrap: break-word;                         /* data wraps, it never blows the track (§9.4) */
}

/* the two values the admin came here to read — a second cue on the label
   as well as the value, so the rank survives grayscale (§10.2 test 5). */
.creator-record dl > div:nth-child(2) dt,
.creator-record dl > div:nth-child(4) dt { color: var(--muted); }

.creator-record dl > div:nth-child(2) dd {
  font-size: clamp(1.54rem, 1.288rem + .8vw, 1.96rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.03em;
  color: var(--ink);
}
.creator-record dl > div:nth-child(4) dd {
  font-size: clamp(1.05rem, 1.008rem + .2vw, 1.19rem);
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink);
}

/* ── the record's own tools ─────────────────────────────────────────────
   §4.14 / §4.17: these sit inside the record, on the stats column, directly
   under the percentage that "Edit percentage" edits. Wider column gap than
   the global default so three adjacent text buttons never read as one
   object (§7.1). */
.creator-records .inline-actions {
  gap: var(--sp-4) var(--sp-24);
  justify-content: flex-start;
}


/* ══════════════════════════════════ THE SAME RECORD, LATER AND SETTLED
   §4.12: shared geometry logic, different occupancy. Same identity rail on
   the left, same handle/name/line stack, same alternating field — but one
   row instead of two, a shorter name, a tighter block, and its single
   action parked on the record's own right edge. Its <p> is measured data
   here rather than a written fit note, so it reads as a value, not prose. */

.creator-record.compact {
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: clamp(1rem, 2.4vw, 2.5rem);
  row-gap: var(--sp-8);
  align-items: center;
  padding-block: clamp(.75rem, 1.7svh, 1.125rem);
}
.creator-record.compact > .creator-main   { grid-column: 1; grid-row: 1; }
.creator-record.compact > .inline-actions { grid-column: 2; grid-row: 1; justify-content: flex-end; }

.creator-record.compact .creator-main { gap: .1rem; }
.creator-record.compact .creator-main h3 {
  font-size: clamp(1.12rem, 1.0864rem + .15vw, 1.26rem);
}
.creator-record.compact .creator-main p {
  max-width: none;
  font-size: 0.91rem;
  font-weight: 500;
  color: var(--body);
}


/* ═══════════════════════════════════════════ §8 / §8.3 — 900px: STACKED
   The topology changes because the minimum widths of the identity rail and
   the stats field can no longer both be honoured (§4.22 step 4), not
   because of a device name. The percentage stays the hero and stays welded
   to its Add button: the two share one row for as long as they fit. */

@media (max-width: 900px) {

  .matching-add-form {
    grid-template-columns:
      auto                                           /* the number keeps its natural size */
      minmax(min(12rem, 100%), 1fr);                 /* the button that publishes it */
  }
  .matching-add-form > div              { grid-column: 1 / -1; grid-row: 1; }
  .matching-add-form label:nth-of-type(1) { grid-column: 1 / -1; grid-row: 2; max-width: none; }
  .matching-add-form label:nth-of-type(2) { grid-column: 1;     grid-row: 3; }
  .matching-add-form > button           { grid-column: 2;     grid-row: 3; max-width: 24rem; }

  /* records stack, but the ranking inside them does not flatten */
  .creator-record                   { grid-template-columns: minmax(0, 1fr); }
  .creator-record > .creator-main   { grid-column: 1; grid-row: 1; }
  .creator-record > dl              { grid-column: 1; grid-row: 2; }
  .creator-record > .inline-actions { grid-column: 1; grid-row: 3; }

  .creator-main p { max-width: var(--copy-max); }
}


/* ══════════════════════════════════════════════ §8 — 600px: PHONE POSTURE
   Single column everywhere. The button leaves the number's side but stays
   immediately beneath it at the number's own scale, and the record stats
   fall into one column in rank order: the decision first, then the
   founder's answer, then context (§8.3 — reading order is chosen, not
   inherited from the DOM). */

@media (max-width: 600px) {

  .matching-add-form {
    --pct-h: clamp(3.5rem, 7svh, 4rem);
    grid-template-columns: minmax(0, 1fr);
    padding-inline: var(--sp-16);
  }
  .matching-add-form label:nth-of-type(2) { grid-column: 1; grid-row: 3; }
  .matching-add-form > button {
    grid-column: 1;
    grid-row: 4;
    max-width: 24rem;
    padding-inline: var(--sp-16);
  }

  .creator-records .creator-record { --rec-bleed: var(--sp-12); }
  .creator-record { row-gap: var(--sp-12); }

  .creator-record dl { grid-template-columns: minmax(0, 1fr); row-gap: var(--sp-8); }
  .creator-record dl > div:nth-child(2) { grid-column: 1; grid-row: 1; }
  .creator-record dl > div:nth-child(4) { grid-column: 1; grid-row: 2; }
  .creator-record dl > div:nth-child(1) { grid-column: 1; grid-row: 3; }
  .creator-record dl > div:nth-child(3) { grid-column: 1; grid-row: 4; }
  .creator-record dl > div:nth-child(5) { grid-column: 1; grid-row: 5; }

  .creator-record.compact { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .creator-record.compact > .inline-actions {
    grid-column: 1;
    grid-row: 2;
    justify-content: flex-start;
  }
}



/* ══════ 32-launch-recap.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 32-LAUNCH-RECAP
   The "Ready to launch" stage: `.launch-recap-intro`, the thirteen
   `.recap-group`s, and the grid geometry + internal composition of
   `.recap-table-head` / `.recap-row`, `.recap-editor` and `.recap-access`.

   138 editable rows across 13 subjects. This is the largest screen in the
   product and the one where "easy to read and easy to edit" fight hardest.

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               review the complete shape of a campaign and correct
                       anything wrong before it goes live.
   Dominant object:    the editor column — 138 real editable wells read as one
                       continuous vertical band of white fields down the right
                       of the ledger. Each single `.recap-editor` is the widest
                       and tallest thing in its own row (§4.11 "reviewing or
                       approving": edit belongs directly to the item it edits).
   Supporting object:  the `.launch-recap-intro` evidence band — the four facts
                       that are about to go live (campaign, founder, checkout
                       total, creator count), stated once at display scale so
                       the reader knows what the 138 rows add up to.
   Primary action:     Launch now, in `.actionbar` (owned elsewhere). This
                       section's whole job is to make pressing it safe, so
                       nothing here competes with it for weight or colour.
   Composition thesis: a 74rem dark-green band carrying the four go-live facts
                       at display scale sits above the paragraph that explains
                       it; beneath it the record runs as a narrower single
                       62rem ledger column of thirteen groups, each opening
                       with a heading rail that pins to the top of the viewport
                       while its own rows scroll under it, and each row a
                       full-bleed alternating band whose three tracks rank the
                       work — a 12rem field name, a 3fr editor track holding a
                       `--field-h` well (or a 60ch writing surface) sized to
                       what it actually holds, and a right-rail access stamp at
                       0.75rem — with a section gap between groups and nothing
                       at all between rows but the alternating field.
   Vertical posture:   Scrollable-work (§4.19) — the evidence band is the
                       first meaningful group and it begins immediately under
                       the state strip, fully visible at every QA height; the
                       ~13,000px of record below it scrolls normally (§9.3:
                       this screen is legitimately long and is not compressed
                       to fit a viewport).
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES

   1. THE EDITOR WAS THE SMALLEST THING IN ITS ROW. `.recap-editor` held a 34px
      input or a 70px textarea inside a `1fr auto` grid, so the control that is
      the entire point of the screen was physically smaller than the label
      naming it. It is now the dominant track (3fr against a capped 12rem name
      column) holding a control at the global `--field-h`, and its width states
      what it holds (§4.11, §9.1): a count is 10rem, a chooser 20rem, a value
      fills the track, a prose answer becomes a 60ch writing surface with real
      height. Any `small` hint is attached *beneath* the control it qualifies
      instead of competing beside it (§4.1).

   2. DOZENS OF ROWS WERE A WALL OF GREY LINES. Every row carried its own
      `border-bottom`, so 138 dividers did the work one alternating field
      should do. There is not one row border in this file. Rhythm comes from
      the globally-owned zebra, from a constant row height set by the field
      inside it, and from the four distinct editor widths that break the
      column into a scannable ledger rather than 138 identical slots.

   3. TWELVE GROUPS LOOKED IDENTICAL AND YOU LOST YOUR PLACE. Group separation
      is a full `--section-gap-y` (carried by `.record-groups`, not re-declared
      here) against zero between rows (§4.1), and each group's heading rail is
      sticky: while you are 22 fields deep in "Application and onboarding",
      that rail and its brand hairline stay pinned at the top of the viewport
      with the rows sliding under it. You always know which group you are in
      without having to scroll back.

   4. THE INTRO WAS A COPY BLOCK BESIDE A DEFINITION LIST, SPLIT BY A BLACK
      BORDER, WITH 10px MICRO-CAPS. §4.11 "proof, evidence or result": the
      evidence now comes *before* the explanation (`order` on the `dl`) and is
      physically stronger than it — display-scale figures on the one dark-green
      fill this screen is allowed. Everything below it stays quiet, because a
      screen 13,000px long cannot afford competing colour.

   Field identity — white fill, grey ring at rest, brand focus ring,
   `--field-h`, label typography, the select caret, textarea line-height — is
   owned by 15-identity.css and is NOT re-declared here. So are the row colour,
   the zebra field, the row hover and the header rail. This file owns
   arrangement, geometry and size-in-context only.
   ========================================================================= */


/* ══════════════════════════════════════ THE EVIDENCE BAND (§4.11 §4.19)
   "Proof, evidence, or result: put the evidence before the explanation and
   make the result physically stronger than the copy describing it."

   The DOM has the copy block first and the `dl` second. `order` flips them
   visually; nothing in this section is focusable, so tab order and the
   accessibility tree are untouched (the heading still precedes its facts for a
   screen reader).

   The band is the FIRST meaningful content of the stage and it takes the
   standard measure, while the ledger below is capped at 62rem. That width
   difference is the deliberate, repeatable inset of this screen (§4.18) and it
   is what stops the page reading as one undifferentiated table (§4.12). */

.launch-recap-intro {
  container-type: inline-size;
  container-name: recapintro;
  display: grid;
  row-gap: var(--group-gap-y);
  min-width: 0;

  /* One left rail, two declared right edges (§4.18): the proof band shares the
     standard measure with the stage heading above it and the actionbar below
     it, while the ledger underneath is the narrower 62rem working column. The
     band is a statement; the ledger is work. */
  max-width: min(100%, var(--frame-standard));

  /* `.record-groups` (24-record-system) is a flex column already carrying a
     `--section-gap-y` between every child, so this is the ONLY extra step this
     file adds: proof → work is a change of mode and gets a bigger distance
     than group → group, without doubling a section gap (§4.1 spacing ledger). */
  margin-block-end: var(--block-gap-y);
}

/* ─── the four go-live facts — THE ONE DARK FILL ON THIS SCREEN (§1)
   §1 allows at most one `#013F17` fill per screen, "and only when that element
   is genuinely the hero of the moment". These four values ARE what is about to
   go live; the 138 rows underneath are the detail behind them. Text is
   `--page` for the figure and `--mint` for its legend — the two colours §1
   names for a dark-green section. No border, no second accent, and no colour
   at all below this band. */

.launch-recap-intro > dl {
  order: -1;                                  /* evidence before explanation */
  background: var(--dark);
  border-radius: var(--radius);
  padding-block: var(--block-gap-y);          /* height-driven (§4.5A) */
  padding-inline: var(--chrome-x);            /* width-driven  (§4.5A) */

  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: var(--gutter-x);                /* wide enough that four facts
                                                 read as four, without rules */
  row-gap: var(--group-gap-y);                /* four facts are ONE group: 5×
                                                 the legend→figure gap, no more
                                                 (§4.1) once they wrap 2-up */
}

/* There are exactly four facts, so the band steps 4 → 2 → 1 and never lands on
   three-plus-an-orphan. `auto-fit` cannot promise that: at a 44rem band it
   fits three 11rem tracks and drops the fourth onto a row of its own. Two
   container steps state the intent instead (§4.4 — a composition, not a
   flow). Both are container queries because the band's width is the shell's
   frame, not the viewport (§8.0A). */
@container recapintro (max-width: 52rem) {
  .launch-recap-intro > dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container recapintro (max-width: 30rem) {
  .launch-recap-intro > dl { grid-template-columns: minmax(0, 1fr); }
}
