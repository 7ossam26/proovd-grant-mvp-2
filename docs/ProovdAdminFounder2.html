.launch-recap-intro dl div { min-width: 0; display: grid; row-gap: var(--sp-4); }

/* the legend: sentence case and readable, never a 10px micro-cap (§7.1) */
.launch-recap-intro dt {
  font-size: 0.91rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--mint);
}

/* the figure: display scale, capped on BOTH axes so a wide-but-short window
   cannot push these four lines into the ledger below (§4.20, §9.1) */
.launch-recap-intro dd {
  font-size: clamp(1.68rem, min(1.12rem + 1.4vw, 4.4svh), 2.24rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.03em;
  color: var(--page);
  overflow-wrap: break-word;
}

/* ─── the explanation, deliberately subordinate to the band above it */

.launch-recap-intro > div {
  display: grid;
  row-gap: var(--sp-8);
  max-width: var(--copy-max);                 /* §9.1 grow air, not measure */
  min-width: 0;
}
.launch-recap-intro > div > span {            /* quiet uppercase locator */
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
  line-height: 1.2;
}
.launch-recap-intro h2 {
  font-size: clamp(1.19rem, 1.064rem + .35vw, 1.54rem);
  letter-spacing: -.012em;
}
.launch-recap-intro p {
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.55;
  color: var(--muted);
}


/* ══════════════════════════════════════════════ THE GROUP (§4.1 §4.18 §8.0A)
   Thirteen subjects, one column. The group is the container query context for
   its own rows, so the ledger recomposes against the width it actually has —
   not against the viewport, which is wrong the moment the shell puts anything
   beside it (§8.0A "task-local container queries").

   62rem is the cap for the heading rail, the brand hairline and every row, so
   the hairline is exactly as wide as the rows it heads (§4.14) and a 4K
   monitor grows air on the right rather than stretching a name field across a
   desk (§9.1, §4.13). The evidence band above is uncapped — that contrast is
   the point, and it is the same left rail in both cases (§4.18). */

.recap-group {
  container-type: inline-size;
  container-name: recap;
  max-width: min(100%, 62rem);
  min-width: 0;
}

/* §4.1 — group → group is a SECTION gap; row → row is nothing at all. That
   ratio, not a divider, is what makes thirteen groups legible in one scroll.
   The gap itself is NOT declared here: `.record-groups` is a flex column with
   `row-gap: var(--section-gap-y)` (24-record-system), and re-declaring it as a
   margin would silently double it into a page-transition distance. What this
   file adds to it is the rail's own `padding-block-start` below, which is why
   a boundary optically reads at ~66–96px against §4.1's 64–120px range. */


/* ─── THE HEADING RAIL PINS (§4.11 "the whole shape must be scannable")
   The rail itself — heading, qualifier span, brand hairline and its spacing —
   is the globally-owned section header. Only what is specific to a 12,000px
   screen is set here, scoped to this section: a group of 22 fields is taller
   than any viewport, so its rail sticks to the top of the scrollport and its
   own rows scroll underneath it. You can never be inside a group without
   seeing which group it is.

   `background` is not a colour decision — a sticky element must be opaque or
   the rows show through it. It is the page ground, nothing new. `top` reads a
   variable so that if the shell later pins the topbar it can publish its own
   height as `--recap-rail-top` and this rail lands underneath it.

   `padding-inline` is the one other scoped change: the global rail sets its
   text flush at x=0 while rows and the column head are inset by `--sp-16`.
   Everywhere else in the product that 16px drift is invisible, but here the
   heading is pinned directly above a column of field names for the whole
   length of a group, so it is matched to the rows' rail (§4.18, §9.7). The
   brand hairline is a border and still spans the full group width. */

.recap-group > header {
  position: sticky;
  top: var(--recap-rail-top, 0rem);
  z-index: 1;
  background: var(--page);
  padding-block-start: var(--sp-12);          /* air above the pinned rail */
  padding-inline: var(--sp-16);               /* one left rail with the rows */
}


/* ══════════════════════════════════ ROW GEOMETRY (§4.17 §4.11 §9.2)
   Three tracks, ranked by consequence, not distributed evenly:

     name    minmax(7rem, 12rem)   — capped. The longest field name in the
                                     record is 26 characters; past 12rem this
                                     column is only stealing width from the
                                     work.
     editor  minmax(16rem, 3fr)    — the dominant track. Flexible with a 3:1
                                     bias so that on a constrained laptop the
                                     free space goes to the control and not to
                                     the label (grid's "maximize tracks" step
                                     would otherwise split it evenly).
     access  minmax(6rem, 1fr)     — reference. Takes the remainder and pins
                                     its text to the group's right rail.

   `--col-gap` between them is width-driven; there is deliberately no row gap,
   because contiguous bands are what make the alternating field read as
   alternation rather than as a stack of cards (§4.2).

   The head and the rows share one template so the column labels sit exactly
   over the columns they name; the head's inline padding is already `--sp-16`
   globally, matching the row's. */

.recap-table-head,
.recap-row {
  grid-template-columns:
    minmax(7rem, 12rem)
    minmax(min(16rem, 100%), 3fr)
    minmax(6rem, 1fr);
  column-gap: var(--col-gap);
}

.recap-table-head > span:last-child { justify-self: end; text-align: end; }

/* Row padding is tightened on the block axis only. The field inside sets the
   row's height (`--field-h` ≈ 3–3.5rem), so `--sp-12` gives a ~4.75rem band:
   comfortable, and honest about the fact that 138 of them have to be walked
   through. Inline padding stays at the global `--sp-16` so the name column
   keeps the same left rail as the hairline above it. */
.recap-row {
  padding-block: var(--sp-12);
  padding-inline: var(--sp-16);
  cursor: text;                 /* the whole row is a <label>: clicking the
                                   name or the access stamp focuses the field.
                                   Saying so is the cheapest way to make
                                   "every row is editable" legible (§4.11). */
}
.recap-row:has(select) { cursor: pointer; }

.recap-row > strong { line-height: 1.35; overflow-wrap: break-word; }

/* A prose row is three times the height of a value row, so its name and its
   access stamp align to the top of the writing surface instead of floating at
   its optical centre. `--sp-12` matches the textarea's own block padding, which
   lands the name on the surface's first line (§9.7). */
.recap-row:has(textarea) { align-items: start; }
.recap-row:has(textarea) > strong,
.recap-row:has(textarea) > .recap-access { padding-block-start: var(--sp-12); }


/* ═══════════════════════════════════ THE EDITOR (§4.17 §4.11 §9.2)
   "Importance = physical control area", and "a local control inherits scale
   from the object it manipulates". The object here is a campaign about to go
   live; its controls are not 34px slots.

   The wrapper is a one-column grid so that a `small` qualifier attaches
   BENEATH the control it qualifies rather than beside it — a hint that sits in
   its own column competes with the value for the row's width and reads as a
   second value (§4.1: supporting text belongs to its control). */

.recap-editor {
  display: grid;
  row-gap: var(--sp-8);
  align-content: start;
  justify-items: start;      /* the controls carry `width:100%` from identity;
                                a hint shrinks to its own text instead */
  min-width: 0;
}
.recap-editor small { max-width: min(100%, 52ch); }

/* ─── WIDTH STATES CONTENT SHAPE (§4.11 §9.1)
   The single most effective thing that can be done about 138 rows: stop making
   every control the same width. A column of identical slots is a wall; a
   column whose widths say "count", "chooser", "value", "paragraph" is a ledger
   you can scan without reading. Four shapes, all inside the same track, all
   still at least `--field-h` and well over the 44px floor (§9.2). */

/* a count is the narrowest thing in the record — it must look like one */
.recap-editor input[type="number"] {
  max-width: min(100%, 10rem);
  padding-inline: var(--sp-16) var(--sp-8);   /* room for the native stepper */
}

/* a chooser is sized to hold its longest option without truncating it */
.recap-editor select { max-width: min(100%, 20rem); }

/* a stored value fills the track, capped so an email does not become a rule
   across a wide monitor. Long editable data scrolls inside the field rather
   than truncating — it is being edited, not labelled (§9.4). */
.recap-editor input[type="text"] { max-width: min(100%, 30rem); }

/* THE WRITING SURFACE (§4.11 "writing a substantial answer")
   The problem statement, the founder story, the FAQ answers and the reward
   descriptions are prose, and they get a reading measure and real height
   instead of a single-line input stretched across the viewport. Height answers
   to viewport height, never width (§4.5A). The global `min-height: 8rem` is
   reduced in context (§9.2): eighteen empty 8rem boxes on one page is a dead
   zone (§10.2/18); ~4 lines is a writing surface. */
.recap-editor textarea {
  min-height: clamp(5.5rem, 12svh, 8rem);
  max-width: min(100%, 60ch);
}


/* ═════════════════════════════════ ACCESS — PROVENANCE, REFERENCE GRADE
   (§4.17 rank, §7.2A a treatment must earn its place by meaning)

   All 138 of these read "Admin can edit". It is a permission stamp, not a
   value, and it was previously weighted the same as the value it describes.
   It is ranked below both the value and the editor by four independent means —
   quarter the type scale of the control, `--faint` against the value's
   `--body`, no ground of its own against the field's white well, and pinned to
   the group's right rail away from the work — while staying on the same
   alternating band as its row, which is where "findable" comes from. It is
   deliberately NOT uppercase micro-caps: that is the column rail's typography
   and repeating it 138 times would make a second header out of metadata. */

.recap-access {
  font-size: 0.84rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--faint);
  justify-self: end;
  text-align: end;
  min-width: 0;
}


/* ═══════════════════════════════════════ RESPONSIVE (§8 §8.3 §4.22)
   Recompose, never shrink. The reflow order below is §4.22 exactly:

   1. Above ~52rem of GROUP width every track is at its cap and the remainder
      becomes air in the access column — nothing changes, and nothing needs a
      query to make it not change.
   2. From ~52rem down the flexible editor track narrows first and the access
      column falls to its 6rem minimum, entirely intrinsically.
   3. At 42rem the editor can no longer hold 16rem beside a name and a stamp,
      so the topology changes rather than the type size.

   The threshold is a CONTAINER query, not a viewport one: the ledger has to
   stack when the ledger is narrow, which on a 1024px screen with a sidebar
   happens well before any viewport breakpoint would fire. */

@container recap (max-width: 42rem) {

  /* The column rail is the one thing on this screen allowed to disappear:
     once each row carries its own name and stamp on its own line, "Field /
     Current value / Access" is genuinely redundant — the DOM already marks it
     `aria-hidden`. Nothing else is ever hidden. */
  .recap-table-head { display: none; }

  /* Stacked posture: the name leads, the access stamp closes the same line at
     the trailing edge, and the editor takes the full width directly beneath
     its own name. The control never detaches from the value it edits (§8.3),
     and it is still the largest object in the row at every width. */
  .recap-row {
    grid-template-columns: minmax(0, 1fr) auto;
    row-gap: var(--sp-8);
    align-items: baseline;
  }
  /* rows are explicit, not auto-placed: the editor precedes the access stamp
     in the DOM, so sparse auto-placement would push the stamp to a third line */
  .recap-row > strong      { grid-column: 1;      grid-row: 1; }
  .recap-row .recap-access { grid-column: 2;      grid-row: 1; }
  .recap-row .recap-editor { grid-column: 1 / -1; grid-row: 2; }

  /* the prose exception above is not needed once everything is stacked */
  .recap-row:has(textarea) { align-items: baseline; }
  .recap-row:has(textarea) > strong,
  .recap-row:has(textarea) > .recap-access { padding-block-start: 0; }

  /* a count and a chooser keep their shape; only the value field is released
     to the full width, because at this size the width IS the measure */
  .recap-editor input[type="text"] { max-width: 100%; }
}

/* §4.9 — the phone keeps the rhythm, it does not lose it. The evidence band
   relaxes its inset so the four facts keep their measure, and the ledger's
   inline padding tightens by one step so the name column keeps its width.
   Nothing is dropped and nothing is scaled down globally (§4.22, §10.1). */
@media (max-width: 600px) {
  .launch-recap-intro > dl { padding-inline: var(--sp-16); }
  .recap-row,
  .recap-group > header { padding-inline: var(--sp-12); }   /* one rail, still */
}



/* ══════ 34-live-control.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 34-LIVE-CONTROL
   The Live stage control centre: `.live-control-center` (the container),
   `.live-kpis` (six campaign numbers), `.live-controls` (the campaign rail)
   and `.request-center` (the Founder-request queue).

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               see what the live campaign is doing right now, and clear
                       the Founder requests that are waiting on a decision.
   Dominant object:    the live Backer count — the one number on this screen the
                       admin did not set and that is still moving. It is the only
                       object wearing the §5.5 liveness container.
   Supporting object:  the five quiet campaign facts arranged around it as three
                       ideas — money against goal, headroom, horizon — and, below
                       them, the campaign rail that says what state the public
                       campaign is in and carries the controls over it.
   Primary action:     per request, "Approve and publish" / "Approve" — the one
                       filled control on each record, sitting on that record.
                       The section itself has no stage-level progression action.
   Composition thesis: a bordered brand-tinted block holding the live count owns
                       the left 1.4fr of a four-column numeric field and stands
                       two rows tall; the money-against-goal pair stacks in
                       column two, the limit-and-exception pair in column three,
                       and the closing date runs the full height of column four
                       as a top-aligned horizon; directly beneath, a single
                       low grey rail carries the campaign state line at its left
                       edge, three routine controls beside it and the two
                       campaign-stopping controls alone at the far right; a full
                       section gap below that, the request queue drops to a 64rem
                       measure where each request is a two-column record — subject
                       and detail on the left at reading measure, its state tag
                       pinned to the top of the right column and its four actions
                       anchored to the bottom of the same column.
   Vertical posture:   Scrollable-work (this section lives inside a long stage).
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES
   1. Six KPIs in `repeat(3, 1fr)` of 88px bordered cells gave six numbers the
      same weight, so the one live number on the screen read as a table cell.
      They are now ranked into four ideas across four fluid columns with one
      display-scale hero; only that hero is a container, and it is a container
      because it is the only thing that is actually live (§4.17, §5.6, §5.5).
   2. Five identical grey-bordered buttons made "Preview as Backer" and "End
      early" the same object. Identity already made all five quiet tertiary
      text controls, so ranking here is done with position and space only: the
      three routine controls sit against the campaign state line they inspect,
      and the two that stop a live fundraise are pushed alone to the opposite
      end of the rail. No red is invented and no colour is re-declared (§4.17,
      §5.7.2, §10.1).
   3. Every request was a `1fr 140px auto` strip closed by a `border-bottom`.
      Requests are now records: subject first at heading scale, detail at a
      bounded measure, state tag at the top of a decision column and the four
      actions anchored to the bottom of that same column, with the quiet trio
      separated from the one filled commitment by an auto gap (§4.14, §4.16).
      Not one divider anywhere in this file (§4.8).

   BRAND BUDGET (§1, §7.2A) — three spends, each a different object:
     · the live Backer block — full liveness container (5% fill + brand border);
     · the request that needs the admin now — leading edge only, the identity
       layer's existing `.record-row.action` language, one side, not a box;
     · the `.primary` approve control on each record — owned by 15-identity.
   Nothing else in this file is coloured. Remove all colour and the ranking is
   still carried by scale, field, edge weight and space (§10.2 test 8).
   ========================================================================= */


/* ═══════════════════════════════════ THE CONTAINER (§4.1 §4.8)
   `.live-control-center` wraps this section AND two sections owned elsewhere,
   so it is deliberately not a grid: it stays a plain block box and each child
   carries its own vertical margin. Adjacent margins then collapse to the
   larger of the two, which lets the neighbouring files set their own rhythm
   without fighting a container gap. The old `border-top` wall is gone (§4.8). */

.live-control-center {
  min-width: 0;
  margin-block-start: var(--block-gap-y);
}


/* ═════════════════════════════════════════════ THE NUMBERS (§4.11 §4.17 §5.6)
   Rhythm: dense / numeric. Six facts, four ideas, one hero.

     col 1  the live count            — who is in the campaign right now
     col 2  reserved over goal        — money against the target it beat
     col 3  limit over cancellations  — what bounds the campaign, what subtracts
     col 4  campaign closes           — the horizon

   Base posture is intrinsic: the hero takes a full-width band and the five
   quiet facts flow into as many columns as their 9.5rem minimum allows, so a
   360px phone gets two and an 820px tablet gets four with no breakpoint at all
   (§8.0A). Only the four-column composition needs a real topology change. */

.live-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(9.5rem, 100%), 1fr));
  /* horizontal gap answers to width, vertical gap to height (§4.5A) */
  column-gap: clamp(var(--sp-16), 2.4vw, var(--sp-40));
  row-gap: clamp(var(--sp-16), 2.6svh, var(--sp-32));
  align-items: start;
  width: 100%;
  min-width: 0;
  /* a numeric strip may run wide; past this the extra width becomes air (§9.1) */
  max-width: min(100%, 76rem);
}

.live-kpis article {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
}

/* ── the five quiet facts — they sit directly on the page, no box (§4.2) ── */

/* the label is a locator, not a field label: it uses the system kicker voice
   (`.pv-kicker` / `.pv-thead`) so the value is the only readable thing (§5.6) */
.live-kpis article:not(.primary) > span {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}

.live-kpis article:not(.primary) > strong {
  font-size: clamp(1.19rem, 1.12rem + .35vw, 1.47rem);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.02em;
  color: var(--ink);
  overflow-wrap: break-word;   /* "$18,400 / $50,000" folds at its own space */
}

.live-kpis article:not(.primary) > small {
  margin-block-start: var(--sp-4);
  font-size: 0.84rem;
  font-weight: 400;
  line-height: 1.4;
  color: var(--muted);
  max-width: 30ch;
}

/* ── ranking inside the whisper (§4.17) — these six are not six equal facts ──
   2 reserved  · the money, so it is the largest of the quiet values
   3 goal      · the denominator of 2; the value recedes and its own note,
                 which is the actual ratio, carries the weight instead
   4 limit     · headroom; the percentage note is the point, not the pair
   5 cancels   · the exception to the hero count, and reads as one
   6 closes    · the horizon; slightly larger, with a readable time  */

.live-kpis article:nth-of-type(2) > strong {
  font-size: clamp(1.33rem, 1.232rem + .5vw, 1.68rem);
}

.live-kpis article:nth-of-type(3) > strong {
  font-size: clamp(1.12rem, 1.064rem + .2vw, 1.26rem);
  font-weight: 600;
  color: var(--muted);
}

.live-kpis article:nth-of-type(3) > small,
.live-kpis article:nth-of-type(4) > small,
.live-kpis article:nth-of-type(6) > small {
  font-weight: 600;
  color: var(--body);
}

.live-kpis article:nth-of-type(6) > strong {
  font-size: clamp(1.26rem, 1.176rem + .4vw, 1.54rem);
}

/* ── the hero: the one live number (§5.5 §5.6 §4.11 "the thing happening now")
   `.primary` on an <article> is currently caught by 15-identity's unscoped
   `.primary` button rule, so every button property it sets is reset here
   before the container treatment is applied. See the report. */

.live-kpis article.primary {
  grid-column: 1 / -1;

  /* reset of the inherited button identity */
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: flex-start;
  min-height: 0;
  white-space: normal;
  text-align: left;
  font-size: 1.12rem;
  font-weight: 400;
  letter-spacing: normal;
  line-height: 1.5;

  /* §5.5 the one consistent liveness look: 5% brand fill + brand border */
  background: var(--brand-5);
  border: var(--bw) solid var(--brand);
  border-radius: var(--radius);
  color: var(--body);

  column-gap: clamp(var(--sp-16), 2vw, var(--sp-32));
  row-gap: var(--sp-8);
  padding: clamp(var(--sp-16), 2.4svh, var(--sp-32))
           clamp(var(--sp-16), 2.2vw, var(--sp-32));
}

/* Collision lock, not a hover effect: 15-identity's `.primary:hover` and its
   `html.no-motion` twin would blank this fill and turn the copy brand-green on
   pointer-over. The static state is simply held (§6 — no motion authored here). */
.live-kpis article.primary:hover,
html.no-motion .live-kpis article.primary:hover {
  background-color: var(--brand-5);
  color: var(--body);
}

.live-kpis article.primary > span {
  display: inline-flex;
  align-items: center;
  gap: .5em;
  flex: 0 0 auto;
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--muted);
}

/* the live mark — the same square the identity layer gives `.status-tag.action`,
   so "this is live" wears one shape across the product (§5.5, §7.1) */
.live-kpis article.primary > span::before {
  content: "";
  flex: none;
  width: .45em;
  height: .45em;
  background: var(--brand);
}

/* display scale, capped on BOTH axes so a short wide monitor cannot grow it
   into the stage h1's territory — the h1 stays the moment's one display
   element, this is the section's (§4.5A, §5.6, §9.1) */
.live-kpis article.primary > strong {
  flex: 0 0 auto;
  font-size: clamp(2.24rem, min(3.6vw, 5svh), 3.22rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.03em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.live-kpis article.primary > small {
  flex: 1 1 18rem;
  min-width: 0;
  font-size: 0.91rem;
  font-weight: 400;
  line-height: 1.45;
  color: var(--muted);
  max-width: 38ch;
}

/* ── four-column composition (§4.4 §4.12) ──────────────────────────────────
   The topology genuinely changes here: the hero stops being a band and becomes
   a two-row block, the money pair and the limit/exception pair stack into their
   own columns, and the closing date becomes a full-height right-hand column.
   Below this width the intrinsic base posture above already handles every
   size continuously, so this is the file's only structural query (§8.0A). */

@media (min-width: 62rem) {
  .live-kpis {
    grid-template-columns:
      minmax(0, 1.4fr)    /* the live count            */
      minmax(0, 1fr)      /* reserved over goal        */
      minmax(0, 1.05fr)   /* limit over cancellations  */
      minmax(0, .85fr);   /* the horizon               */
    grid-template-rows: auto auto;
    row-gap: clamp(var(--sp-12), 2svh, var(--sp-24));
  }

  .live-kpis article.primary        { grid-area: 1 / 1 / 3 / 2; }
  .live-kpis article:nth-of-type(2) { grid-area: 1 / 2 / 2 / 3; }
  .live-kpis article:nth-of-type(3) { grid-area: 2 / 2 / 3 / 3; }
  .live-kpis article:nth-of-type(4) { grid-area: 1 / 3 / 2 / 4; }
  .live-kpis article:nth-of-type(5) { grid-area: 2 / 3 / 3 / 4; }
  .live-kpis article:nth-of-type(6) { grid-area: 1 / 4 / 3 / 5; }

  /* as a two-row block the hero stacks: label, number, then a deliberate field
     of air, then the note settled on the floor of the block (§4.13) */
  .live-kpis article.primary {
    flex-direction: column;
    align-items: flex-start;
    row-gap: var(--sp-8);
    padding: clamp(var(--sp-24), 3.4svh, var(--sp-40))
             clamp(var(--sp-24), 2.4vw, var(--sp-40));
  }
  .live-kpis article.primary > strong { margin-block-start: var(--sp-4); }
  .live-kpis article.primary > small  { margin-block-start: auto; flex: 0 0 auto; }
}


/* ═══════════════════════════════════════════ THE CAMPAIGN RAIL (§4.7 §4.17)
   Rhythm: quiet / linear — one low horizontal band, deliberately the flattest
   object in the section so it cannot be mistaken for a KPI tile or a request.
   The grey field is the grouping tool, not a border: it says "these controls
   act on this campaign" (§4.8 step 4). It is tied tight to the numbers above
   it because it reports the same object; the queue below it gets a full
   section gap because it is different work (§4.1). */

.live-controls {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  column-gap: clamp(var(--sp-24), 3vw, var(--sp-48));
  row-gap: var(--sp-16);
  width: 100%;
  min-width: 0;
  max-width: min(100%, 76rem);       /* shares the KPI rail (§4.18) */
  background: var(--grey-lightest);
  border-radius: var(--radius);
  padding: clamp(var(--sp-12), 2.2svh, var(--sp-24))
           clamp(var(--sp-16), 2vw, var(--sp-24));
  margin-block-start: var(--group-gap-y);
  margin-block-end: var(--section-gap-y);
}

.live-controls > div:first-child {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  flex: 0 1 auto;
  min-width: 0;
}

.live-controls > div:first-child strong {
  font-size: clamp(1.05rem, 1.008rem + .15vw, 1.19rem);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -.008em;
  color: var(--ink);
}

.live-controls > div:first-child span {
  font-size: 0.84rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--muted);
}

/* the five controls. 15-identity already made every one of them a quiet tier-3
   text control, so nothing here touches colour, border, background, weight or
   size — the ranking is entirely positional (§10.1 "gives every action the same
   size, fill, tier"). */
.live-controls > div:last-child {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
  column-gap: clamp(var(--sp-16), 1.8vw, var(--sp-24));
  row-gap: var(--sp-4);
}

/* Pause (4) and End early (5) stop a live fundraise. They are cut away from the
   three routine controls by an auto gap and left alone at the far edge of the
   rail, where nothing else lives; on a wrapped rail they take the trailing line
   to themselves for the same reason (§4.7, §4.17). */
.live-controls > div:last-child > button:nth-child(4) {
  margin-inline-start: auto;
}


/* ═══════════════════════════════════════════ THE REQUEST QUEUE (§4.14 §4.16)
   Rhythm: open / decisional — this is the actual work, so it is the least
   dense thing on the screen. The measure drops well inside the KPI rail so a
   request never reads as another row of the data strip (§4.12, §9.1). */

.request-center {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
  max-width: min(100%, 64rem);
  margin-block-end: var(--section-gap-y);
}

/* the header rail already carries the section's one brand hairline and a
   16px lead-out; a little more air separates the rule from the first record */
.request-center > article:first-of-type { margin-block-start: var(--sp-8); }
.request-center > article + article     { margin-block-start: var(--group-gap-y); }

/* ── the record. Base posture is the stacked one: state first so the admin
   knows what they are looking at before they read it, then subject, detail,
   provenance, then the actions still attached to the record (§8.3). */

.request-center article {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--sp-16);
  align-items: start;
  min-width: 0;
  border-radius: var(--radius);
  padding: clamp(var(--sp-16), 2.4svh, var(--sp-24))
           clamp(var(--sp-16), 2vw, var(--sp-32));
}

.request-center article > div:first-child {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--sp-4);
  min-width: 0;
}

/* the category locator whispers; the subject is what reads first */
.request-center article > div:first-child > span:first-child {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}

.request-center article h3 {
  margin-block-start: var(--sp-4);
  font-size: clamp(1.19rem, 1.12rem + .3vw, 1.4rem);
  font-weight: 700;
  line-height: 1.28;
  letter-spacing: -.01em;
  color: var(--ink);
}

/* the detail is the thing the decision is made on, so it is real running text
   at a bounded measure — not micro-copy (§9.1) */
.request-center article p {
  margin-block-start: var(--sp-4);
  font-size: 0.98rem;
  font-weight: 400;
  line-height: 1.55;
  color: var(--body);
  max-width: var(--copy-max);
}

.request-center article small {
  margin-block-start: var(--sp-8);
  font-size: 0.84rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--muted);
}

/* stacked posture: the state reads before the subject */
.request-center article > .status-tag {
  order: -1;
  justify-self: start;
  align-self: start;
}

/* the four actions sit on the record they act on. 15-identity already ranks
   them — three quiet tier-3 text controls and one filled brand commitment —
   so the only job here is to hold the commitment apart from the trio with an
   auto gap and give it real area (§9.2 P sizing, §4.17). */
.request-center .inline-actions {
  justify-content: flex-start;
  column-gap: clamp(var(--sp-16), 1.8vw, var(--sp-24));
  row-gap: var(--sp-8);
}

.request-center .inline-actions > .primary {
  margin-inline-start: auto;
  min-height: var(--ctl-h);
  padding-inline: clamp(var(--sp-24), 2.4vw, var(--sp-40));
}

/* ── state: two independent cues that survive grayscale (§4.16) ─────────────
   1. the leading edge — 2px brand on the request that needs the admin now,
      1px sage on the one merely waiting. This is the identity layer's existing
      `.record-row.action` / `.record-row.waiting` language, applied to a record
      instead of a row: one side, never a box, so it cannot be confused with the
      hero's closed liveness container above.
   2. physical area — the request that needs a decision is taller and more
      generously padded than the one that does not (§4.17).
   The tag textures (brand ring vs filled sage) are a third, already global.
   Field tint is deliberately NOT one of the two cues: brand-5 and
   grey-lightest are near-identical in luminance and would fail the test. */

.request-center article:has(.status-tag.action) {
  background: var(--brand-5);
  border-inline-start: var(--bw) solid var(--brand);
  padding-block: clamp(var(--sp-24), 3.2svh, var(--sp-32));
  padding-inline-start: calc(clamp(var(--sp-16), 2vw, var(--sp-32)) - var(--bw));
}

.request-center article:has(.status-tag.waiting) {
  background: var(--grey-lightest);
  border-inline-start: var(--hair) solid var(--sage);
  padding-inline-start: calc(clamp(var(--sp-16), 2vw, var(--sp-32)) - var(--hair));
}

/* ── the two-column record (§4.14) ─────────────────────────────────────────
   Above the structural line the record splits: subject and detail hold the
   left measure; the right column is the decision column — state pinned to its
   top so it is read alongside the subject, actions anchored to its floor so
   they are unambiguously attached to this request and nothing else. */

@media (min-width: 48rem) {
  .request-center article {
    grid-template-columns: minmax(0, 1.35fr) minmax(min(20rem, 100%), .95fr);
    column-gap: clamp(var(--sp-24), 3vw, var(--sp-48));
  }

  .request-center article > div:first-child { grid-area: 1 / 1 / 3 / 2; }

  .request-center article > .status-tag {
    order: 0;
    grid-area: 1 / 2 / 2 / 3;
    justify-self: end;
  }

  .request-center article > .inline-actions {
    grid-area: 2 / 2 / 3 / 3;
    align-self: end;
    justify-content: flex-end;
  }
}



/* ══════ 36-live-posts.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 36-LIVE-POSTS
   The Creator post review on the Live stage: `.creator-post-section` and the
   two captured posts inside it — one Instagram still awaiting a decision, one
   TikTok video already live.

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               judge a Creator's captured post and decide whether it
                       goes live.
   Dominant object:    the captured post itself — account row, media and caption
                       read as one white artifact standing at the true aspect
                       ratio of the platform it was captured from.
   Supporting object:  the review panel beside it — who and where, the three
                       pieces of evidence the decision rests on (submitted,
                       tracking, disclosure), and the link out to the original.
   Primary action:     "Approve and mark live", and only on the post that still
                       needs a decision; the settled post carries no commitment.
   Composition thesis: the two posts stop being a 2×2 grid of half-cards and
                       stack as full-measure records; inside each record the
                       captured post holds a portrait column on the left at its
                       own platform ratio — 4:5 for the Instagram still, 9:16
                       for the vertical video — and the review panel runs down
                       the remaining width as one packed column: name, then a
                       quiet evidence band of three labelled facts, then the way
                       out to the original, then a deliberate break, then the
                       decision row, whose one filled commitment is pushed to
                       the far end of the record.
   Vertical posture:   Scrollable-work (this section lives inside a long stage).
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES

   1. THE PLACEHOLDER SYSTEM WAS NOT IMPLEMENTED (§1, §10.1, §10.2 test 19).
      `.post-preview-media` was a `linear-gradient` ramp — banned outright — with
      the copy printed over it, and `.post-avatar` was a 28px grey circle holding
      an initial letter, which §1 names explicitly as not a Proovd placeholder.
      Both are now the real primitive: one outer rectangle in `--ph-o` with one
      smaller inner rectangle in `--ph-i`, visibly inset, radius `--radius`,
      colours taken only from the pairs `10-foundation.css` ships. The avatar is
      square because it stands for a profile picture; each media placeholder
      carries the aspect ratio of the thing that is actually missing, so nothing
      is cropped to make a card shape (§9.4). Not one descriptive word sits on
      the coloured geometry: `Image post · 1080 × 1350`, `STILLDAY`, `00:31` and
      the on-image line are real content and stay fully visible, arranged on the
      white preview surface beneath the placeholder where §1 puts labels. Only
      the `▶` stays on the rectangle, in its margin band — a decorative mark, not
      a word, and the thing that says "video" on a real thumbnail.

   2. THE PREVIEW WAS HALF A CARD. `1fr 1fr` split by a `border-right`, in a
      two-up grid, gave the object under judgment about a quarter of the section.
      The grid is now one column of full-measure records, and inside a record the
      post owns a portrait column while the panel supports it (§4.17, §4.11
      "the whole shape of what is being reviewed must be scannable").

   3. `.needs-review` WAS A 5% TINT AND NOTHING ELSE (§4.16 — never enough).
      See the state block below: the post awaiting a decision wears a real brand
      boundary on the object itself, a ring-and-dot state chip, and it is the
      only record ending in a filled commitment. The settled post recedes onto a
      quiet field and ends in one bare text control. Three independent cues, all
      of which survive with the pointer elsewhere and in grayscale.

   4. THE RECORDS ARE NOT CARDS. Nothing here is boxed. Records are separated by
      a large field of space and grouped by alignment, which is §4.8's order —
      proximity, alignment, typography, background, and only then a border.

   BRAND BUDGET (§1, §7.2A) — two spends, both on the undecided post:
     · the boundary around the captured post that still needs a decision —
       §7.1's "container that truly needs a border", attached to the object
       rather than to the card, so it does not restate the leading-edge mark
       `34-live-control.css` already uses on the request queue above;
     · its state chip and its one `.primary`, both owned by `15-identity.css`.
   No brand-tinted panel, no leading edge, no second container — the KPI hero,
   the attention line and the request queue already spend that budget on this
   screen. Everything else here is the placeholder primitive, one
   `--grey-lightest` evidence band per record, type scale and space. Remove all
   colour and the ranking still stands on object size, boundary presence, chip
   texture and control area (§10.2 test 8).
   ========================================================================= */


/* ═══════════════════════════════════════════════ THE SECTION (§4.18 §4.1)
   Shares the 64rem rail the request queue above it uses, so the two decision
   queues on this stage sit on one alignment line and the extra width on a wide
   monitor becomes air rather than a longer record (§9.1, §10.2 test 17).
   The old `border-top` wall is gone; the header rail's brand hairline is the
   section's only divider (§4.8). */

.creator-post-section {
  width: 100%;
  min-width: 0;
  max-width: min(100%, 64rem);
  margin-block-start: var(--section-gap-y);
  margin-block-end: var(--section-gap-y);
}

/* One column, always. Two posts side by side would halve the object under
   judgment again, and comparison is not the task here — deciding is (§4.11).
   The two records are separated by a real field of space rather than by cards,
   borders or dividers, which is §4.8's grouping order taken at its word. */
.creator-post-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: clamp(var(--sp-32), 5svh, var(--sp-64));
  min-width: 0;
  margin-block-start: var(--sp-16);
}


/* ═════════════════════════════════════════ THE RECORD (§4.14 §4.17 §8.3)
   Base posture is stacked: the post first, then the panel that judges it, tied
   together by a group gap so the decision never floats away from its object.
   Each card declares the geometry of its own missing asset — the placeholder
   pair and the width the portrait column wants — and both children read it.

   A record is not a card: it has no box, no border and no field of its own, so
   both records attach directly to the section rail the header sits on and
   nothing drifts onto a private grid (§10.2 test 17). */

.creator-post-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--group-gap-y);
  column-gap: clamp(var(--sp-24), 3vw, var(--sp-48));
  align-items: start;
  min-width: 0;
}

/* §1 placeholder pairs — one family per card so the two missing assets never
   read as one duplicated file. Pair 2 (--leaf / --dark) for the Instagram post,
   pair 13 (--sky / --dark) for the TikTok post; the Instagram avatar drops to
   pair 1 (--leaf / --sage) so the small square does not compete with the large
   one beneath it. No pair here spends brand — brand is state, not decoration.

   `--preview-w` is also declared per card, because a 9:16 column is much taller
   than a 4:5 column of the same width. The two widths are chosen so the two
   records end up roughly the same physical height: without that the settled
   post would be the largest object in the section and the hierarchy would read
   backwards (§4.17). They are percentages of the record, not of the viewport,
   because the section is width-capped — past about 1100px the window keeps
   growing and the record does not, so a `vw` formula would stop responding to
   the thing the object actually lives in (§8.0A, §9.5).

   This is the file's one declared breakout from a single shared rail: the two
   records split their columns at different points, because a vertical video and
   a 4:5 still genuinely do not occupy the same footprint. Both records still
   start on the section's left rail and both action rows finish on its right
   rail, so nothing drifts (§4.18, §10.2 test 17). */
.creator-post-card:has(.post-preview-media.image) {
  --ph-o: var(--leaf);
  --ph-i: var(--dark);
  --preview-w: clamp(13rem, 26%, 18rem);    /* the side-by-side column */
  --preview-max: 22rem;                     /* the cap once the record stacks */
}
.creator-post-card:has(.post-preview-media.video) {
  --ph-o: var(--sky);
  --ph-i: var(--dark);
  --preview-w: clamp(11rem, 21%, 14rem);
  --preview-max: 17rem;
}
.creator-post-card:has(.post-preview-media.image) .post-avatar { --ph-i: var(--sage); }

/* ── the 900px structural line (§8): the post takes a fixed portrait column and
   the panel takes everything left over. Below it the record stacks and the post
   stays the dominant object because the panel's own content is measure-capped
   while the post keeps its full width (§8.3). */
@media (min-width: 56.25rem) {
  .creator-post-card {
    grid-template-columns: minmax(0, var(--preview-w)) minmax(min(19rem, 100%), 1fr);
  }
  /* the track now owns the width; the stacked cap steps aside */
  .creator-post-card .post-preview { max-inline-size: 100%; }
}


/* ══════════════════════════ STATE — three cues, all grayscale-safe (§4.16)
   1. THE OBJECT CARRIES A BOUNDARY. The post that still needs a decision is the
      only thing in this section wearing a real container border (§7.1); the
      settled post has none. Presence-versus-absence of a 2px ring survives
      grayscale — brand green desaturates to a clearly visible mid-light grey
      against the page, and the eye reads "there is an edge here", not a hue.
   2. CONTROL WEIGHT AND AREA. The undecided record ends in a filled commitment
      roughly 14rem wide; the settled one ends in one bare text control. A solid
      block against loose text is the most tone-independent cue available
      (§4.17, §10.2 test 5).
   3. CHIP TEXTURE. Ring-plus-dot against flat fill — the identity layer's own
      state language, reused rather than reinvented (§7.1).
   The field tints are reinforcement only, never evidence: `--grey-lightest`
   against `--pure` is almost nothing once colour is removed, which is precisely
   why §10.1 forbids a tint from carrying a decision by itself.

   The settled post also recedes onto a quiet field instead of the white capture
   surface — an archived capture rather than a live one. */
.creator-post-card:not(.needs-review) .post-preview {
  background: var(--grey-lightest);
}


/* ═══════════════════════════════════ THE CAPTURED POST (§4.11 §4.15 §9.4)
   A white artifact standing on the record: account row, media, caption. The
   transparent border on the base rule keeps both posts dimensionally identical
   so the brand boundary on the undecided one adds emphasis, not a size shift. */

.post-preview {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--sp-12);
  align-content: start;
  min-width: 0;
  inline-size: 100%;
  /* stacked, the post takes the record's width up to its own cap — it must not
     inherit the narrow side-by-side column and shrink to a thumbnail on a phone
     while the panel beside it runs full bleed (§8.3) */
  max-inline-size: var(--preview-max);
  background: var(--pure);
  border: var(--bw) solid transparent;
  border-radius: var(--radius);
  padding: var(--sp-12);
}

.creator-post-card.needs-review .post-preview {
  border-color: var(--brand);
}

/* ── the account row ────────────────────────────────────────────────────── */

.post-preview-account {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  min-width: 0;
}
.post-preview-account > div {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-width: 0;
}
.post-preview-account strong {
  font-size: 0.98rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.008em;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the handle and the platform name — §4.15: the platform is named in real text,
   so no fake logo is invented in CSS; the geometry below carries the rest */
.post-preview-account small {
  font-size: 0.91rem;
  font-weight: 500;
  line-height: 1.35;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.post-preview-account b {
  flex: none;
  margin-inline-start: auto;
  font-size: 0.84rem;
  line-height: 1;
  letter-spacing: .12em;
  color: var(--faint);
}

/* ── the avatar: §1 placeholder primitive, square aspect ────────────────────
   The creator's initial stays in the DOM and stays readable to assistive tech —
   it is only made visually transparent, never `display:none`, because §1 is
   explicit that an initials tile is not a Proovd placeholder. The nested square
   is what the eye reads. */

.post-avatar {
  position: relative;
  display: block;
  flex: none;
  inline-size: 2.5rem;
  aspect-ratio: 1;
  min-block-size: 0;
  background: var(--ph-o);
  border-radius: var(--radius);
  overflow: hidden;
  color: transparent;
  font-size: 0.84rem;
  line-height: 1;
}
.post-avatar::after {
  content: "";
  position: absolute;
  inset: 24%;
  background: var(--ph-i);
  border-radius: var(--radius);
}

/* ── the media: §1 placeholder primitive, real media aspect ─────────────────
   `.post-preview-media` is not the placeholder — it is the surface the
   placeholder sits on. `::before` is the OUTER rectangle and carries the aspect
   ratio of the asset that is missing; `::after` is the INNER rectangle, sharing
   the same grid cell and inset 18% on every side so the nesting is unmistakable
   at any width. Both take their colours from the `--ph-o` / `--ph-i` pairs the
   card declares, which are the exact `#FAFAFA` combinations `10-foundation.css`
   ships for `.pv-ph-1 … .pv-ph-14`. The gradient is gone.

   The real copy the markup ships — `Image post · 1080 × 1350`, `STILLDAY`,
   `00:31`, the on-image line — flows into the auto rows BENEATH the outer
   rectangle, on the white preview surface. It stays fully visible and fully
   readable, and no word of it is printed on the coloured geometry, which §1
   bans by name for exactly this string ("Image post", a size, a filename).

   Aspect ratio is the recognisable difference between the two platforms
   (§4.15): 4:5 is the Instagram 1080 × 1350 still, 9:16 the vertical video.
   Neither is ever cropped to make the two cards the same shape (§9.4). */

.post-preview-media {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-auto-rows: auto;
  row-gap: var(--sp-4);
  min-width: 0;
  color: var(--body);
}
/* the outer rectangle */
.post-preview-media::before {
  content: "";
  grid-area: 1 / 1;
  inline-size: 100%;
  background: var(--ph-o);
  border-radius: var(--radius);
}
/* The inner rectangle. Absolutely positioned against a definite grid area, so
   its containing block is the outer rectangle's cell and `inset` resolves
   proportionally on BOTH axes — the same 18% the `.pv-ph` primitive in
   `10-foundation.css` uses, rather than a width-derived frame that would read
   thin on a 9:16 box. */
.post-preview-media::after {
  content: "";
  position: absolute;
  /* both end lines must be explicit: for an absolutely-positioned grid child an
     `auto` end line resolves to the container's padding edge, not to the cell */
  grid-area: 1 / 1 / 2 / 2;
  inset: 18%;
  background: var(--ph-i);
  border-radius: var(--radius);
}

.post-preview-media.image::before { aspect-ratio: 4 / 5; }
.post-preview-media.video::before { aspect-ratio: 9 / 16; }

/* the format line is a locator, in the system's kicker voice (§5.6) */
.post-preview-media > small {
  margin-block-start: var(--sp-4);
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}
/* the wordmark / the duration — the loudest thing the captured post says */
.post-preview-media > strong {
  font-size: clamp(1.26rem, 1.12rem + .55vw, 1.68rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: .02em;
  color: var(--ink);
  overflow-wrap: break-word;
}
.post-preview-media > p {
  font-size: 0.98rem;
  font-weight: 400;
  line-height: 1.4;
  color: var(--body);
  max-width: 32ch;
}

/* The play mark is the second half of the platform difference (§4.15) — a bare
   decorative glyph, no invented logo, no fake chrome. It is placed in the outer
   rectangle's own margin band at 2.5%, well clear of the inner rectangle at
   18%, which is where a play badge sits on a real video thumbnail. */
.post-preview-media.video > span {
  grid-area: 1 / 1;
  align-self: start;
  justify-self: start;
  margin: 2.5%;
  font-size: 1.26rem;
  line-height: 1;
  color: var(--body);
}

/* ── the caption the creator actually wrote — this is evidence, so it is real
   running text rather than 10px micro-copy (§9.1) */

.post-preview-copy {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--sp-4);
  min-width: 0;
  margin-block-start: var(--sp-4);
}
.post-preview-copy > strong {
  font-size: 0.91rem;
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink);
}
.post-preview-copy > p {
  font-size: 0.91rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--body);
  max-width: var(--copy-max);
  overflow-wrap: break-word;
}
/* the disclosure is the compliance fact, not decoration — it stays readable */
.post-preview-copy > small {
  margin-block-start: var(--sp-4);
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--muted);
}


/* ═══════════════════════════════════════════ THE REVIEW PANEL (§4.14 §4.11)
   A column, not a boxed sidebar: the old `border-left` divider is gone (§4.8).
   It packs against the top of the record and ends where its content ends. The
   earlier version stretched it to the post's full height so the decision row
   could sit on the record's floor; a 9:16 post is tall enough that this opened
   20rem of nothing between the evidence and the button, which fails both the
   dead-zone test (§10.2 #18) and §4.14's rule that excessive distance between
   context and action fails even when the button is prominent. Packing it puts
   "Approve and mark live" directly beneath the evidence it acts on, and the
   remaining height beside the post is page rather than an empty tinted box. */

.post-review-panel {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-width: 0;
}

/* ── who and where, and the state, on one rail ─────────────────────────── */

.live-post-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-8) var(--sp-24);
  inline-size: 100%;
  min-width: 0;
}
.live-post-heading > div {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
}
.live-post-heading span {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}
.live-post-heading h3 {
  font-size: clamp(1.19rem, 1.12rem + .3vw, 1.4rem);
  font-weight: 700;
  line-height: 1.28;
  letter-spacing: -.01em;
  color: var(--ink);
}

/* the state chip. This `strong` carries no class, so it is dressed in the exact
   `.status-tag` geometry `15-identity.css` already gives every state in the
   product — ring + dot for "needs you", flat quiet fill for "done" (§7.1). The
   two textures are still tellable apart with the copy covered and in grayscale. */
.live-post-heading > strong {
  display: inline-flex;
  align-items: center;
  gap: .45em;
  flex: none;
  padding: .3rem .7rem;
  border: var(--bw) solid transparent;
  border-radius: var(--radius);
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.005em;
  white-space: nowrap;
}
.creator-post-card.needs-review .live-post-heading > strong {
  border-color: var(--brand);
  background: var(--brand-5);
  color: var(--brand);
}
.creator-post-card.needs-review .live-post-heading > strong::before {
  content: "";
  flex: none;
  inline-size: .45em;
  block-size: .45em;
  background: var(--brand);
}
.creator-post-card:not(.needs-review) .live-post-heading > strong {
  background: var(--stat-bg);
  color: var(--stat-text);
}

/* ── the evidence (§4.11 "put the evidence before the explanation") ─────────
   Three facts, not three equal dividered cells. A single quiet field replaces
   the four borders the original drew, a fixed label rail on the left makes the
   block scannable top-to-bottom in one eye movement, and the facts are ranked:
   Submitted is provenance and recedes, Tracking and Disclosure are what the
   approval actually rests on and read at value scale (§4.17). No dividers. */

.post-review-facts {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--sp-4);
  inline-size: 100%;
  max-inline-size: min(100%, 34rem);
  min-width: 0;
  margin-block-start: var(--group-gap-y);
  background: var(--grey-lightest);
  border-radius: var(--radius);
  padding: clamp(var(--sp-12), 1.8svh, var(--sp-16)) var(--sp-16);
}
.post-review-facts > div {
  display: grid;
  grid-template-columns: minmax(0, 7.5rem) minmax(0, 1fr);
  align-items: baseline;
  column-gap: var(--col-gap);
  row-gap: var(--sp-4);
  min-width: 0;
  padding-block: var(--sp-8);
}
.post-review-facts span {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}
.post-review-facts strong {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -.008em;
  color: var(--ink);
  overflow-wrap: anywhere;
}
/* provenance, not evidence — it is the one fact that cannot change a decision */
.post-review-facts > div:first-child strong {
  font-size: 0.91rem;
  font-weight: 600;
  color: var(--muted);
}

/* ── the way out to the original. A tool, not a commitment: `15-identity.css`
   owns its tier-2 brand-border identity and nothing here touches it; it is only
   sized down to task scale and tied to the evidence it belongs with, so it does
   not read as a second primary next to the approve control (§4.17, §5.7.2).
   `--ctl-h-sm` is 2.75rem, still above the 44px touch floor (§9.2). */

.post-review-panel .post-link {
  align-self: flex-start;
  min-height: var(--ctl-h-sm);
  padding-inline: var(--sp-12);
  margin-block-start: var(--sp-12);
}

/* ── the decision (§4.14 §5.7.2) ────────────────────────────────────────────
   The identity layer has already tiered these — two quiet text controls and one
   filled brand commitment — so all that is done here is space: a deliberate
   phase break separates the evidence above from the decision, the quiet trio
   holds the left edge, and the commitment is cut away to the far end of the
   record with an auto gap and given real area. It lands on the section's right
   rail, the same line the header's count sits on. That is the same ranking the
   request queue above uses for the same shape, which is consistency, not extra
   emphasis. Card two carries a single quiet control and simply keeps the left
   edge — the composition saying there is nothing to decide here. */

.post-review-panel .inline-actions {
  inline-size: 100%;
  justify-content: flex-start;
  column-gap: clamp(var(--sp-16), 1.8vw, var(--sp-24));
  row-gap: var(--sp-8);
  padding-block-start: clamp(var(--sp-24), 4svh, var(--sp-48));
}
.post-review-panel .inline-actions > .primary {
  margin-inline-start: auto;
  min-height: var(--ctl-h);
  padding-inline: clamp(var(--sp-24), 2.4vw, var(--sp-40));
}

/* On the phone line the auto gap has no width left to spend, and a commitment
   hanging off the right edge of its own wrapped row reads as detached. It takes
   the record's full width instead — same tier, same identity, more area, under
   the thumb (§8.1, §9.2). */
@media (max-width: 37.5rem) {
  .post-review-panel .inline-actions > .primary {
    flex: 1 0 100%;
    margin-inline-start: 0;
  }
}



/* ══════ 38-delivery.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 38-DELIVERY
   The Delivery and payments stage: the LIVE payout path — `.payout-path`,
   `.path-steps`, `.path-steps > div` and everything scoped inside them.

   Not owned here: `.state-strip`, `.attention-line`, `.record-group` and its
   rows, `.inline-decision-panel`, `.policy-note`, `.actionbar`. They are read
   as neighbours only and are never selected below.

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               see where this campaign's money currently sits in its
                       gated payout sequence, and know which gate is next.
   Narrative role:     orientation. The operating map of the stage, read once
                       before the gate-by-gate evidence record underneath it.
   Dominant object:    the path itself — one shallow, left-to-right track of
                       numbered gates joined by a continuous brand rail. Not
                       five cells: one object with five positions on it. (The
                       stage's own hero is the proof decision further down,
                       another agent's; this section is deliberately the quiet
                       map above it — §5.6, one hero per moment.)
   Supporting object:  the "Payment gates and evidence" record directly below
                       (another agent's), which carries per-gate detail and the
                       per-gate state tags the path can only summarise.
   Primary action:     none in this section. The stage's single P — "Release
                       remaining 60%" — belongs to the actionbar, downstream of
                       every gate drawn here (§4.14, §5.7.2). A map does not
                       carry the commitment; the end of the map does.
   Composition thesis: a standard-frame shallow band under the section rail —
                       numbered square ordinal chips sit on one horizontal
                       line, a 2px brand track runs chip-edge to chip-edge with
                       a forward chevron centred in every junction, and each
                       gate's name and money-or-file line hangs beneath its own
                       chip in a content-width column, so the columns are
                       unequal and the interval between gates is set by payload
                       rather than by a repeat(5, 1fr); the final Creator-
                       transfers step is pushed past a doubled gap with no
                       track running into it; below a 62rem container the whole
                       track rotates a quarter turn into a left-gutter ladder
                       with the same chips, the same track running down and the
                       same chevrons pointing down.
   Vertical posture:   Top-work — the map begins immediately under the rail and
                       grows downward into the record it introduces.
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES

   1. THE SEQUENCE WAS INVISIBLE. `repeat(5, 1fr)` inside a 1px black box, cells
      split by `border-left`. Five interchangeable rectangles — exactly §4.17's
      "if five actions look equally large the screen has failed to rank them"
      and §4.2's card stack. Order, direction and position-in-path were the
      entire information content of the section and none of them were drawn.
      They are now the only things drawn: an ordinal chip per gate, a track
      between the chips, a chevron per junction. Cover every word (§10.2 test 2)
      and the shape still reads 1 → 2 → 3 → 4 ‖ 5.

   2. THE LAST STEP IS NOT PART OF THE CHAIN AND NOW LOOKS LIKE IT. In both the
      product path (Common gates → First 40% → Delivery proof → Remaining 60%
      → Creator transfers) and the idea path (Common gates → Founder payout →
      14-day update → Creator transfers) the final step is always the Creator
      ledger — a parallel track whose own copy says "Separate transfers
      waiting" and, in the record below, "Never bundled with Founder release".
      `:last-child` is therefore a real, DOM-derivable structural fact, and it
      is spent on four independent cues (§4.16): no track runs into it, the gap
      before it is doubled, its chip number drops to muted, and its payload line
      drops to muted. Nothing else in this file claims a state.

   3. THE NARROW POSTURE KEPT LOSING THE SEQUENCE. The original went 5-up →
      3-up → 1-up by swapping `border-left` for `border-top`, which turns an
      ordered path into a paragraph of boxes. There is now one recomposition
      (§4.22, §8.3): the track rotates. Chips move into a left gutter, the same
      2px brand line runs down through them, the chevrons point down, the
      detached final step stays detached. A vertical path is a path; a wrapped
      grid of cells is not.

   ── WHAT THE DOM WILL NOT LET THIS FILE SAY ────────────────────────────────
   `.path-steps > div` is emitted identically for every step: `<span>{n}</span>
   <strong>{label}</strong><p>{value · status}</p>`. There is no per-step class,
   no attribute, no data hook — cleared, pending, current and blocked are only
   ever present as words inside the `<p>` text node, and CSS cannot select text.

   So this file does NOT draw a current step, does NOT tint a cleared step and
   does NOT fill a progress track. Faking any of them would be a decorative
   indicator standing in for a process with meaningful stages, which is the one
   thing §4.11 "Waiting, processing, matching, or status" forbids outright, and
   the DNA's progress treatment (brand-5 fill + brand border + brand fill) would
   be a lie at any width it was drawn to. The honest compensation is that the
   `<p>` — which is where the status word actually lives — is promoted out of
   faint 12px note-copy into readable `--body` weight 600, so "Paid", "Needs
   review" and "Locked until proof is accepted" are legible at a glance rather
   than buried. The per-gate state cues the eye needs live one section down, on
   `.record-row.action / .done / .waiting`, which already carry them.
   See the report for the single attribute that would fix this.

   ── COLOUR LEDGER (§7.2A — every treatment earns its place by meaning) ──────
   2px brand track + brand chevrons ... the money is in flight, and this is the
                                        direction it flows. One object, not five
                                        decorations. This is the live path; the
                                        Complete stage's retrospective spine is
                                        sage and stops (§4.12).
   #F1F3F2 ordinal chips .............. position in the sequence. Neutral on
                                        purpose: a chip is a locator, and a
                                        state-coloured chip would assert a state
                                        this DOM cannot support.
   #669370 on the final step .......... "different ledger", not "done".
   Zero dark-green fills. Zero brand fills. Zero accent bands. Zero emphasised
   steps. The stage already carries a heading, an attention line, a decision
   panel and a policy note from other agents; this section spends no emphasis.
   Remove all colour (§10.2 test 8) and the ordinals, the track, the unequal
   intervals and the detached tail still carry the whole composition.
   ========================================================================= */


/* ══════════════════════════════════════════════ 1. THE SECTION (§4.18 §4.12)

   Deliberately the shallowest object on the stage. The Complete stage's wrap
   timeline is a 46rem narrow column that grows tall; this is a standard-frame
   band that stays short. That is the silhouette contrast the two neighbouring
   stages need before any colour or copy is applied (§4.12).

   `--frame-standard` is the declared tier (§4.18) — not an invented width — and
   it is the same tier the "Payment gates and evidence" record below uses, so
   the map and the record it introduces share both rails rather than drifting
   onto unrelated grids. The cap also caps the global header rail's brand
   hairline to the width of the path it labels, and turns surplus on a 1920
   monitor into air rather than a 5-column track stretched across 1700px
   (§9.1, §4.13). */

.payout-path {
  min-width: 0;
  max-width: min(100%, var(--frame-standard));

  /* the path recomposes on its own available width, not the viewport's, so it
     behaves correctly however the stage frame around it changes (§8.0A) */
  container-type: inline-size;
  container-name: path;
}

/* header rail is globally owned; only the distance from its brand hairline down
   to the brand track is local. `--block-gap-y` instead of the global `--sp-16`
   so the two brand lines never read as one doubled divider (§4.1, §1). */
.payout-path > header {
  align-items: baseline;
  margin-block-end: var(--block-gap-y);
}


/* ══════════════════════════════════════════════════ 2. THE TRACK (§4.11 §4.17)

   Horizontal posture. Flex rather than grid, and `flex: 1 1 auto` rather than
   `1fr`, so each gate's column is sized by its own payload: "Common gates" and
   "Delivery proof" take more of the line than "Creator transfers" does. The
   intervals between the ordinals are therefore unequal and content-derived
   instead of mechanically identical (§4.1), and the shape survives the idea
   campaign's 4-step path with no step-count-specific rule anywhere.

   `nowrap` is deliberate: a path that wraps to a second line stops being a
   path. When it no longer fits, it rotates (section 4 below) — recompose
   before shrinking (§4.22). */

.path-steps {
  display: flex;
  flex-wrap: nowrap;
  align-items: start;
  gap: var(--path-gap);
  min-width: 0;

  /* the geometry of the path, in one place */
  --path-node:    clamp(1.75rem, min(2.4vw, 4svh), 2.25rem); /* the ordinal chip */
  --path-gap:     clamp(1.25rem, 2.4vw, 2.5rem);             /* gate → gate      */
  --path-arrow:   .45rem;                                    /* the chevron      */
  --path-detach:  clamp(1.25rem, 2.6vw, 2.75rem);            /* extra, before the
                                                                separate ledger  */
}

/* one gate. No box, no divider, no border — the page is the background and the
   track is the grouping (§4.2, §4.8). */
.path-steps > div {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: var(--sp-4);
  flex: 1 1 auto;
  min-width: min(9rem, 100%);
}

/* ── the track segment: this gate into the next one ───────────────────────
   Drawn per gate from the chip's trailing edge across the gap to the next
   chip's leading edge, so the line is genuinely interrupted by every station
   it passes through. 2px, not the 1px hairline weight, because this is a
   container/track boundary and not a divider — which is also what keeps it
   from reading as a second copy of the header rail's hairline (§1, §2). */
.path-steps > div::before {
  content: "";
  position: absolute;
  inset-inline-start: var(--path-node);
  inset-inline-end: calc(var(--path-gap) * -1);
  top: calc(var(--path-node) / 2 - var(--bw) / 2);
  height: var(--bw);
  background: var(--brand);
}

/* ── the direction mark, centred in every junction ────────────────────────
   A decorative chevron built from two borders (§5 of the brief: decorative
   marks are legal, injected words are not). This is what makes the order
   readable as a *direction* rather than as a list, with every word covered. */
.path-steps > div::after {
  content: "";
  position: absolute;
  inset-inline-end: calc(var(--path-gap) / -2 - var(--path-arrow) / 2);
  top: calc(var(--path-node) / 2);
  width: var(--path-arrow);
  height: var(--path-arrow);
  border-top: var(--bw) solid var(--brand);
  border-right: var(--bw) solid var(--brand);
  transform: translateY(-50%) rotate(45deg);
}

/* ── where the founder chain ends (§4.16) ─────────────────────────────────
   The last gate is always the Creator ledger, and the gate before it is always
   the last founder-money gate. So the chain's final segment is removed rather
   than drawn: money does not flow from the founder release into the creator
   transfers, and the geometry now says what the copy says.
   `content: none` rather than `display: none` — this suppresses a decorative
   mark, never content (brief §1). */
.path-steps > div:nth-last-child(2)::before,
.path-steps > div:nth-last-child(2)::after,
.path-steps > div:last-child::before,
.path-steps > div:last-child::after { content: none; }

/* cue 2 of 4: the separate ledger stands off the end of the chain */
.path-steps > div:last-child { margin-inline-start: var(--path-detach); }


/* ═══════════════════════════════════════════ 3. WHAT SITS ON EACH STATION

   Three type roles, three jobs: an ordinal (where in the path), a name (which
   gate), a fact (how much / which file / what it is waiting on). */

/* the ordinal chip — a real object on the line, so position is legible before
   the number is read. Neutral #F1F3F2: a locator states position, not state,
   and this DOM cannot support a state claim (see the header note). */
.path-steps > div > span {
  display: inline-grid;
  place-items: center;
  justify-self: start;
  width: var(--path-node);
  height: var(--path-node);
  margin-block-end: var(--sp-8);
  background: var(--grey-light);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 0.98rem;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* the gate name — item heading role (§3 type roles) */
.path-steps strong {
  min-width: 0;
  font-size: clamp(1.05rem, 1.008rem + .25vw, 1.19rem);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -.008em;
  color: var(--ink);
}

/* the fact. Promoted out of faint micro-copy: the status word ("Paid", "Needs
   review", "Locked until proof is accepted") lives at the tail of this line and
   is the only per-gate state this section is able to show at all, so it is set
   as readable body copy at a bounded measure (§9.1) and wraps at word
   boundaries rather than blowing out the track (§9.4). */
.path-steps p {
  min-width: 0;
  max-width: min(42ch, 100%);
  font-size: 0.91rem;
  font-weight: 500;
  line-height: 1.45;
  color: var(--body);
  overflow-wrap: break-word;
}

/* cues 3 and 4 of 4 — the separate ledger reads as a different track, not as a
   demoted or finished step: the name keeps full weight, the ordinal and the
   fact drop to `--muted` (§4.16: never one cue, never colour alone). */
.path-steps > div:last-child > span { color: var(--muted); }
.path-steps > div:last-child p      { color: var(--muted); }


/* ═════════════════════════════════ 4. THE TRACK ROTATES, IT DOES NOT WRAP
   (§8.3, §4.22, §4.9)

   Below 62rem of available width, five columns can no longer hold a readable
   fact each, and 1024×768 is already inside that. Rather than squash the track
   or wrap it into rows of cells, the whole composition turns a quarter turn:
   the ordinals become a left gutter, the same 2px brand line runs down through
   them, the chevrons point down, and each gate finally gets the full column
   width for its fact. Order, direction, the chain and its detached tail all
   survive the change — the hierarchy is preserved, not just the DOM order. */

@container path (max-width: 62rem) {

  .path-steps {
    flex-direction: column;
    gap: var(--path-row-gap);
    /* vertical rhythm answers to height, never to width (§4.5A) */
    --path-row-gap: clamp(1.25rem, 2.7svh, 2.125rem);
  }

  /* chip in a gutter, name over fact beside it */
  .path-steps > div {
    grid-template-columns: var(--path-node) minmax(0, 1fr);
    column-gap: var(--sp-16);
    align-items: start;
    min-width: 0;
  }
  .path-steps > div > span {
    grid-column: 1;
    grid-row: 1 / span 2;
    align-self: start;
    margin-block-end: 0;
  }
  .path-steps strong { grid-column: 2; grid-row: 1; }
  .path-steps p      { grid-column: 2; grid-row: 2; max-width: min(52ch, 100%); }

  /* the track, now vertical: chip bottom down into the next chip's top */
  .path-steps > div::before {
    inset-inline-start: calc(var(--path-node) / 2 - var(--bw) / 2);
    inset-inline-end: auto;
    width: var(--bw);
    top: var(--path-node);
    bottom: calc(var(--path-row-gap) * -1);
    height: auto;
  }

  /* the chevron, now pointing down the gutter */
  .path-steps > div::after {
    inset-inline-start: calc(var(--path-node) / 2 - var(--path-arrow) / 2);
    inset-inline-end: auto;
    top: auto;
    bottom: calc(var(--path-row-gap) / -2 - var(--path-arrow) / 2);
    transform: rotate(135deg);
  }

  /* the detach moves axis with everything else */
  .path-steps > div:last-child {
    margin-inline-start: 0;
    margin-block-start: var(--group-gap-y);
  }
}


/* ══════════════════════════════════════════════════ 5. PHONE (§8.1, §9.3)

   No new topology — the ladder is already the phone posture. Only the gutter
   tightens so a 360px screen keeps a comfortable measure for the fact, and the
   fact stays the same size: overflow is never solved by shrinking type (§9.4). */

@container path (max-width: 26rem) {
  .path-steps > div { column-gap: var(--sp-12); }
  .path-steps p     { max-width: 100%; }
}



/* ══════ 40-complete.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 40-COMPLETE
   The Complete stage: `.campaign-timeline` (founder wrap timeline),
   `.archive-actions` (retained access vs cooldown/reapplication) and
   `.campaign-archive` (the founder's campaign record list).

   Not owned here: `.final-summary` (app-wide four-tile family) and
   `.creator-record.compact` (Matching). Both are read as neighbours only.

   ── §4.10 COMPOSITION CONTRACT ─────────────────────────────────────────────
   Task:               confirm this campaign is genuinely finished, then decide
                       what — if anything — happens after it.
   Narrative role:     payoff / closure. The one true ending in the product.
   Dominant object:    the four-tile final result (`.final-summary`, another
                       agent's) sitting directly above these sections. §4.11
                       "proof before explanation": the evidence is the top of
                       the screen, and everything in THIS file is the record
                       underneath it, deliberately quieter (§4.3, §5.6).
   Supporting object:  the wrap timeline — a dated retrospective log that
                       explains how the summary's numbers were arrived at.
   Primary action:     "Approve and create new campaign" — the screen's single
                       P, gated behind a separate application decision and
                       therefore rendered as a full-size commitment that is not
                       yet available (§4.16), never as a small broken chip.
   Composition thesis: a 46rem narrow column holds a vertical wrap log — a sage
                       hairline spine with a right-aligned phase gutter to its
                       left and the fact to its right, four marks descending to
                       a larger terminal mark where the spine stops; beneath it
                       the archive actions split 1fr / 1.7fr, routine retained
                       access sitting bare on the page at left and the gated
                       reapplication decision occupying a wider quiet #F1F3F2
                       field at right whose text button arrows into a full-size
                       disabled commitment; the campaign archive closes the
                       stage as a 66rem borderless four-column record list on
                       alternating bands, its leading (current) record carrying
                       a brand rail, a brand marker dot and a larger name.
   Vertical posture:   Scrollable-work — these three sections are the tail of a
                       long stage and begin immediately under the summary.
   ───────────────────────────────────────────────────────────────────────────

   WHAT THIS FILE FIXES
   1. The timeline was `repeat(4, 1fr)` of dividered cells — four interchangeable
      boxes with no before and no after (§4.17's "five things the same size"
      failure). It is now a single vertical spine: position carries order, the
      line carries direction, and the line STOPS at an enlarged terminal mark.
      Because everything on it already happened it is drawn in settled sage with
      no numbering and no locked/pending state — the opposite of the Delivery
      stage's live numbered payout path, which is the §4.12 silhouette contrast
      the two neighbouring stages need.
   2. `.archive-actions` was `1fr 1fr` split by a border, giving "export a CSV"
      and "start a whole new campaign" identical weight — §4.17 / §5.7.2's
      explicit failure. Width, background field, heading scale and control area
      now rank them, and the border is gone (§4.8: field before border).
   3. `.campaign-archive` was a row-per-`border-bottom` list. Rows now sit
      directly on the page separated by an alternating #F7F7F7 band, and the
