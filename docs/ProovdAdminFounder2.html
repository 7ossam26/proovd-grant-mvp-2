      current campaign is identified by five cues — two of which (name scale,
      row height) survive grayscale — instead of by reading its last cell.

   COLOUR LEDGER (§7.2A — every fill must mean something)
   - sage hairline + sage/moss marks .... "already happened / settled"
   - #F1F3F2 field on one action block .. ranking, and only there
   - #F7F7F7 alternating row band ....... row separation without dividers
   - brand 5% + brand rail + brand dot .. §1's exact selection treatment, on
                                          the one record you are looking at
   Zero dark-green fills. Zero brand fills. Zero accent bands. No borders except
   the one selection rail. The interest is order, alignment and type (§7.2A).
   ========================================================================= */


/* ══════════════════════════════════════════ 1. THE WRAP TIMELINE (§4.11)

   Geometry, left to right: a right-aligned phase gutter, the spine, the fact.
   The spine is drawn per-item as `li::after` running from that item's mark down
   into the next one, so the LAST item has no segment and the line simply ends —
   which is the whole point of a retrospective timeline. `--wrap-time` is the
   single lever the stacked posture pulls: set it to 0 and the phase label drops
   above the fact while the spine stays exactly where it is (§8.3). */

.campaign-timeline {
  min-width: 0;
  /* narrow frame (§4.18): a log of short facts, not a band. Capping the section
     also caps the header rail's brand hairline to the width of the log it
     labels, and turns wide-monitor surplus into air rather than 90ch lines
     (§9.1, §4.13). This is the section that is deliberately the narrowest
     object on the stage — one of the §4.12 levers. */
  max-width: min(100%, 46rem);
  container-type: inline-size;
  container-name: wrap;

  --wrap-time:   6.5rem;              /* the phase gutter                     */
  --wrap-spine:  1.5rem;              /* the channel the spine runs down      */
  --wrap-mark:   .5rem;               /* an event                             */
}

.campaign-timeline ol {
  display: grid;                      /* no gap — rhythm lives on the items   */
  margin-block-start: var(--sp-4);
}

.campaign-timeline li {
  position: relative;
  display: grid;
  grid-template-columns: var(--wrap-time) var(--wrap-spine) minmax(0, 1fr);
  align-items: baseline;
  font-size: 1.05rem;
  line-height: 1.45;
  /* the gap to the next event is the item's own bottom padding, so it can vary
     per item and the spine segment can still be drawn from it (§4.1: never
     mechanically equal intervals). */
  --wrap-gap: var(--group-gap-y);
  padding-block-end: var(--wrap-gap);
}

/* the pause before the outcome — the last stretch of spine is the long one */
.campaign-timeline li:nth-last-child(2) { --wrap-gap: calc(var(--group-gap-y) * 1.9); }
.campaign-timeline li:last-child        { padding-block-end: 0; }

/* the event mark, centred in the spine channel. `.72em` puts it on the first
   line's optical centre, so it re-centres by itself when the last item's type
   steps up. */
.campaign-timeline li::before {
  content: "";
  position: absolute;
  left: calc(var(--wrap-time) + (var(--wrap-spine) - var(--wrap-mark)) / 2);
  top: calc(.72em - var(--wrap-mark) / 2);
  width: var(--wrap-mark);
  height: var(--wrap-mark);
  background: var(--sage);
  border-radius: var(--radius);
}

/* the spine: this event down into the next one. Never drawn on the last item —
   the line ending IS the "this is over" cue (§4.16, cue 1 of 3). */
.campaign-timeline li:not(:last-child)::after {
  content: "";
  position: absolute;
  left: calc(var(--wrap-time) + (var(--wrap-spine) - var(--hair)) / 2);
  top: calc(.72em + var(--wrap-mark) / 2 + .25rem);
  bottom: -.45rem;                    /* reach into the next item's mark      */
  width: var(--hair);
  background: var(--sage);
}

/* the terminal event: larger mark, darker mark, larger and darker type, and
   more space above it. Four cues, three of them colour-independent (§10.2/5). */
.campaign-timeline li:last-child {
  --wrap-mark: .75rem;
  font-size: 1.19rem;
}
.campaign-timeline li:last-child::before { background: var(--moss); }

/* the phase gutter — a locator, so it takes the quiet uppercase role (§3 roles)
   and right-aligns against the spine the way a date column does. */
.campaign-timeline time {
  grid-column: 1;
  min-width: 0;
  padding-inline-end: var(--sp-8);
  text-align: right;
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1.2;
  color: var(--faint);
}
.campaign-timeline li:last-child time { color: var(--muted); }

/* the fact — the only readable copy in the log, so it holds body colour all the
   way up the list and only gains weight at the terminus. */
.campaign-timeline li strong {
  grid-column: 3;
  min-width: 0;
  font-size: inherit;
  font-weight: 500;
  line-height: inherit;
  color: var(--body);
  max-width: var(--copy-max);
}
.campaign-timeline li:last-child strong {
  font-weight: 700;
  letter-spacing: -.008em;
  color: var(--ink);
}

/* the header rail is global; only the button's cross-alignment is local, so a
   32px tall control does not sit on the h2's baseline. */
.campaign-timeline > header { align-items: center; }

/* ── stacked posture — it stays a timeline (§8.3) ──────────────────────────
   The spine, the marks, the order and the terminus are untouched; only the
   phase label moves from beside the fact to above it. */
@container wrap (max-width: 30rem) {
  .campaign-timeline { --wrap-time: 0rem; }

  .campaign-timeline li {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--sp-4);
    align-items: start;
    padding-inline-start: var(--wrap-spine);
  }
  .campaign-timeline time,
  .campaign-timeline li strong { grid-column: 1; }

  .campaign-timeline time {
    padding-inline-end: 0;
    text-align: left;
  }
  /* the mark now sits against the label line rather than the fact line */
  .campaign-timeline li::before { top: calc(.62rem - var(--wrap-mark) / 2); }
  .campaign-timeline li:not(:last-child)::after { top: calc(.62rem + var(--wrap-mark) / 2 + .25rem); }
}


/* ══════════════════════════ 2. RETAINED ACCESS vs REAPPLICATION (§4.17)

   Two blocks that are not the same kind of thing, so they are not the same
   size. Left: routine retained access, sitting bare on the page (§4.2) at 1fr.
   Right: the gated new-campaign decision, on a quiet field at 1.7fr with the
   larger heading and the only real commitment control on the screen.
   This block is the single emphasis this file spends (§5.8) — the payoff itself
   belongs to `.final-summary` above, so the emphasis here is ranking, not
   celebration. */

.archive-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr);
  column-gap: clamp(1.5rem, 3vw, 3.5rem);
  row-gap: var(--block-gap-y);
  align-items: start;
  max-width: min(100%, 70rem);
  container-type: inline-size;
  container-name: acts;

  /* one shared inset so both headings start on the same rail even though only
     one of them has a field behind it (§4.18). */
  --acts-pad-y: clamp(1.25rem, 2.6svh, 2rem);
  --acts-pad-x: clamp(1.25rem, 2.4vw, 2rem);

  /* the narrative break: this is where the record stops and the decision
     starts. One extra step beyond whatever the stage's own section rhythm is. */
  margin-block-start: var(--group-gap-y);
}

.archive-actions > div { min-width: 0; }

/* left — routine access. No field, no border: it is secondary content and it is
   allowed to sit directly on the page. */
.archive-actions > div:first-child { padding-block-start: var(--acts-pad-y); }

/* right — the decision. §4.8 order: proximity, alignment, typography, then
   background. This is the first place on the screen a background is the right
   answer, and it is #F1F3F2 so it never collides with the #F7F7F7 row bands of
   the archive list directly below it. */
.archive-actions > div:last-child {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding-block: var(--acts-pad-y);
  padding-inline: var(--acts-pad-x);
}

/* heading scale is the second ranking cue after width (§4.17) — group heading
   on the right, item heading on the left. These `h2`s have no section header
   rail in the DOM, so they are set here rather than inherited. */
.archive-actions h2 {
  font-size: clamp(1.12rem, 1.064rem + .2vw, 1.26rem);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -.008em;
  color: var(--ink);
}
.archive-actions > div:last-child h2 {
  font-size: clamp(1.19rem, 1.064rem + .35vw, 1.54rem);
  font-weight: 800;
  line-height: 1.22;
  letter-spacing: -.012em;
}

/* one supporting sentence per block, kept to reading measure (§9.1) and kept
   close to the actions it makes safe (§4.7, §4.14). */
.archive-actions p {
  margin-block: var(--sp-8) var(--group-gap-y);
  max-width: var(--copy-max);
  font-size: 0.98rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--muted);
}

.archive-actions .inline-actions {
  justify-content: flex-start;
  gap: var(--sp-8) var(--sp-24);
}

/* ── the gated commitment (§4.16, §9.2) ───────────────────────────────────
   Disabled must read "not yet earned", not "broken". Global identity already
   dims it; these two rules supply the other two cues:

   (a) it is full commitment size — §9.2's P range — so it reads as the real
       thing waiting, not as a dead utility chip;
   (b) it is placed downstream of a decorative arrow from "Open application
       review", the control that actually unlocks it, so the sequence is
       visible without reading either label.

   Only `order`, size and spacing are set here — identity (fill, colour, weight,
   the global `opacity:.4`) is untouched. */
.archive-actions > div:last-child .inline-actions > button:not(.primary) { order: 0; }
.archive-actions > div:last-child .inline-actions > .primary            { order: 2; }

.archive-actions > div:last-child .inline-actions::before {
  content: "\2192";                   /* decorative direction mark, not copy   */
  order: 1;
  align-self: center;
  font-size: 1.05rem;
  font-weight: 800;
  line-height: 1;
  color: var(--faint);
}

.archive-actions > div:last-child .inline-actions > .primary {
  min-height: var(--cta-h);
  min-width: min(100%, 16rem);
  padding-inline: clamp(1.5rem, 2.6vw, 2.5rem);
  font-size: clamp(1.05rem, 1.008rem + .2vw, 1.19rem);
}

/* ── stacked posture — the ranking survives (§8.3) ─────────────────────────
   Equal width is now unavoidable, so the remaining three cues do the ranking on
   their own: field, heading scale, and control area. The blocks keep DOM order,
   which is also the story order: what you still have, then what comes next. */
@container acts (max-width: 44rem) {
  .archive-actions { grid-template-columns: minmax(0, 1fr); }
  .archive-actions > div:first-child { padding-block-start: 0; }
  .archive-actions > div:last-child  { padding-inline: var(--acts-pad-x); }
}


/* ═══════════════════════════════════ 3. THE CAMPAIGN ARCHIVE LIST (§4.8)

   A list of records, so: no border per row. Rows sit on the page and are
   separated by an alternating #F7F7F7 band and real padding, exactly like the
   global record-row system — this list's `button` is a row, not a button.

   Which record is current: the app prepends new campaigns to the founder's
   list, so the leading row is always the newest and, in this product, the one
   being viewed. It carries §1's selection treatment plus two colour-independent
   cues (§4.16, §10.2/5). */

.campaign-archive {
  min-width: 0;
  max-width: min(100%, 66rem);
  container-type: inline-size;
  container-name: archive;
}

.campaign-archive > button {
  display: grid;
  grid-template-columns:
    minmax(0, 1.7fr) minmax(0, .9fr) minmax(0, .8fr) minmax(0, 1.05fr);
  column-gap: var(--col-gap);
  row-gap: var(--sp-8);
  align-items: center;
  width: 100%;
  min-height: var(--ctl-h);
  padding: var(--sp-12) var(--sp-16);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  text-align: left;
  color: var(--body);
  font-size: 1.05rem;
}
.campaign-archive > button > span { min-width: 0; }

/* separation by field, not by twenty dividers (§4.8, §1) */
.campaign-archive > button:nth-of-type(even) { background: var(--grey-lightest); }

/* cell 1 — the record's identity: name over id. Both are labels, so both
   truncate rather than rewrap the row (§9.4). */
.campaign-archive > button > span:first-child {
  display: grid;
  align-content: center;
  gap: var(--sp-4);
}
.campaign-archive > button > span:first-child > strong,
.campaign-archive > button > span:first-child > small {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.campaign-archive > button > span:first-child > strong {
  font-size: 1.12rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.008em;
  color: var(--ink);
}
.campaign-archive small {
  font-size: 0.84rem;
  font-weight: 500;
  line-height: 1.35;
  color: var(--faint);
}

/* cell 2 — campaign type. Classification, not a value: it stays quiet. */
.campaign-archive > button > span:nth-child(2) {
  font-size: 0.91rem;
  font-weight: 500;
  color: var(--muted);
}

/* cell 3 — the stage the record ended in. A value the admin scans. */
.campaign-archive > button > span:nth-child(3) {
  font-size: 0.98rem;
  font-weight: 600;
  color: var(--body);
}

/* cell 4 — the marker cell: a completion date for past records, "Current
   campaign" for the leading one. Right-aligned onto the row's trailing rail so
   the column reads as one edge down the list (§4.18). */
.campaign-archive > button > span:nth-child(4) {
  justify-self: end;
  text-align: right;
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -.005em;
  color: var(--faint);
}

/* ── the current record ────────────────────────────────────────────────────
   Five cues, and the two that carry it in grayscale come first:
   1. a larger name;         2. a taller row (physical area, §4.17);
   3. brand 5% field;        4. the brand selection rail (§1, §7.1);
   5. a brand marker dot in the trailing cell.
   Declared after the banding rule so it wins at equal specificity. */
.campaign-archive > button:first-of-type {
  min-height: calc(var(--ctl-h) + var(--sp-16));
  background: var(--brand-5);
  border-left: var(--bw) solid var(--brand);
  padding-left: calc(var(--sp-16) - var(--bw));
}
.campaign-archive > button:first-of-type > span:first-child > strong {
  font-size: 1.19rem;
  font-weight: 800;
}
.campaign-archive > button:first-of-type > span:nth-child(4) {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: .45em;
  color: var(--brand);
}
.campaign-archive > button:first-of-type > span:nth-child(4)::before {
  content: "";
  width: .45em;
  height: .45em;
  flex: none;
  background: var(--brand);
  border-radius: var(--radius);
}

/* ── recomposed row (§4.22 — recompose, never shrink) ──────────────────────
   Four columns become a two-line record: identity and the current-campaign
   marker hold the first line because they are what the admin is looking for;
   type and stage drop to a meta line beneath. No column narrows below its
   minimum and nothing changes size. */
@container archive (max-width: 50rem) {
  .campaign-archive > button {
    grid-template-columns: minmax(0, 1fr) minmax(0, auto);
    row-gap: var(--sp-8);
  }
  .campaign-archive > button > span:first-child  { grid-area: 1 / 1; }
  .campaign-archive > button > span:nth-child(4) { grid-area: 1 / 2; }
  .campaign-archive > button > span:nth-child(2) { grid-area: 2 / 1; }
  .campaign-archive > button > span:nth-child(3) { grid-area: 2 / 2; justify-self: end; }
}

/* at phone width the marker is allowed the second line to itself rather than
   squeezing the name it sits beside */
@container archive (max-width: 26rem) {
  .campaign-archive > button {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--sp-4);
  }
  .campaign-archive > button > span:first-child  { grid-area: 1 / 1; }
  .campaign-archive > button > span:nth-child(4) { grid-area: 2 / 1; justify-self: start; text-align: left; }
  .campaign-archive > button > span:nth-child(2) { grid-area: 3 / 1; }
  .campaign-archive > button > span:nth-child(3) { grid-area: 4 / 1; justify-self: start; }
  .campaign-archive > button:first-of-type > span:nth-child(4) { justify-content: flex-start; }
}



/* ══════ 42-overlays.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 42-OVERLAYS
   Every overlay, dialog and toast in the product: the scrim, the dialog shell,
   its masthead, and the eleven distinct bodies that shell has to carry —
   message, support, notes, history, stages, settings, search, create Founder,
   decision, manual edit, detail — plus the confirmation toast.

   ── §4.10 COMPOSITION CONTRACT (the dialog system as a whole) ──────────────
   Task:               commit one decision, write the reason for it, or read the
                       record that justifies it — without losing the campaign
                       underneath.
   Dominant object:    the family's own working object, and it is never the box.
                       The reason textarea, the stage list, the results index,
                       the conversation, the settings index: each dialog is
                       sized to ITS object, not to a house width.
   Supporting object:  the masthead — kicker (which record), title (which
                       action), lead (what this will do). It is the only thing
                       all eleven share, and it stays a compact three-line mass
                       at the top so the object below it is what you look at.
   Primary action:     the single `.primary` in `.dialog-actions`, sitting
                       directly under the object it commits (§4.14). Five of the
                       eleven have no primary at all — reading and navigating
                       dialogs end when you pick something or close.
   Composition thesis: one white sheet on an `--ink-50` scrim, held slightly
                       above optical centre, whose width is chosen from a
                       four-step ladder by what it holds — 38rem for one value,
                       46rem for one writing surface or one conversation, 58rem
                       for a two-column form or a time-railed log, 68rem for a
                       three-column scanning index; the masthead is a fixed
                       compact block at the top, the object below it is the one
                       region allowed to scroll, and the actions sit on the
                       sheet's bottom edge where they never move.
   Vertical posture:   Mid-decision above 600px — the sheet is one compact mass
                       with air around it, offset upward so bottom whitespace
                       exceeds top (§4.19). Below 600px every dialog becomes
                       Bottom-consequence: a sheet pinned to the bottom edge,
                       ≤85svh, safe-area padded, actions under the thumb (§8.1).
   ───────────────────────────────────────────────────────────────────────────

   HOW THE ELEVEN DIFFER — four families, four grammars (§4.12)

   · WRITE A REASON (decision, manual edit). §4.11 "writing a substantial
     answer": the writing surface IS the object. The reason textarea — where an
     Admin types why a Founder's application is going back — was a 110px box
     under a 10px micro-cap. It is now 11–18rem tall, height-driven, the largest
     thing in its dialog, with the instruction directly above it and the commit
     directly below. Manual edit runs the same form class and must not look the
     same: one saved value gets the narrowest sheet in the system and a field
     capped to the shape of a value instead of stretched across the sheet.

   · NAVIGATE (stages, search). A list you scan and pick from. The stage menu is
     the product's wayfinding (§5.12) so its three states are three textures
     before they are three colours: available sits on a quiet field, active
     carries §1's exact selection treatment plus a bigger mark, a bigger title
     and a taller row, locked sits on bare page with nothing under it — not yet
     paved, rather than dimmed out. There is no `opacity` in this file.

   · READ A RECORD (message, support, notes, history, detail). Four lists that
     used to be four near-identical bordered stacks. They now have four
     rhythms — banded speech blocks / id-railed case cards / open hanging
     paragraphs / a dense brand-spined timeline — each one recognisable as a
     thumbnail with the copy covered and the colour removed (§10.2/3, /8).

   · FILL A FORM (create Founder). Same rules as the rest of the product: a
     label directly above its field, fields sized by what they hold rather than
     sliced into equal halves, one comfortable grid, one primary at the end.

   COLOUR BUDGET — the whole file (§1, §7.2A)
   Zero dark-green fills. One brand pixel per dialog at most, and never two:
   stages/search/message/notes take the app's header-rail hairline; history
   takes a spine instead; support takes `--sage` case edges instead; settings
   already carries three group rails of its own; the four write/read/form
   dialogs take none. Brand fill appears only where §1 says it must — the
   selected stage's ring and the global primary button. Everything else is
   `--grey-lightest`, space and type.

   Field identity (white fill, grey ring, brand focus ring, `--field-h`, label
   typography, select caret, textarea measure) and all button identity are owned
   by 15-identity.css and are not re-declared here. This file owns arrangement,
   size-in-context and composition only.
   ========================================================================= */


/* ══════════════════════════════════════════════ THE SCRIM (§1 §4.19 §9.5)
   `--ink-50` is the system's scrim colour — the darker green at half — not an
   invented neutral black. The stage below stays legible through it, which is
   what tells you the dialog is a layer over your work and not a new page.

   `grid-template-rows: minmax(0, 1fr)` gives the dialog a definite height to
   resolve `max-height: 100%` against, so a settings index or a long history can
   fill the available height and scroll inside itself instead of running off the
   viewport (§4.22 step 6, §9.4). Vertical padding is height-driven and
   deliberately asymmetric: the sheet sits above optical centre because equal
   margins are not optical balance (§4.19). */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  align-items: center;
  justify-items: center;
  padding: var(--stage-pad-y) var(--gutter-x) calc(var(--stage-pad-y) * 1.35);
  background: var(--ink-50);
  overscroll-behavior: contain;

  /* THE WIDTH LADDER (§4.18 frame tiers, applied per dialog family)
     One shell does not fit eleven jobs. Each step is chosen by the object the
     dialog holds, and every dialog below names its step and its reason.
       xs — one value or one stored document: deliberately under §4.18's narrow
            floor, because the object is a single line, not a page.
       s  — one writing surface, one conversation, one short record list.
            §4.18 narrow: "one substantial text/input object".
       m  — a two-column form, a log with a time rail, a settings index.
            The top of narrow / bottom of standard.
       l  — a three-column scanning index. §4.18 standard. */
  --dlg-xs: 38rem;
  --dlg-s:  46rem;
  --dlg-m:  58rem;
  --dlg-l:  68rem;
}


/* ═══════════════════════════════════════════════ THE SHEET (§4.2 §4.18 §9.4)
   White on the scrim, so it needs no boundary at all: §4.2's order is
   proximity → alignment → typography → background contrast → border, and the
   scrim has already done the separating. No border, and — §1 absolute — no
   shadow of any kind. Radius is `--radius`, like everything else.

   The sheet is a flex column so exactly one region inside it can be the
   scroller while the masthead and the actions stay where they are. `overflow-y`
   on the sheet itself is the backstop for the rare case where even the masthead
   cannot fit; it is never the primary mechanism. Nothing here shrinks type to
   make content fit (§4.22, §9.1). */

.dialog {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(100%, var(--dlg-w, var(--dlg-s)));
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--pure);
  border-radius: var(--radius);
  padding-block: clamp(1.5rem, 3.4svh, 2.25rem);
  padding-inline: clamp(1.25rem, 2.4vw, 2.25rem);
}

/* a form is the sheet's body, not a box inside it — it inherits the column so
   the scroll region and the actions behave identically whether the DOM wraps
   them in a <form> or drops them straight into the dialog. `.note-form` is
   excluded: it is a two-control row inside the notes dialog, not a body. */
.dialog > form:not(.note-form) {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
}

/* THE WIDTH ASSIGNMENTS — each family names its step and why (§4.18) */
.dialog:has(.manual-edit-input),
.dialog:has(.detail-copy)        { --dlg-w: var(--dlg-xs); }  /* one value / one document */
.dialog:has(.settings-groups),
.dialog:has(.create-founder-form){ --dlg-w: var(--dlg-m);  }  /* settings index / 2-col form */
.dialog:has(.search-results)     { --dlg-w: var(--dlg-l);  }  /* three-column scanning index */
/* everything else — decision, message, support, notes, stages, history — stays
   at `s`: one writing surface, or one column of records with a rail beside it.
   History was tried at `m` and left a dead right half on a short log (§10.2/18);
   the time rail plus one line of detail is an `s` object. */


/* ═══════════════════════════════════════════ CLOSE — layout only (§9.2 N)
   Identity owns its look. Two things are wrong for it in context and both are
   geometry: it holds the word "Close", not a glyph, so a fixed 2.75rem square
   would clip it — it keeps the square's height and the 44px floor as its
   minimum width, and grows to its label. And it belongs in the sheet's top
   corner, inside the padding, out of the masthead's column. */

.close-button {
  position: absolute;
  inset-block-start: clamp(.75rem, 1.6svh, 1.125rem);
  inset-inline-end: clamp(.75rem, 1.2vw, 1.125rem);
  z-index: 1;
  width: auto;
  padding-inline: var(--sp-12);
}


/* ══════════════════════════════════════════════════ THE MASTHEAD (§5.12 §9.1)
   Kicker → title → lead, as one compact mass with three ranked gaps, not three
   evenly spaced lines. The kicker is the only thing in a modal that says which
   record you are standing in, so it is `--muted` and readable rather than the
   old `--faint` 10px whisper (§5.12: where you are is always readable). The
   title is capped on both axes so a wide monitor grows air, not letters
   (§4.20). The lead is running prose: `--body`, real line-height, bounded to
   one reading measure (§9.1) — it was grey 14px.

   Both the kicker and the title reserve the close button's column so a long
   title never runs under it (§9.7). */

.dialog-kicker {
  padding-inline-end: calc(var(--ctl-h-sm) + var(--sp-16));
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1.2;
}

.dialog h2 {
  margin-block-start: var(--sp-4);          /* kicker → title: tightest pair */
  padding-inline-end: calc(var(--ctl-h-sm) + var(--sp-16));
  font-size: clamp(1.4rem, min(1.176rem + .9vw, 3.4svh), 1.96rem);
  font-weight: 800;
  line-height: 1.18;
  letter-spacing: -.02em;
  color: var(--ink);
  text-wrap: balance;
  overflow-wrap: break-word;
}

.dialog-lead {
  margin-block-start: var(--sp-8);          /* title → lead: still one group */
  max-width: var(--copy-max);
  font-size: clamp(1.05rem, 1.008rem + .2vw, 1.19rem);
  font-weight: 400;
  line-height: 1.5;
  color: var(--body);
  white-space: pre-line;                    /* the prompt copy carries breaks */
}


/* ═══════════════════════════════════════ THE ACTIONS (§4.14 §9.2 — layout)
   Identity owns the buttons and the wrap/gap behaviour of the group. Two things
   are this section's: how far the group sits from the object it commits, and
   which edge it lands on. A block gap says "the work above is finished"; the
   end alignment puts the commitment at the object's own trailing edge, which is
   where a hand leaves a writing surface or a form (§4.14). `flex: none` keeps
   the group on the sheet's bottom edge while the region above it scrolls, so
   the one commitment the moment earns is never what scrolls away. */

.dialog-actions {
  margin-block-start: var(--block-gap-y);
  justify-content: flex-end;
  flex: none;
}


/* ═════════════════════════ THE GAP LEDGER — where each body begins (§4.1)
   Every dialog body starts at one of two ranked steps, never at one mechanical
   gap. A block step means a new group begins after the masthead; a group step
   means the body belongs to the control immediately above it. */

.message-thread,
.support-list,
.history-list,
.stage-menu-list,
.settings-groups,
.detail-copy,
.decision-form label,
.create-founder-form .form-grid,
.note-form,
.search-input        { margin-block-start: var(--block-gap-y); }

/* the one body that answers to the control directly above it rather than to the
   masthead: results belong to the query typed into the field, and pulling them
   away from it would break that. */
.search-results      { margin-block-start: var(--group-gap-y); }
.plain-list          { margin-block-start: var(--block-gap-y); }

/* the four bodies that are the sheet's scroll region (§4.22 step 6, §9.4).
   `min-height: 0` is what lets a flex child shrink below its content and
   scroll. The small inline padding is what keeps a focus ring from being
   clipped at the scrollport edge; the container itself stays full width, so the
   brand hairline above these lists still lands on the masthead's rail (§9.7). */
.message-thread,
.support-list,
.plain-list,
.history-list,
.stage-menu-list,
.search-results,
.settings-groups,
.detail-copy,
.create-founder-form .form-grid {
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding-inline: var(--sp-4);
}

/* the app's header rail, borrowed (§4.8): one brand pixel between the masthead
   and an index. It is deliberately NOT given to history (it carries a spine),
   support (it carries case edges) or settings (its three groups carry their own
   rails) — a second brand line in a sheet this small would be a divider stack. */
.stage-menu-list,
.search-results,
.message-thread,
.plain-list {
  border-top: var(--hair) solid var(--brand);
  padding-block-start: var(--sp-16);
}


/* ══════════════════════════════════════════════════════════════════════════
   FAMILY 1 — WRITE A REASON   (decision, manual edit)
   §4.11 "Writing a substantial answer": the writing surface is the dominant
   object, not a small field under a giant heading.
   ══════════════════════════════════════════════════════════════════════════ */

.decision-form label {
  display: grid;
  gap: var(--sp-8);                    /* label → field: the tightest pair */
  align-content: start;
  min-width: 0;
}

/* THE REASON SURFACE — the most consequential writing in the product.
   It was `min-height: 110px` under a 10px micro-cap. Height answers to viewport
   height, never width (§4.5A): ~19rem on a 1080 monitor, ~14rem on a 768 laptop,
   an 11rem floor, an 18rem cap so it never outgrows its sheet. Identity owns
   its fill, ring, focus ring, line-height and resize grip; only the room is set
   here, and the room is the whole point (§9.2: when the local control IS the
   task, the whole object becomes much larger). */
.decision-form textarea {
  min-height: clamp(11rem, 32svh, 18rem);
}

/* MANUAL EDIT — the same form class, and it must not read as the same dialog.
   The object is one saved value, so the sheet takes the narrowest step in the
   ladder and the field is capped to the shape of a value rather than stretched
   the full width of the sheet (§9.1: do not stretch every child to fill).
   Arrangement only — height, fill, ring and type are identity's. */
.manual-edit-input {
  max-width: min(100%, 26rem);
}


/* ══════════════════════════════════════════════════════════════════════════
   FAMILY 2 — NAVIGATE   (stage menu, search)
   ══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────── THE STAGE MENU — the product's wayfinding
   (§5.12 where you are and how to get back; §4.16 two independent cues;
    §10.2/5 grayscale; §10.2/6 selected with the pointer elsewhere)

   Three states, three textures, before any colour is involved:

     available  a quiet `--grey-lightest` field under the row — ground you can
                stand on. Mid-tone mark, full-contrast title.
     active     §1's exact selection treatment — `--brand-5` fill, `--brand`
                ring, `--brand` mark — plus two cues that survive grayscale: the
                row is physically taller and its title is a size larger (§4.17
                importance = area). §1 is precise that a selected option keeps
                `--ink` text and takes brand on its border, mark and action word;
                the title is therefore NOT recoloured.
     locked     no field at all. The row sits on bare white with the smallest,
                palest mark — not yet paved, rather than broken. Its title stays
                `--muted` and completely readable; there is no `opacity` here,
                because dimming is what made these read as failures.

   Cover the copy and remove the colour: one row is ringed and tall, nine sit on
   grey slabs, one sits on nothing. The state is legible from the silhouette. */

.stage-menu-list {
  display: grid;
  gap: var(--sp-4);
}

.stage-menu-list > button {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-8) var(--sp-16);
  width: 100%;
  min-height: var(--ctl-h-sm);           /* wayfinding sits near the 44px floor
                                            (§9.2 N) so more of an eleven-stage
                                            workflow is visible without scrolling */
  padding: var(--sp-8) var(--sp-16);
  border: var(--bw) solid transparent;   /* the ring is reserved, so selecting
                                            a stage never nudges the list */
  border-radius: var(--radius);
  background: none;
  text-align: left;
}

/* the stop mark — a decorative square, the leading cue of every row */
.stage-menu-list > button::before {
  content: "";
  width: .5rem;
  height: .5rem;
  background: var(--grey-light);
  border-radius: var(--radius);
}

.stage-menu-list > button > span {
  display: grid;
  gap: var(--sp-4);
  min-width: 0;
}
.stage-menu-list > button strong {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.25;
}
.stage-menu-list > button small {
  font-size: 0.84rem;
  font-weight: 500;
  color: var(--faint);
  line-height: 1.3;
}
.stage-menu-list > button b {
  font-size: 0.91rem;
  font-weight: 700;
  letter-spacing: -.005em;
  color: var(--muted);
  white-space: nowrap;
}

/* available — ground under the row */
.stage-menu-list > button.available          { background: var(--grey-lightest); }
.stage-menu-list > button.available::before  { background: var(--sage); }

/* locked — no ground yet. Declared after `available` and before `active` so the
   cascade lands in state order without any specificity games. */
.stage-menu-list > button.locked          { background: none; cursor: default; }
.stage-menu-list > button.locked::before  { background: var(--grey-light); }
.stage-menu-list > button.locked strong   { color: var(--muted); font-weight: 600; }
.stage-menu-list > button.locked b        { color: var(--faint); }

/* active — §1 selection, plus size and mark scale as the two non-colour cues.
   The DOM carries `active available` together, so this must come last. */
.stage-menu-list > button.active {
  background: var(--brand-5);
  border-color: var(--brand);
  padding-block: var(--sp-12);
  min-height: calc(var(--ctl-h) + var(--sp-8));
}
.stage-menu-list > button.active::before {
  background: var(--brand);
  width: .875rem;
  height: .875rem;
}
.stage-menu-list > button.active strong { font-size: 1.19rem; }
.stage-menu-list > button.active small  { color: var(--muted); }
.stage-menu-list > button.active b      { color: var(--brand); }


/* ───────────────────────────────────────── SEARCH — the scanning index
   The task is scanning, so the results are the tall object and the query field
   is the control that feeds them. The field grows past `--field-h` because it
   is the task control that IS the task (§9.2), and the results take the widest
   step in the ladder because they carry three genuinely different columns:
   what kind of thing it is, what it is called, and what is true about it.

   Rows use the product's own table language — an alternating `--grey-lightest`
   field instead of a divider under every row (§4.2, §7.2). The third column
   truncates rather than wrapping, because in a scanning list it is a label, not
   data (§9.4), and uniform row height is what makes the list scannable. */

.search-input {
  min-height: calc(var(--field-h) + var(--sp-12));
}

.search-results > button {
  display: grid;
  grid-template-columns: minmax(4.5rem, 6rem) minmax(0, 1.15fr) minmax(0, 2fr);
  align-items: baseline;
  gap: var(--sp-4) var(--col-gap);
  width: 100%;
  min-height: var(--ctl-h-sm);
  padding: var(--sp-12) var(--sp-16);
  border-radius: var(--radius);
  text-align: left;
}
.search-results > button:nth-of-type(even) { background: var(--grey-lightest); }

.search-results small {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
  line-height: 1.3;
}
.search-results strong {
  min-width: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  overflow-wrap: break-word;
}
.search-results span {
  min-width: 0;
  font-size: 0.91rem;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* NOTHING FOUND — empty space that belongs to the composition (§4.13).
   A real statement on a quiet field with room around it, at lede scale, rather
   than a grey line where a row would have been. */
.empty {
  padding-block: clamp(2rem, 9svh, 3.5rem);
  padding-inline: var(--sp-16);
  background: var(--grey-lightest);
  border-radius: var(--radius);
  text-align: center;
  font-size: clamp(1.05rem, 1.008rem + .2vw, 1.19rem);
  font-weight: 500;
  color: var(--muted);
}


/* ══════════════════════════════════════════════════════════════════════════
   FAMILY 3 — READ A RECORD   (message, support, notes, history, detail)
   Four lists that were four near-identical bordered stacks. Four rhythms now
   (§4.12): banded speech / id-railed cards / open paragraphs / dense timeline.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── A CONVERSATION — banded speech blocks in a narrow column
   Meta above, body in a `--grey-lightest` field at 46ch, delivery state below.
   The band belongs to the message, not to the row, so the blocks read as
   utterances rather than table rows. Wide gaps between articles; a conversation
   breathes where a log does not. */

.message-thread {
  display: grid;
  gap: var(--block-gap-y);
  align-content: start;
}
.message-thread article {
  display: grid;
  gap: var(--sp-8);
  justify-items: start;
  min-width: 0;
}
.message-thread article span {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--muted);
  line-height: 1.3;
}
.message-thread article p {
  max-width: min(100%, 46ch);
  padding: var(--sp-12) var(--sp-16);
  background: var(--grey-lightest);
  border-radius: var(--radius);
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--body);
}
.message-thread article small {
  font-size: 0.77rem;
  font-weight: 500;
  color: var(--faint);
  line-height: 1.3;
}

/* the reply box is deliberately smaller than the reason box in FAMILY 1: a
   reply is a line or two, a reason is a paragraph, and the two writing surfaces
   should not claim the same importance (§4.17). Height-driven (§4.5A). */
.dialog:has(.message-thread) textarea {
  margin-block-start: var(--block-gap-y);
  min-height: clamp(5rem, 14svh, 7.5rem);
  flex: none;
}


/* ── OPEN CASES — id-railed cards with a "waiting on someone" edge
   A case is an object with a number, so the number gets its own rail and the
   subject and its state stack beside it. Each row sits on a quiet field with a
   `--sage` leading edge — the same cue `.record-row.waiting` already carries in
   the workspace, which is exactly what an open case is (§7.1). Separation is a
   gap between cards, not a divider under each one. */

.support-list {
  display: grid;
  gap: var(--sp-8);
  align-content: start;
}
.support-list > button {
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr);
  align-items: center;
  gap: var(--sp-4) var(--sp-24);
  width: 100%;
  min-height: var(--ctl-h);
  padding: var(--sp-12) var(--sp-16);
  padding-inline-start: calc(var(--sp-16) - var(--bw));
  border-left: var(--bw) solid var(--sage);
  border-radius: var(--radius);
  background: var(--grey-lightest);
  text-align: left;
}
.support-list > button > span {
  grid-column: 1;
  grid-row: 1 / span 2;
  font-size: 0.84rem;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--faint);
  white-space: nowrap;
}
.support-list > button > strong {
  grid-column: 2;
  grid-row: 1;
  min-width: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}
.support-list > button > small {
  grid-column: 2;
  grid-row: 2;
  min-width: 0;
  font-size: 0.84rem;
  font-weight: 500;
  color: var(--muted);
  line-height: 1.35;
}


/* ── INTERNAL NOTES — open hanging paragraphs
   The most open of the four: no fills, no rails, no bands. Author and date sit
   above as a quiet locator; the note itself is running text at reading measure
   with real line-height. Notes are prose someone wrote, and they are set as
   prose (§4.8: space before background, background before border). */

.plain-list {
  display: grid;
  gap: var(--block-gap-y);
  align-content: start;
}
.plain-list li {
  display: grid;
  gap: var(--sp-4);
  min-width: 0;
}
.plain-list li strong {
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
  line-height: 1.3;
}
.plain-list li span {
  max-width: var(--copy-max);
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--body);
}

/* the add-a-note row — a field and its commit on one rail, bottom-aligned so
   the `--field-h` input and the taller `--ctl-h` primary land on one line
   (§9.7). This is a task-local control attached to the list it files into. */
.note-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: var(--sp-8) var(--sp-12);
  flex: none;
}


/* ── ACTIVITY HISTORY — a dense, brand-spined timeline
   The densest of the four, and the only one with a continuous line: a single
   `--hair` brand pixel down the left is §1's one legal divider used once, and
   it says "immutable, continuous record" better than the words above it. The
   timestamp holds its own rail in tabular figures so dates form a scannable
   column (§4.11); the event and its detail stack beside it. Row rhythm is the
   group gap — deliberately tighter than the notes list above, so a log and a
   set of notes are different objects at thumbnail size (§4.12). */

.history-list {
  display: grid;
  gap: var(--group-gap-y);
  align-content: start;
  border-left: var(--hair) solid var(--brand);
  padding-inline-start: var(--sp-16);
}
.history-list li {
  display: grid;
  grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr);
  gap: var(--sp-4) var(--col-gap);
  min-width: 0;
}
.history-list time {
  grid-column: 1;
  grid-row: 1 / span 2;
  align-self: start;
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--faint);
  line-height: 1.4;
}
.history-list strong {
  grid-column: 2;
  min-width: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}
.history-list span {
  grid-column: 2;
  min-width: 0;
  font-size: 0.91rem;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.45;
  overflow-wrap: break-word;              /* receipt ids wrap, never overflow */
}


/* ── A STORED DOCUMENT — a reading page
   A <pre> whose content is prose the Founder wrote. It keeps `pre-wrap` so the
   record's own paragraph breaks survive, drops the UA monospace face (Satoshi
   is the only face in the product, §3), and sits on a quiet field so it reads
   as stored content rather than as chrome. Measure is capped at `--copy-max`
   and the sheet takes the narrowest step in the ladder, so the two agree. */

.detail-copy {
  max-width: var(--copy-max);
  padding: var(--sp-16);
  background: var(--grey-lightest);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.65;
  color: var(--body);
  white-space: pre-wrap;
  overflow-wrap: break-word;
}


/* ── A SINGLE RECORD ROW inside a dialog
   Not present in the current DOM, but it is this section's selector and it must
   not fall back to browser defaults if it returns. It follows the same quiet-
   field row language as the case cards, minus the state edge. */

.simple-record {
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-4) var(--col-gap);
  width: 100%;
  min-height: var(--ctl-h);
  margin-block-start: var(--block-gap-y);
  padding: var(--sp-12) var(--sp-16);
  border-radius: var(--radius);
  background: var(--grey-lightest);
  text-align: left;
}
.simple-record > * { min-width: 0; }
.simple-record strong { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
.simple-record small,
.simple-record span   { font-size: 0.84rem; font-weight: 500; color: var(--muted); line-height: 1.4; }


/* ══════════════════════════════════════════════════════════════════════════
   FAMILY 4 — FILL A FORM   (create Founder)
   Same rules as the rest of the product: a label directly above its field,
   comfortable fields, and widths that state what each field holds.
   ══════════════════════════════════════════════════════════════════════════ */

.create-founder-form label {
  display: grid;
  gap: var(--sp-8);
  align-content: start;
  min-width: 0;
}
/* the hint clings to the control it qualifies rather than floating a full
   label-gap below it (§4.1: the tightest relationship gets the tightest gap) */
.create-founder-form label small { margin-block-start: calc(var(--sp-4) * -1); }

/* A TWELVE-TRACK GRID, NOT TWO EQUAL HALVES (§4.11, §9.1).
   The old form sliced every field into an identical 50% slot, so a phone number
   got exactly as much room as an email address. Spans are set by what each
   field actually holds and the row shapes deliberately alternate — 5/7, 7/5,
   12, 7/5 — so the form has rhythm instead of a checkerboard. DOM order is
   untouched; no `order` is used, so tab order stays reading order. */
.create-founder-form .form-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: var(--col-gap);
  row-gap: var(--group-gap-y);
  align-items: start;                      /* fields land on the label rail. One
                                              label carries a trailing hint, and
                                              end-alignment would push its
                                              neighbour's field off that rail
                                              (§9.7) */
}
.create-founder-form .form-grid > label                     { grid-column: span 12; }
.create-founder-form .form-grid > label:has([name="name"])  { grid-column: span 5; }
.create-founder-form .form-grid > label:has([name="email"]) { grid-column: span 7; }
.create-founder-form .form-grid > label:has([name="company"]) { grid-column: span 7; }
.create-founder-form .form-grid > label:has([name="phone"])   { grid-column: span 5; }
/* location keeps the full row: it is a combobox whose placeholder is a
   sentence, and truncating an address field is exactly what §9.4 forbids */
.create-founder-form .form-grid > label:has([name="location"]) { grid-column: span 12; }
.create-founder-form .form-grid > label:has([name="campaign"]) { grid-column: span 7; }
.create-founder-form .form-grid > label:has([name="owner"])    { grid-column: span 5; }

.form-note {
  margin-block-start: var(--block-gap-y);
  max-width: var(--copy-max);
  flex: none;
}


/* ══════════════════════════════════════════════════════════════════════════
   SETTINGS — a dense reference index that has to be able to be tall
   (§5.12 "dense reference surfaces", §4.22 step 6, §9.4)
   ══════════════════════════════════════════════════════════════════════════ */

.settings-groups {
  display: grid;
  gap: var(--block-gap-y);
  align-content: start;
}
.settings-groups section { min-width: 0; }

/* the globally-owned section header rail, tuned for this context only: inside a
   scrolling index the rail sits closer to the rows it labels than it does on a
   full workspace page. Nothing about the heading, qualifier or hairline is
   redefined — only the two gaps around them. */
.settings-groups section > header {
  padding-bottom: var(--sp-8);
  margin-bottom: var(--sp-8);
}

/* fourteen rows used to carry fourteen dividers. They now sit directly on the
   page and are separated by an alternating quiet field — the product's own row
   language (§4.2, §7.2), and the same treatment `.record-row` already has. */
.settings-groups article {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-8) var(--sp-24);
  min-height: var(--ctl-h);
  padding: var(--sp-12) var(--sp-16);
  border-radius: var(--radius);
}
.settings-groups article:nth-of-type(even) { background: var(--grey-lightest); }
.settings-groups article > div { display: grid; gap: var(--sp-4); min-width: 0; }
.settings-groups article strong {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}
.settings-groups article p {
  max-width: var(--copy-max);
  font-size: 0.91rem;
  font-weight: 400;
  line-height: 1.45;
  color: var(--muted);
}

/* ── THE DANGER ROW — irreversible account actions (§4.7, §4.17, §1)
   It used to be identical to "Export account record". It is separated by
   composition and position, never by inventing a red the palette does not
   contain:

     · position — a full block gap lifts it clear of the routine rows, so it
       stops reading as the next item in a list;
     · ground   — it is the one row in the index with no field under it, so the
       alternating rhythm visibly stops before it;
     · geometry — it drops the `1fr auto` row and stacks, giving the action its
       own line at the start rail rather than a quiet slot at the end. A
       destructive commit should cost a deliberate, separate reach (§4.17);
     · mark     — a `--dark` leading edge. Dark green is already the product's
       destructive/exception colour: 15-identity gives `.danger-row button` and
       `.pv-btn--danger` exactly this ink, and `.record-row.waiting` already
       establishes the leading-edge rail as product language.

   Qualified as `article.danger-row` so it out-specifies the alternating band
   rather than depending on source order. */
.settings-groups article.danger-row {
  grid-template-columns: minmax(0, 1fr);
  justify-items: start;
  gap: var(--sp-12);
  margin-block-start: var(--block-gap-y);
  padding-block: var(--sp-16);
  padding-inline-start: calc(var(--sp-16) - var(--bw));
  border-left: var(--bw) solid var(--dark);
  background: none;
}


/* ══════════════════════════════════════════════════════ THE TOAST (§1 §8.1)
   §1 gives the treatment exactly: an accent field, `--darker` header and icon,
   `--ink-50` body. The admin toast confirms that a system action completed —
   a neutral system note — so it takes accent blue; accent yellow is reserved
   for "needs attention" and would be a lie here. One accent band on screen at a
   time, which is all a single toast ever is.

   It is a confirmation, not a container: no border, no shadow (§1 absolute).
   The icon is the one decorative mark — a `--darker` square, the same nested
   geometry the placeholder system uses, never an injected word.

   Safe area (§8.1): the toast never sits under system UI, and on phone it also
   clears the height of the docked primary action so a confirmation never covers
   the control that produced it. */

.toast {
  position: fixed;
  z-index: 90;
  inset-block-end: calc(env(safe-area-inset-bottom, 0px) + var(--sp-24));
  inset-inline-end: var(--gutter-x);
  display: flex;
  align-items: center;
  gap: .6em;
  max-width: min(28rem, calc(100% - var(--gutter-x) * 2));
  padding: var(--sp-12) var(--sp-16);
  border-radius: var(--radius);
  background: var(--accent-blue);
  color: var(--darker);
  font-size: 0.98rem;
  font-weight: 700;
  line-height: 1.35;
}
.toast::before {
  content: "";
  width: .5rem;
  height: .5rem;
  background: var(--darker);
  border-radius: var(--radius);
  flex: none;
}
/* when the runtime attaches a supporting line, it is body copy on the accent
   field: `--ink-50`, per §1 */
.toast > span,
.toast > small,
.toast > p {
  font-weight: 500;
  color: var(--ink-50);
}


/* ══════════════════════════════════ RESPONSIVE — §8, §8.0A, §8.1, §8.3

   Above 600px almost nothing is needed, and that is the point: every width in
   this file is a `min(100%, …)` cap, every grid is intrinsic (`minmax(0,1fr)`
   tracks and a 12-track span grid), and every height that matters is driven by
   `svh` rather than `vw` (§4.5A). Sweeping 1920 → 1536 → 1366 → 1024 → 768, the
   sheets hold their ladder step, gain air rather than line length (§9.1), and
   the tall ones — settings, history, search, stages — trade sheet height for
   internal scroll continuously, never for smaller type (§4.22, §9.1).

   At 768 the wide search sheet is already width-capped by the gutter, and the
   three-column result row is still comfortably above its 4.5rem + two `minmax(0)`
   minimums. Below that the topology genuinely has to change, twice. */

/* ── the row-to-stack line: dense multi-column rows lose their columns before
   they lose their legibility (§4.22 step 4). Each row keeps its own reading
   order and every local control stays attached to its object (§8.3). */
@media (max-width: 760px) {
  .search-results > button {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--sp-4);
  }
  .search-results span { white-space: normal; overflow: visible; }

  .history-list li {
    grid-template-columns: minmax(0, 1fr);
  }
  .history-list time { grid-column: 1; grid-row: auto; }
  .history-list strong,
  .history-list span { grid-column: 1; }

  .settings-groups article {
    grid-template-columns: minmax(0, 1fr);
    justify-items: start;
    gap: var(--sp-8);
  }

  /* the 12-track form collapses to one field per row rather than to a pair of
     unreadable half-tracks; the location combobox was already full-row */
  .create-founder-form .form-grid > label { grid-column: span 12; }
}

/* ── THE PHONE LINE — every dialog becomes a bottom sheet (§8.1)
   Pinned to the bottom edge, full width, up to 85svh, padded for the device
   safe area. The masthead stays at the top of the sheet and the actions stay on
   its bottom edge under the thumb — because the sheet is a flex column whose
   scrolling region is in the middle, the actions never cover content and never
   scroll away (§8.1, §9.3). Hierarchy survives the change of posture: the
   reason surface is still the largest object in its sheet, the active stage is
   still the only ringed row, and the settings index still scrolls internally
   rather than pushing its own header off the screen (§8.3). */
@media (max-width: 600px) {
  .overlay {
    align-items: end;
    justify-items: stretch;
    padding: 0;
  }

  .dialog {
    width: 100%;
    max-width: 100%;
    max-height: 85svh;
    padding-block-start: var(--sp-24);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-16));
    padding-inline: var(--sp-16);
  }

  /* the sheet's grab affordance — a decorative mark, never a word */
  .dialog::before {
    content: "";
    position: absolute;
    inset-block-start: var(--sp-8);
    inset-inline: 0;
    width: 2.5rem;
    height: .25rem;
    margin-inline: auto;
    background: var(--grey-light);
    border-radius: var(--radius);
  }

  /* both actions stay reachable at the sheet's outer edges — the dismissal
     under the left thumb, the commitment under the right (§8.1) */
  .dialog-actions { justify-content: space-between; }

  /* the note row stacks so neither the field nor its commit is squeezed below a
     comfortable target (§9.2 — 44px is the floor, not the goal) */
  .note-form { grid-template-columns: minmax(0, 1fr); }

  /* the record spine tightens rather than disappearing: on a phone it is still
     the thing that says these events are one continuous record (§4.9) */
  .history-list { padding-inline-start: var(--sp-12); }

  /* the toast clears the docked primary action as well as the safe area, so a
     confirmation never lands on top of the control that caused it (§8.1) */
  .toast {
    inset-inline: var(--sp-16);
    inset-block-end: calc(env(safe-area-inset-bottom, 0px) + var(--cta-h) + var(--sp-16));
    max-width: none;
  }
}



/* ══════ 90-integration.css ══════ */
/* ============================================================================
   PROOVD ADMIN — 90-INTEGRATION
   The last layer. Everything here came out of QA on the assembled page, not
   out of any one section's brief: the phone posture that only exists once all
   the sections are stacked together, and the two hand-offs section owners
   flagged because the selector sat on the other side of their boundary.

   Kept separate from the section files on purpose — these are integration
   decisions, and they should be reviewable as such.
   ========================================================================= */


/* ═══════════════════════════════════════ §8.1 THE DOCK — the phone posture

   §8.1 is explicit and no single section could implement it, because the rule
   spans the stage body and the page frame at once: on phone the moment's ONE
   primary action docks to the bottom edge — fixed, full width, on solid
   `--page` (no gradient fade), padded for the safe area — so the next-best
   action is always under the thumb. On desktop the very same control renders
   as a normal row in its context; the dock is a posture, not a component.

   §4.14 allows this as the one exception to CTA gravity, on the condition that
   the action stays semantically attached: the actionbar itself stays in the
   flow with its explanatory line and its secondary actions, so the sentence
   that makes the commitment safe is still visible directly above the button
   that commits it. Only the button travels.

   The reservation lives on `.actionbar`, not on the shell, so a stage without
   a progression action (Live) reserves nothing and grows no dead space. */

@media (max-width: 600px) {
  :root { --dock-h: calc(var(--cta-h) + var(--sp-24)); }

  .actionbar {
    /* the page reserves space beneath the dock — content never hides under it */
    padding-block-end: calc(var(--dock-h) + env(safe-area-inset-bottom));
  }

  .actionbar .primary {
    position: fixed;
    z-index: 60;
    inset-inline: 0;
    inset-block-end: 0;
    width: 100%;
    min-width: 0;
    border-inline-width: 0;
    border-block-end-width: 0;
    border-radius: 0;
    /* solid, never a gradient fade (§1) */
    background: var(--brand);
    padding-block: 0;
    padding-inline: var(--gutter-x);
    height: calc(var(--cta-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* the docked action owns the bottom edge, so the internal test furniture
     stands above it rather than fighting it for the same thumb (§9.7) */
}


/* ═════════════════════════════════ §8.1 PHONE CHROME — compress, never collapse

   Stacked, the four chrome bands were taking two thirds of a 390×844 screen
   before the stage said anything. §8.1 asks for whitespace that compresses
   proportionally and a focal point in every screenful; §9.3 asks that the
   moment's hero be readable without a discovery scroll.

   Nothing is hidden and nothing moves to a drawer — the six reference facts,
   the identity block and all six tools stay exactly where they are. Only the
   air between them tightens, which is the compression §8.1 actually asks for. */

@media (max-width: 600px) {
  .topbar {
    min-height: 0;
    padding-block: var(--sp-12);
  }

  .recordbar {
    padding-block-start: var(--sp-16);
    padding-block-end: var(--sp-12);
    row-gap: var(--sp-8);
  }

  .founder-glance {
    padding-block: var(--sp-12);
    row-gap: var(--sp-8);
  }

  /* the stage stage-pad already answers to height; on a phone the band above it
     is doing the same job, so the doubled breath is what has to go */
  .workspace {
    padding-block-start: var(--sp-24);
  }
}


/* ═════════════════════════ HAND-OFF 1 — the actionbar is not another group

   `24-record-system.css` owns `.record-groups` and sets the vertical rhythm
   for every section inside it, including sections belonging to other files. It
   correctly flagged that `.actionbar` inherits that rhythm and therefore reads
   as one more group in the list, when it is the stage's commitment — the thing
   the whole screen was building toward (§4.14, §4.1: major transitions get
   noticeably more separation than sections do). The selector crossed its
   boundary, so the step belongs here. */

.record-groups > .actionbar,
.workspace-inner > .actionbar {
  margin-block-start: var(--section-gap-y);
}


/* ═════════════════════════ HAND-OFF 2 — `.close-button` carries a word

   `15-identity.css` sizes `.close-button` as a fixed square alongside the two
   glyph buttons (`☰`, `⚙`), but this one holds the word "Close", which
   overflows a square. `42-overlays.css` corrected the width inside the dialog;
   this generalises it so the control is never clipped wherever it appears. */

.close-button {
  width: auto;
  min-width: var(--ctl-h-sm);
  padding-inline: var(--sp-12);
  font-size: 0.91rem;
  font-weight: 600;
}


/* ═════════════════════════ §6.6 REDUCED MOTION — nothing may depend on motion

   The GSAP layer plays the stage entrance by tweening opacity from 0. If a
   user has reduced motion on, that timeline never runs and the start state is
   never written — so content is visible either way. This is the belt to that
   braces: whatever happens in the motion layer, no element in the workspace is
   allowed to stay invisible when motion is off. */

@media (prefers-reduced-motion: reduce) {
  .workspace-inner > *,
  .directory > * {
    opacity: 1 !important;
    transform: none !important;
  }
}


/* ═════════════════════════════════════════ WEIGHT AND AIR — a lighter setting

   The first build read as too bold and too tight: every weight sat a step
   heavier than it needed to and the rows were packed. Every declared
   font-weight in the stylesheet has since been stepped down one notch at
   source (900→800, 800→700, 700→600, 600→500, 500→400), and the vertical
   rhythm tokens in 10-foundation opened up.

   What is left here is the part the tokens do not reach: browser-default bold
   on the bare `<strong>`/`<b>` the product's markup is full of, and the inside
   of a row, which several section files pad themselves. */

strong, b { font-weight: 600; }

/* rows breathe — the value, its provenance line and its controls were sitting
   right on top of each other (§4.1: related elements still need their 4–24px) */
.record-row,
.compact-table-row,
.recap-row,
.founder-table-row {
  padding-block: 1.25rem;
  row-gap: var(--sp-8);
}

/* a header rail is a label, not a second heading — let it sit lighter and
   further off the content it introduces */
.record-table-head,
.compact-table-head,
.recap-table-head,
.founder-table-head {
  padding-bottom: var(--sp-12);
  letter-spacing: .12em;
}

/* the state strip and the glance band are reference, so they whisper */
.state-strip strong,
.founder-glance strong { font-weight: 600; }

/* tags carry their own weight badly at small sizes — one step lighter again */
.status-tag { font-weight: 600; }


/* ═══════════════════════════════ ONE MEASURE — stop the stepped, off-centre look

   Measured on the Matching stage at 1600px, the stage was six different
   widths stacked on top of each other: the frame 1370, the heading 1184, the
   summary tiles 1184 but flush LEFT, the add-offer form 889, the offer list
   809, and the actionbar 592. Every block a different size, some centred and
   some not — which is exactly what reads as "off centre and too small".

   Each of those caps was defensible on its own (a form wants a comfortable
   measure), but the caps belong to the TEXT, not to the block. §4.18 asks for
   a small set of visible alignment rails that every element attaches to;
   §9.1's measure rule is about line length, and the paragraphs, labels and
   fields inside these blocks are already capped individually.

   So the working blocks now fill the stage frame and share its two rails, and
   the reading measure stays where it belongs — on the copy. */

.workspace-inner > *,
.directory > *,
.stage-heading,
.state-strip,
.attention-line,
.invite-prefill,
.prefill-section,
.record-groups,
.record-group,
.compact-state-grid,
.split-summary,
.decision-branch,
.final-summary,
.policy-note,
.inline-decision-panel,
.launch-recap-intro,
.recap-group,
.live-control-center,
.request-center,
.creator-post-section,
.compact-table-section,
.creator-records,
.matching-add-form,
.payout-path,
.path-steps,
.campaign-timeline,
.archive-actions,
.campaign-archive,
.actionbar,
.founder-table {
  max-width: none;
  width: 100%;
  margin-inline: auto;
}

/* the copy inside them keeps its measure — that is what §9.1 actually caps */
.stage-heading > p,
.policy-note > p,
.request-center article p,
.prefill-heading p,
.record-group > header p,
.creator-post-section > header p { max-width: var(--copy-max); }

/* ═════════════════════════════════════════════ BIGGER — it was reading small

   Every declared font-size in the stylesheet has been scaled up 12% at source.
   These are the few sizes that are structural rather than typographic, so they
   did not move with it: control heights and the fields the admin types into
   spend most of the day under a cursor and deserve the same increase. */

:root {
  --ctl-h:    clamp(3rem, 5.6svh, 3.5rem);
  --ctl-h-sm: 3rem;
  --field-h:  clamp(3.25rem, 6svh, 3.75rem);
  --cta-h:    clamp(3.75rem, 8svh, 5rem);
}


/* ══════════════════════════════ SPREAD THE ROW — grids must use the width now

   Widening the blocks to the frame rails moved the slack rather than removing
   it: the blocks got wider, but their inner grids kept tracks sized for the
   old narrow measure, so one track absorbed everything and the rest of the row
   sat empty. A creator record was 1370 wide with its six stats crammed into
   two columns and ~500px of nothing beside them.

   The fix is intrinsic, not fixed: these grids now lay out with `auto-fit` and
   a sensible minimum, so they take as many columns as the width honestly
   supports and reflow down on their own as it narrows (§4.22 — recompose, do
   not shrink). Nothing here sets a pixel width. */

/* A creator's stats were hard-placed into column 1 / column 2, which pinned
   them to two tracks no matter how much room the record had. Releasing the
   placement lets them flow into as many columns as the width supports —
   three on a laptop, two on a tablet, one on a phone — and each readout is
   explicitly labelled, so reading order across is as clear as down. */
.creator-record dl {
  grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr));
  gap: var(--group-gap-y) var(--col-gap);
}
/* The section author pinned each readout to an explicit column and row, which
   held them to two tracks however wide the record got. The reset has to carry
   the same specificity as those `nth-child` rules to win, so it rides along
   with them — and `order` preserves the priority that placement encoded
   (the percentage Admin set, then the Founder's answer, then read-only facts)
   while auto-placement takes as many columns as the width honestly supports. */
.creator-record dl > div:nth-child(1),
.creator-record dl > div:nth-child(2),
.creator-record dl > div:nth-child(3),
.creator-record dl > div:nth-child(4),
.creator-record dl > div:nth-child(5) {
  grid-column: auto;
  grid-row: auto;
}
.creator-record dl > div:nth-child(2) { order: 1; }   /* admin-set percentage */
.creator-record dl > div:nth-child(4) { order: 2; }   /* founder response */
.creator-record dl > div:nth-child(1) { order: 3; }   /* audience */
.creator-record dl > div:nth-child(3) { order: 4; }   /* founder dashboard */
.creator-record dl > div:nth-child(5) { order: 5; }   /* final campaign */

/* the record itself: identity gets a real column instead of a cramped 288px,
   and the stats take the rest */
@media (min-width: 900px) {
  .creator-record {
    grid-template-columns: minmax(15rem, 1fr) minmax(0, 2.6fr);
  }
  .creator-record.compact {
    grid-template-columns: minmax(15rem, 1fr) minmax(0, 2.6fr) auto;
  }
}

/* the three evidence facts on a post, and the campaign glance band, spread the
   same way rather than clustering at the left edge */
.post-review-facts {
  grid-template-columns: repeat(auto-fit, minmax(min(11rem, 100%), 1fr));
}

/* summary tile families fill their row — they were sized for a narrower block */
.compact-state-grid,
.split-summary,
.final-summary,
.state-strip,
.founder-glance,
.live-kpis {
  grid-auto-columns: minmax(0, 1fr);
}

/* a request's actions belong at the end of the record they act on, not floating
   in the middle of 900px of empty row */
.request-center article .inline-actions { justify-content: flex-end; }


/* ══════════════════════════════ A SELECT'S CARET IS PART OF ITS BACKGROUND

   The chooser's caret is drawn as a `background-image`. Any rule that touches
   the `background` SHORTHAND — even just to add a tint on focus — silently
   resets `background-repeat`, `background-position` and `background-size` to
   their initial values. The caret then came back from a later rule with
   `repeat / 0% 0% / auto` and tiled itself across the whole field, which is
   the field of chevrons that showed up on every focused dropdown.

   Every focus and hover fill in the stylesheet now uses `background-color`, so
   the icon layer is never disturbed. This restates the caret's geometry after
   the fact as well, so the field cannot tile again however it is restyled. */

select {
  background-repeat: no-repeat;
  background-position: right var(--sp-16) center;
  background-size: .75rem .5rem;
}
