name: proovd-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proovd
      POSTGRES_USER: proovd
      POSTGRES_PASSWORD: proovd_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - proovd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proovd -d proovd"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://proovd:proovd_local@postgres:5432/proovd
      STRIPE_MODE: test
      RESEND_BASE_URL: https://api.resend.com
      TRUST_PROXY_HOPS: 0
      DRAFT_VERIFY_LIMIT: 1000
      INVITATION_LINKS_REUSABLE: "true"
      DEVELOPMENT_STORAGE_DIR: /app/.development-storage
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - proovd_development_uploads:/app/.development-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  proovd_postgres_data:
  proovd_development_uploads:
